let excelPromise = null;
function loadExcel() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (excelPromise) return excelPromise;
  excelPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = EXCELJS_URL; s.async = true;
    const fail = () => { excelPromise = null; s.remove(); rej(new Error('The spreadsheet tool couldn’t load. Check your connection, or export as CSV.')); };
    const timer = setTimeout(fail, 25000);
    s.onload = () => { clearTimeout(timer); window.ExcelJS ? res(window.ExcelJS) : fail(); };
    s.onerror = () => { clearTimeout(timer); fail(); };
    document.head.appendChild(s);
  });
  return excelPromise;
}
/* time of day as an Excel fraction, so cells format as hh:mm */
const xlTime = ts => { const d = new Date(ts); return (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400; };

async function exportHours({job, from, to, fmt}) {
  const list = exportList(job, from, to);
  if (!list.length) { toast('Nothing to export in this period'); return; }
  const now = Date.now();
  const period = `${fmtDate(from, true)} – ${fmtDate(to - 1, true)}`;
  const groups = [];
  for (const j of [...state.jobs, null]) {
    const es = list.filter(e => (e.jobId || null) === (j ? j.id : null)).sort((a, b) => a.start - b.start);
    if (es.length) groups.push({name: j ? j.name : 'No job', rate: j ? j.rate : 0, cur: j ? j.currency : '', entries: es});
  }
  const single = groups.length === 1, anyRate = groups.some(g => g.rate);
  const sel = jobById(job);
  const slug = (sel ? sel.name : job === 'none' ? 'no-job' : 'all-jobs').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'hours';
  const base = `hours-${slug}-${dayKey(from)}-to-${dayKey(to - 1)}`;
  const hrs = e => ((e.end ?? now) - e.start) / 36e5;
  const weekday = ts => new Date(ts).toLocaleDateString(undefined, {weekday: 'short'});
  const title = single ? groups[0].name : 'All jobs';

  if (fmt === 'csv') {
    const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = (single ? [] : ['Job']).concat(['Date', 'Day', 'Task', 'Start', 'End', 'Hours'], anyRate ? ['Amount', 'Currency'] : [], ['Note']);
    const lines = [q(`${title} · ${period}`), '', head.map(q).join(',')];
    groups.forEach(g => g.entries.forEach(e => {
      const h = hrs(e);
      lines.push((single ? [] : [g.name]).concat([dayKey(e.start), weekday(e.start), entryLabel(e), hhmm(e.start), e.end == null ? 'running' : hhmm(e.end), h.toFixed(2)],
        anyRate ? [g.rate ? (h * g.rate).toFixed(2) : '', g.rate ? g.cur : ''] : [], [e.note || '']).map(q).join(','));
    }));
    downloadBlob(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), base + '.csv');
    toast(`Exported ${list.length} entries`);
    return;
  }

  let E;
  toast('Preparing spreadsheet…');
  try { E = await loadExcel(); }
  catch (err) { toast(err.message, {action: 'Export CSV', onAction: () => exportHours({job, from, to, fmt: 'csv'})}); return; }

  const C = {ink: 'FF16181D', muted: 'FF687080', head: 'FF2F45C8', headInk: 'FFFFFFFF', band: 'FFF4F5F8', section: 'FFE7EAF5', line: 'FFDCDFE5'};
  const fill = argb => ({type: 'pattern', pattern: 'solid', fgColor: {argb}});
  const moneyFmt = cur => cur ? `#,##0.00 "${cur.replace(/"/g, '')}"` : '#,##0.00';
  const exported = `Exported ${fmtDate(now, true)}`;
  const wb = new E.Workbook();
  wb.creator = 'Docket'; wb.created = new Date(now);
  const sheetOpts = {views: [{showGridLines: false}], pageSetup: {orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0}};
  const titleBlock = (ws, text, sub, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const t = ws.getCell(1, 1); t.value = text; t.font = {size: 16, bold: true, color: {argb: C.ink}};
    ws.getRow(1).height = 26;
    ws.mergeCells(2, 1, 2, cols);
    const s2 = ws.getCell(2, 1); s2.value = sub; s2.font = {size: 10, color: {argb: C.muted}};
    ws.getRow(3).height = 8;
  };
  const header = (ws, rowNo, values) => {
    const r = ws.getRow(rowNo); r.values = values; r.height = 20;
    r.eachCell(c => { c.font = {bold: true, color: {argb: C.headInk}}; c.fill = fill(C.head); c.alignment = {vertical: 'middle', horizontal: ['Hours', 'Share', 'Amount', 'Start', 'End'].includes(c.value) ? 'right' : 'left'}; });
    return r;
  };
  const section = (ws, rowNo, text, cols) => {
    ws.mergeCells(rowNo, 1, rowNo, cols);
    const c = ws.getCell(rowNo, 1); c.value = text; c.font = {bold: true, size: 12, color: {argb: C.ink}}; c.fill = fill(C.section);
    ws.getRow(rowNo).height = 20;
  };
  const totalStyle = (r, cols) => { for (let i = 1; i <= cols; i++) { const c = r.getCell(i); c.font = {bold: true}; c.border = {top: {style: 'thin', color: {argb: C.ink}}}; } };
  const lineStyle = (r, cols, banded) => { for (let i = 1; i <= cols; i++) { const c = r.getCell(i); c.border = {bottom: {style: 'hair', color: {argb: C.line}}}; if (banded) c.fill = fill(C.band); } };

  /* ---- Summary: hours per task, one table per job ---- */
  const sCols = anyRate ? 4 : 3;
  const sum = wb.addWorksheet('Summary', sheetOpts);
  sum.columns = [{width: 46}, {width: 11}, {width: 10}, {width: 17}].slice(0, sCols);
  titleBlock(sum, `${title} · hours by task`, `${period} · ${exported}`, sCols);
  let row = 4;
  const jobTotals = [];
  for (const g of groups) {
    if (!single) { section(sum, row, g.name, sCols); row++; }
    header(sum, row, ['Task', 'Hours', 'Share'].concat(anyRate ? ['Amount'] : [])); row++;
    const tasks = new Map();
    g.entries.forEach(e => { const k = taskKey(e); const t = tasks.get(k) || {name: entryLabel(e), h: 0}; t.h += hrs(e); tasks.set(k, t); });
    const sorted = [...tasks.values()].sort((a, b) => b.h - a.h);
    const gTotal = sorted.reduce((s, t) => s + t.h, 0);
    const first = row, last = row + sorted.length - 1, totalRowNo = last + 1;
    sorted.forEach((t, i) => {
      const r = sum.getRow(row);
      r.getCell(1).value = t.name;
      r.getCell(2).value = Number(t.h.toFixed(4)); r.getCell(2).numFmt = '0.00';
      r.getCell(3).value = {formula: `B${row}/B${totalRowNo}`, result: gTotal ? t.h / gTotal : 0}; r.getCell(3).numFmt = '0%';
      if (anyRate && g.rate) { r.getCell(4).value = {formula: `B${row}*${g.rate}`, result: t.h * g.rate}; r.getCell(4).numFmt = moneyFmt(g.cur); }
      lineStyle(r, sCols, i % 2 === 1);
      row++;
    });
    const tr = sum.getRow(row);
    tr.getCell(1).value = 'Total';
    tr.getCell(2).value = {formula: `SUM(B${first}:B${last})`, result: gTotal}; tr.getCell(2).numFmt = '0.00';
    if (anyRate && g.rate) { tr.getCell(4).value = {formula: `SUM(D${first}:D${last})`, result: gTotal * g.rate}; tr.getCell(4).numFmt = moneyFmt(g.cur); }
    totalStyle(tr, sCols);
    jobTotals.push({g, row, h: gTotal});
    row += 2;
  }
  if (!single) {
    section(sum, row, 'All jobs', sCols); row++;
    header(sum, row, ['Job', 'Hours', 'Share'].concat(anyRate ? ['Amount'] : [])); row++;
    const all = jobTotals.reduce((s, x) => s + x.h, 0), first = row, last = row + jobTotals.length - 1;
    jobTotals.forEach((x, i) => {
      const r = sum.getRow(row);
      r.getCell(1).value = x.g.name;
      r.getCell(2).value = {formula: `B${x.row}`, result: x.h}; r.getCell(2).numFmt = '0.00';
      r.getCell(3).value = {formula: `B${row}/B${last + 1}`, result: all ? x.h / all : 0}; r.getCell(3).numFmt = '0%';
      if (anyRate && x.g.rate) { r.getCell(4).value = {formula: `D${x.row}`, result: x.h * x.g.rate}; r.getCell(4).numFmt = moneyFmt(x.g.cur); }
      lineStyle(r, sCols, i % 2 === 1);
      row++;
    });
    const tr = sum.getRow(row);
    tr.getCell(1).value = 'Total';
    tr.getCell(2).value = {formula: `SUM(B${first}:B${last})`, result: all}; tr.getCell(2).numFmt = '0.00';
    const curs = [...new Set(groups.filter(g => g.rate).map(g => g.cur))];
    if (anyRate && curs.length === 1) { tr.getCell(4).value = {formula: `SUM(D${first}:D${last})`, result: groups.reduce((s, g) => s + (g.rate ? g.entries.reduce((a, e) => a + hrs(e), 0) * g.rate : 0), 0)}; tr.getCell(4).numFmt = moneyFmt(curs[0]); }
    totalStyle(tr, sCols);
  }

  /* ---- Details: every entry, grouped by day (one sheet per job) ---- */
  const used = new Set(['Summary']);
  const sheetName = n => { let b = n.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim() || 'Details', s = b, i = 2; while (used.has(s.toLowerCase())) s = b.slice(0, 28) + ' ' + i++; used.add(s.toLowerCase()); return s; };
  for (const g of groups) {
    const rate = g.rate, cols = rate ? 6 : 5;
    const ws = wb.addWorksheet(sheetName(single ? 'Details' : `${g.name} details`), {...sheetOpts, views: [{showGridLines: false, state: 'frozen', ySplit: 4}]});
    ws.columns = [{width: 42}, {width: 9}, {width: 9}, {width: 10}].concat(rate ? [{width: 16}] : [], [{width: 34}]);
    titleBlock(ws, `${g.name} · ${period}`, `Every entry, grouped by day · ${exported}`, cols);
    header(ws, 4, ['Task', 'Start', 'End', 'Hours'].concat(rate ? ['Amount'] : [], ['Note']));
    let r = 5;
    const byDay = new Map();
    g.entries.forEach(e => { const k = dayKey(e.start); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
    for (const [k, es] of byDay) {
      section(ws, r, new Date(parseISO(k)).toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}), cols); r++;
      const first = r;
      es.forEach((e, i) => {
        const h = hrs(e), row2 = ws.getRow(r);
        row2.getCell(1).value = entryLabel(e);
        row2.getCell(2).value = xlTime(e.start); row2.getCell(2).numFmt = 'hh:mm';
        if (e.end == null) row2.getCell(3).value = 'running'; else { row2.getCell(3).value = xlTime(e.end); row2.getCell(3).numFmt = 'hh:mm'; }
        row2.getCell(4).value = Number(h.toFixed(4)); row2.getCell(4).numFmt = '0.00';
        if (rate) { row2.getCell(5).value = {formula: `D${r}*${rate}`, result: h * rate}; row2.getCell(5).numFmt = moneyFmt(g.cur); }
        row2.getCell(cols).value = e.note || null; row2.getCell(cols).alignment = {wrapText: true, vertical: 'top'};
        lineStyle(row2, cols, i % 2 === 1);
        r++;
      });
      const dt = ws.getRow(r), dh = es.reduce((s, e) => s + hrs(e), 0);
      dt.getCell(1).value = 'Day total';
      dt.getCell(4).value = {formula: `SUM(D${first}:D${r - 1})`, result: dh}; dt.getCell(4).numFmt = '0.00';
      if (rate) { dt.getCell(5).value = {formula: `SUM(E${first}:E${r - 1})`, result: dh * rate}; dt.getCell(5).numFmt = moneyFmt(g.cur); }
      for (let i = 1; i <= cols; i++) dt.getCell(i).font = {bold: true, color: {argb: C.muted}};
      r += 2;
    }
    const gt = ws.getRow(r), gh = g.entries.reduce((s, e) => s + hrs(e), 0);
    gt.getCell(1).value = 'Total';
    gt.getCell(4).value = {formula: `SUMIF(A5:A${r - 1},"Day total",D5:D${r - 1})`, result: gh}; gt.getCell(4).numFmt = '0.00';
    if (rate) { gt.getCell(5).value = {formula: `SUMIF(A5:A${r - 1},"Day total",E5:E${r - 1})`, result: gh * rate}; gt.getCell(5).numFmt = moneyFmt(g.cur); }
    totalStyle(gt, cols);
  }

  try {
    const buf = await wb.xlsx.writeBuffer();
    downloadBlob(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), base + '.xlsx');
    toast(`Exported ${list.length} entries to ${base}.xlsx`);
  } catch (err) {
    console.error(err);
    toast('The spreadsheet couldn’t be created. Try CSV instead.', {action: 'CSV', onAction: () => exportHours({job, from, to, fmt: 'csv'})});
  }
}

/* ================= tags ================= */
const allCards = fn => state.categories.forEach(c => c.lists.forEach(l => l.cards.forEach(fn)));
const sortedTags = ids => state.tags.filter(t => ids.includes(t.id));
const tagLabel = t => t.name || TAG_COLOR_NAME[t.color];
function tagGroups() {
  const gs = [...new Set(state.tags.map(t => t.group))];
  return [...TAG_GROUP_ORDER.filter(g => gs.includes(g)), ...gs.filter(g => !TAG_GROUP_ORDER.includes(g))];
}
function cardsWithTag(id) { let n = 0; allCards(k => { if (k.tags.includes(id)) n++; }); return n; }

function openTagPicker(cardId, back) {
  let q = '';
  openSheet((inner, close) => {
    inner.innerHTML = `<div class="sheet-drag"><h2 class="sheet-title">Tags <span class="mono muted tp-count"></span></h2></div>`
      + `<input id="tag-q" class="field" placeholder="Search, or type a new tag and press Enter" autocomplete="off" enterkeyhint="done" aria-label="Search tags">`
      + `<div class="tp-body"></div>`
      + `<div class="sheet-actions"><button type="button" class="btn" data-x="manage">Manage tags</button><span class="grow"></span><button type="button" class="btn primary" data-x="done">Done</button></div>`;
    const draw = () => {
      const f = findCard(cardId); if (!f) { close(); return; }
      const sel = new Set(f.card.tags), ql = q.trim().toLowerCase();
      const body = tagGroups().map(g => {
        const ts = state.tags.filter(t => t.group === g && (!ql || tagLabel(t).toLowerCase().includes(ql)));
        return ts.length ? `<div class="tg">${esc(g)}</div><div class="label-pick">` + ts.map(t =>
          `<button type="button" class="lp${sel.has(t.id) ? ' on' : ''}" data-tag="${t.id}" style="--c:var(--l-${t.color})" aria-pressed="${sel.has(t.id)}"><i></i><span>${esc(tagLabel(t))}</span></button>`).join('') + `</div>` : '';
      }).join('');
      $('.tp-body', inner).innerHTML = body || (ql ? `<p class="empty sm">No tag called “${esc(q.trim())}”. <button type="button" class="link" data-x="create">Create it</button></p>` : '<p class="empty sm">No tags yet.</p>');
      $('.tp-count', inner).textContent = sel.size ? `${sel.size} selected` : '';
    };
    const createFromQuery = () => {
      const name = q.trim(); if (!name) return;
      let t = state.tags.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (!t) { t = {id: uid(), name, color: TAG_COLORS[state.tags.length % TAG_COLORS.length], group: 'Your labels'}; state.tags.push(t); }
      const f = findCard(cardId); if (f && !f.card.tags.includes(t.id)) f.card.tags.push(t.id);
      q = ''; $('#tag-q', inner).value = '';
      haptic('select'); save(); scheduleRender(); draw();
    };
    draw();
    inner.addEventListener('input', e => { if (e.target.id === 'tag-q') { q = e.target.value; draw(); } });
    inner.addEventListener('keydown', e => { if (e.target.id === 'tag-q' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); createFromQuery(); } });
    inner.addEventListener('click', e => {
      const b = e.target.closest('[data-tag]');
      if (b) {
        const f = findCard(cardId); if (!f) return;
        const i = f.card.tags.indexOf(b.dataset.tag);
        if (i > -1) f.card.tags.splice(i, 1); else f.card.tags.push(b.dataset.tag);
        haptic('select'); save(); scheduleRender(); draw();
        return;
      }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'done') { close(); if (back) back(); }
      else if (x.dataset.x === 'manage') openTagManager(() => openTagPicker(cardId, back));
      else if (x.dataset.x === 'create') createFromQuery();
    });
  }, {cls: 'tall'});
}

function openTagManager(back) {
  openSheet((inner, close) => {
    inner.innerHTML = `<h2 class="sheet-title sheet-drag">Tags</h2><p class="sheet-text">Tags work in every category. Tap one to rename it, change its color or move it to another group.</p>`
      + tagGroups().map(g => `<div class="tg">${esc(g)}</div>` + state.tags.filter(t => t.group === g).map(t => {
        const n = cardsWithTag(t.id);
        return `<button type="button" class="tag-row" data-tag="${t.id}" style="--c:var(--l-${t.color})"><i class="${t.name ? '' : 'bar'}"></i>`
          + `<span class="grow">${esc(t.name || TAG_COLOR_NAME[t.color] + ' (color only)')}</span><span class="mono muted">${n ? n + (n === 1 ? ' card' : ' cards') : ''}</span></button>`;
      }).join('')).join('')
      + `<div class="sheet-actions"><button type="button" class="btn primary" data-x="add">${icon('plus')}New tag</button>${back ? '<span class="grow"></span><button type="button" class="btn" data-x="back">Done</button>' : ''}</div>`;
    inner.addEventListener('click', e => {
      const t = e.target.closest('[data-tag]');
      if (t) { openTagEditor(t.dataset.tag, () => openTagManager(back)); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'add') openTagEditor(null, () => openTagManager(back));
      else if (x.dataset.x === 'back') { close(); back(); }
    });
  }, {cls: 'tall'});
}

function openTagEditor(id, back) {
  const ex = id ? state.tags.find(t => t.id === id) : null;
  const t = ex ? {...ex} : {id: uid(), name: '', color: 'ultra', group: 'Your labels'};
  const groups = tagGroups(); if (!groups.includes(t.group)) groups.push(t.group);
  openSheet((inner, close) => {
    inner.innerHTML = `<form novalidate><h2 class="sheet-title sheet-drag">${ex ? 'Edit tag' : 'New tag'}</h2><div class="form-grid">`
      + `<div class="fld full"><label for="tg-name">Name</label><input id="tg-name" class="field" value="${esc(t.name)}" maxlength="28" placeholder="Leave empty for a color-only mark" autocomplete="off"></div>`
      + `<div class="fld full"><span class="lbl">Color</span><div class="menu-swatches flat" role="group" aria-label="Color">${TAG_COLORS.map(k => `<button type="button" class="swatch${k === t.color ? ' on' : ''}" data-k="${k}" style="--c:var(--l-${k})" aria-label="${TAG_COLOR_NAME[k]}" aria-pressed="${k === t.color}"></button>`).join('')}</div></div>`
      + `<div class="fld full"><label for="tg-group">Group</label><span class="select-wrap block"><select id="tg-group" class="select">${groups.map(g => `<option${g === t.group ? ' selected' : ''}>${esc(g)}</option>`).join('')}<option value="__new">New group…</option></select></span></div>`
      + `<div class="fld full" id="tg-new-wrap" hidden><label for="tg-new">New group name</label><input id="tg-new" class="field" maxlength="24" autocomplete="off"></div>`
      + `</div><p class="sheet-hint" id="tg-msg" aria-live="polite"></p>`
      + `<div class="sheet-actions">${ex ? `<button type="button" class="btn danger" data-x="del">${icon('trash')}Delete</button>` : ''}<span class="grow"></span><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
    const done = () => { close(); if (back) back(); };
    inner.addEventListener('change', e => { if (e.target.id === 'tg-group') $('#tg-new-wrap', inner).hidden = e.target.value !== '__new'; });
    inner.addEventListener('click', e => {
      const sw = e.target.closest('.swatch');
      if (sw) { t.color = sw.dataset.k; $$('.swatch', inner).forEach(s => { s.classList.toggle('on', s === sw); s.setAttribute('aria-pressed', String(s === sw)); }); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'cancel') done();
      else if (x.dataset.x === 'del') {
        close();
        withUndo(`Deleted tag “${tagLabel(ex)}”`, () => { state.tags.splice(state.tags.indexOf(ex), 1); allCards(k => { k.tags = k.tags.filter(i => i !== ex.id); }); });
        if (back) back();
      }
    });
    inner.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const gsel = $('#tg-group', inner).value;
      const group = (gsel === '__new' ? $('#tg-new', inner).value : gsel).trim();
      if (!group) { $('#tg-msg', inner).textContent = 'Name the new group.'; return; }
      t.name = $('#tg-name', inner).value.replace(/\s+/g, ' ').trim(); t.group = group;
      if (ex) Object.assign(ex, t); else state.tags.push(t);
      commit(); toast(ex ? 'Tag saved' : 'Tag added');
      done();
    });
  }, {cls: 'compact'});
}

/* ================= card detail ================= */
function openCard(id) {
  openSheet((inner, close) => {
    const back = () => openCard(id);
    const draw = () => {
      const f = findCard(id); if (!f) { close(); return; }
      const {cat: c, list: l, card: k} = f;
      const st = inner.scrollTop, now = Date.now();
      const doneN = k.checklist.filter(i => i.done).length, tot = k.checklist.length;
      const due = k.due ? dueInfo(k.due, k.done) : null;
      const r = running(), live = r && r.cardId === k.id;
      const tracked = cardTime(k.id);
      const catJob = jobById(c.jobId);
      const cardEntries = state.entries.filter(e => e.cardId === k.id).sort((a, b) => b.start - a.start);
      inner.innerHTML =
        `<div class="cs-head sheet-drag">`
        + `<button type="button" class="check big${k.done ? ' on' : ''}" data-cs="done" aria-pressed="${k.done}" aria-label="${k.done ? 'Mark as not done' : 'Mark as done'}">${icon('check')}</button>`
        + `<textarea id="cs-title" class="cs-title" rows="1" maxlength="300" aria-label="Card title" enterkeyhint="done">${esc(k.title)}</textarea>`
        + `<button type="button" class="icon-btn" data-cs="close" aria-label="Close">${icon('x')}</button></div>`
        + `<div class="cs-where"><span class="tab-dot" style="--c:var(--l-${c.color})"></span><label for="cs-move" class="sr-only">List</label><span class="select-wrap"><select id="cs-move" class="select">`
        + state.categories.map(cc => `<optgroup label="${esc(cc.name)}">` + cc.lists.map(ll => `<option value="${ll.id}"${ll.id === l.id ? ' selected' : ''}>${esc(ll.title)}</option>`).join('') + `</optgroup>`).join('')
        + `</select></span></div>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3>Time</h3><span class="mono muted">${live ? `<span data-since="${r.start}" data-base="${tracked}">${clock(tracked + now - r.start)}</span>` : tracked ? fmtHM(tracked) + ' total' : ''}</span></div>`
        + `<div class="time-row">${live ? `<button type="button" class="btn stop" data-cs="track">${icon('stop')}Stop timer</button>` : `<button type="button" class="btn primary" data-cs="track">${icon('play')}Start timer</button>`}`
        + `<button type="button" class="btn" data-cs="focus">${icon('timer')}Pomodoro</button>`
        + `<span class="select-wrap"><label for="cs-job" class="sr-only">Job</label><select id="cs-job" class="select"><option value="">${esc(catJob ? `${catJob.name} (from category)` : 'No job (category default)')}</option>`
        + state.jobs.map(j => `<option value="${j.id}"${k.jobId === j.id ? ' selected' : ''}>${esc(j.name)}</option>`).join('')
        + (catJob ? `<option value="__none"${k.jobId === '__none' ? ' selected' : ''}>No job</option>` : '') + `</select></span></div>`
        + (cardEntries.length ? cardEntries.slice(0, 4).map(e => `<button type="button" class="entry${e.end == null ? ' live' : ''}" data-cs="entry" data-e="${e.id}"><span class="t"><b>${fmtDay(dayKey(e.start))}</b><small>${hhmm(e.start)}–${e.end == null ? 'now' : hhmm(e.end)}${e.note ? ' · ' + esc(e.note) : ''}</small></span><span class="d">${e.end == null ? `<span data-since="${e.start}">${clock(now - e.start)}</span>` : fmtHM(e.end - e.start)}</span></button>`).join('')
          + (cardEntries.length > 4 ? `<p class="sheet-hint">${cardEntries.length - 4} older entries are in Hours.</p>` : '') : '')
        + `<button type="button" class="link" data-cs="add-time" style="margin-top:6px">Add time manually</button></section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3>Tags</h3><button type="button" class="link" data-cs="tags">${k.tags.length ? 'Edit' : 'Add tags'}</button></div>`
        + (k.tags.length ? `<div class="tag-sel">${sortedTags(k.tags).map(t => `<button type="button" class="tag-pill" data-cs="tags" style="--c:var(--l-${t.color})"><i></i>${esc(tagLabel(t))}</button>`).join('')}</div>` : `<p class="sheet-hint" style="margin:0">No tags yet.</p>`)
        + `</section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3><label for="cs-due">Due date</label></h3>${k.due ? `<button type="button" class="link" data-cs="clear-due">Clear</button>` : ''}</div>`
        + `<div class="due-row"><input type="date" id="cs-due" class="field" value="${esc(k.due)}">${due && due.text ? `<span class="chip ${due.cls}">${icon('cal')}${due.text}</span>` : ''}</div></section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3><label for="cs-desc">Notes</label></h3></div>`
        + `<textarea id="cs-desc" class="field area" rows="3" placeholder="Details, links, measurements">${esc(k.desc)}</textarea></section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3>Checklist</h3>${tot ? `<span class="mono muted">${doneN}/${tot}</span>` : ''}</div>`
        + (tot ? `<div class="progress" role="progressbar" aria-label="Checklist progress" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${doneN}"><i style="width:${doneN / tot * 100}%"></i></div>` : '')
        + `<ul class="cl">` + k.checklist.map(it =>
            `<li class="${it.done ? 'on' : ''}"><button type="button" class="cl-check${it.done ? ' on' : ''}" data-cs="cl-toggle" data-i="${it.id}" aria-pressed="${it.done}" aria-label="${it.done ? 'Uncheck' : 'Check'} item">${icon('check')}</button>`
            + `<input class="cl-text" data-cl="${it.id}" value="${esc(it.text)}" aria-label="Checklist item" enterkeyhint="done" autocomplete="off">`
            + `<button type="button" class="icon-btn sm" data-cs="cl-del" data-i="${it.id}" aria-label="Remove item">${icon('x')}</button></li>`).join('') + `</ul>`
        + `<input id="cs-cl-add" class="field" placeholder="Add an item" enterkeyhint="enter" autocomplete="off" aria-label="Add checklist item"></section>`
        + `<footer class="cs-foot"><span class="mono muted">Added ${fmtDate(k.created, true)}</span><button type="button" class="btn danger" data-cs="delete">${icon('trash')}Delete card</button></footer>`;
      inner.scrollTop = st;
      $$('textarea', inner).forEach(autosize);
    };
    draw();

    inner.addEventListener('click', e => {
      const b = e.target.closest('[data-cs]'); if (!b) return;
      const f = findCard(id); if (!f) return;
      const k = f.card;
      switch (b.dataset.cs) {
        case 'close': close(); return;
        case 'done': { const moved = setDone(k, !k.done); if (moved) toast(moved); break; }
        case 'track': unlockAudio(); trackCard(id); break;
        case 'focus': {
          const p = pr();
          p.cardId = id; p.jobId = null;
          if (p.phase === 'idle') { save(); pomoToggle(); }
          else if (p.phase === 'work' && p.endsAt) { pomoTrackStop(); pomoTrackStart(); commit(); }
          else commit();
          openTimePanel('focus');
          return;
        }
        case 'entry': openEntryEditor(b.dataset.e, {back}); return;
        case 'add-time': openEntryEditor(null, {cardId: id, back}); return;
        case 'tags': openTagPicker(id, back); return;
        case 'clear-due': k.due = ''; break;
        case 'cl-toggle': { const it = k.checklist.find(i => i.id === b.dataset.i); if (it) { it.done = !it.done; haptic(it.done ? 'success' : 'select'); } break; }
        case 'cl-del': k.checklist = k.checklist.filter(i => i.id !== b.dataset.i); break;
        case 'delete': close(); withUndo('Card deleted', () => { const r = running(); if (r && r.cardId === k.id) stopTracking(); f.list.cards.splice(f.list.cards.indexOf(k), 1); }); return;
        default: return;
      }
      save(); scheduleRender(); draw();
    });
    inner.addEventListener('input', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      const k = f.card;
      if (t.id === 'cs-title') { k.title = t.value.replace(/\s*\n\s*/g, ' '); autosize(t); }
      else if (t.id === 'cs-desc') { k.desc = t.value; autosize(t); }
      else if (t.dataset.cl) { const it = k.checklist.find(i => i.id === t.dataset.cl); if (it) it.text = t.value; }
      else return;
      save(); scheduleRender();
    });
    inner.addEventListener('change', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      if (t.id === 'cs-due') { f.card.due = t.value; save(); scheduleRender(); draw(); }
      else if (t.id === 'cs-job') { if (t.value) f.card.jobId = t.value; else delete f.card.jobId; save(); draw(); }
      else if (t.id === 'cs-move') {
        const to = findList(t.value);
        if (to && to.list !== f.list) {
          f.list.cards.splice(f.index, 1); to.list.cards.push(f.card);
          if (to.list.collapsed) to.list.collapsed = false;
          commit(); draw();
          toast(`Moved to ${to.list.title}${to.cat !== f.cat ? ` in ${to.cat.name}` : ''}`);
        }
      }
    });
    inner.addEventListener('keydown', e => {
      const t = e.target;
      if ((t.id === 'cs-title' || t.dataset.cl) && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); t.blur(); return; }
      if (t.id === 'cs-cl-add' && e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        const v = t.value.trim(); if (!v) return;
        const f = findCard(id); if (!f) return;
        f.card.checklist.push({id: uid(), text: v, done: false});
        save(); scheduleRender(); draw();
        const n = $('#cs-cl-add', inner); n.focus({preventScroll: true}); n.scrollIntoView({block: 'nearest'});
      }
    });
    inner.addEventListener('focusout', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      if (t.id === 'cs-title' && !f.card.title.trim()) { f.card.title = 'Untitled'; t.value = 'Untitled'; save(); scheduleRender(); }
      if (t.dataset.cl && !t.value.trim()) {
        f.card.checklist = f.card.checklist.filter(i => i.id !== t.dataset.cl);
        save(); scheduleRender(); setTimeout(() => { if (sheet && sheet.el.contains(inner)) draw(); });
      }
    });
  }, {cls: 'card-sheet'});
}

/* ================= toast ================= */
let toastTimer = 0;
const toastEl = $('#toast');
function toast(msg, {action, onAction} = {}) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" class="toast-btn">${esc(action)}</button>` : '');
  toastEl.hidden = false;
  toastEl.classList.remove('in'); void toastEl.offsetWidth; toastEl.classList.add('in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 3200);
  if (action) toastEl.querySelector('button').addEventListener('click', () => { hideToast(); onAction(); });
}
function hideToast() {
  toastEl.classList.remove('in');
  setTimeout(() => { if (!toastEl.classList.contains('in')) toastEl.hidden = true; }, 220);
}

/* ================= installable app ================= */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Docket is installed. Open it from your home screen.'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(() => { if (notifStatus() === 'on') pushSync(true); }).catch(err => console.warn('Service worker registration failed', err));
}

/* ================= boot ================= */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
render();
const activeTab = tabsEl.querySelector('.tab.is-active'); if (activeTab) activeTab.scrollIntoView({inline: 'nearest', block: 'nearest'});
if (pr().endsAt) tick();
fsInit();
ghLoadCfg(); ghPull();
/* home-screen shortcuts open straight into the timer panel */
if (location.hash === '#focus' || location.hash === '#hours') { const tab = location.hash.slice(1); history.replaceState(null, '', location.pathname + location.search); openTimePanel(tab); }
})();
