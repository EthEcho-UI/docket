<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E6E8EC">
<meta name="description" content="Lists, cards, focus timer and work hours, made for your phone.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- /head-meta -->
<title>Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --ground:#E6E8EC; --col:#F1F2F5; --card:#FFFFFF; --sheet:#FFFFFF; --field:#F5F6F8;
  --ink:#16181D; --ink-2:#3B404B; --muted:#687080; --muted-2:#A2A8B4;
  --line:#DCDFE5; --line-strong:#BFC4CE; --hover:rgba(22,26,40,.06);
  --accent:#1F6FEB; --accent-ink:#FFFFFF; --accent-soft:rgba(31,111,235,.10);
  --danger:#C23B2E; --warn:#A86E12; --good:#2E8A55;
  --toast-accent:#9CC8FF; --scrim:rgba(14,16,22,.36);
  --shadow-card:0 1px 2px rgba(22,26,40,.07),0 0 0 1px rgba(22,26,40,.055);
  --shadow-hover:0 3px 8px -2px rgba(22,26,40,.12),0 0 0 1px rgba(22,26,40,.08);
  --shadow-lift:0 22px 44px -14px rgba(22,26,40,.38),0 0 0 1px rgba(22,26,40,.07);
  --l-moss:#4C8638; --l-mustard:#BE930C; --l-rust:#C9532B; --l-ultra:#3B5BDB; --l-orchid:#9A4CB6; --l-teal:#1C8B82; --l-rose:#C2416B; --l-sky:#2B87C2; --l-slate:#5D6B82; --l-lime:#6E9A1F;
  --ground-img:none; --ground-size:auto; --ground-pos:0 0; --ground-repeat:repeat; --col-blur:none; --col-shadow:none; --title-tt:none; --r-card:10px; --r-col:14px;
  --col-w:min(300px, calc(100vw - 76px));
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
    --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
    --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
    --accent:#4DA3FF; --accent-ink:#0E1014; --accent-soft:rgba(77,163,255,.14);
    --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
    --toast-accent:#1F6FEB; --scrim:rgba(0,0,0,.55);
    --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
    --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
    --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
    --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
  --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
  --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
  --accent:#4DA3FF; --accent-ink:#0E1014; --accent-soft:rgba(77,163,255,.14);
  --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
  --toast-accent:#1F6FEB; --scrim:rgba(0,0,0,.55);
  --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
  --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
  --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
  --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background-color:var(--ground);background-image:var(--ground-img);background-size:var(--ground-size);background-position:var(--ground-pos);background-repeat:var(--ground-repeat)}

/* ---------- top bar / category tabs ---------- */
.top{flex:none;display:flex;align-items:center;gap:0;padding:calc(env(safe-area-inset-top,0px) + 6px) max(6px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px))}
.tabs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;padding:0 8px 0 12px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;display:inline-flex;align-items:center;gap:7px;height:46px;text-transform:var(--title-tt);padding:0 10px;border:0;border-radius:10px;background:none;color:var(--muted);font:500 17px/1 var(--font-display);letter-spacing:-.012em;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab:hover{color:var(--ink)}
.tab.is-active{color:var(--ink);font-weight:700}
.tab.is-active::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2.5px;border-radius:2px;background:var(--ink)}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tab-count{font:500 11px/1 var(--font-mono);color:var(--muted);align-self:flex-start;margin-top:11px;font-variant-numeric:tabular-nums}
.tab.is-pressing{background:var(--hover)}
.tab.is-drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tab.is-drop.is-charging{animation:pulse .5s ease-in-out infinite}
.tab.is-drop.is-armed{background:var(--accent);color:#fff;animation:none;box-shadow:inset 0 0 0 2px var(--accent)}
.tab-add{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;margin-left:2px}
.tab-add:hover{background:var(--hover);color:var(--ink)}
.tab-work{gap:6px}
.tab-work .ic{width:18px;height:18px}
.tab-work .live-dot{width:7px;height:7px;align-self:flex-start;margin-top:12px}
.tab-sep{flex:none;width:1px;height:22px;margin:0 4px;background:var(--line-strong)}

/* ---------- board ---------- */
.board{flex:1;min-height:0;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;position:relative;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));scroll-snap-type:x proximity;scroll-padding-inline:16px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
html.has-dock .board{padding-bottom:calc(var(--dock-h,60px) + 26px + env(safe-area-inset-bottom,0px))}
.board-end{flex:0 0 4px;height:1px}
html.dragging .board,html.dragging .tabs{scroll-snap-type:none}
html.dragging,html.dragging *{cursor:grabbing!important}

.list{flex:0 0 var(--col-w);width:var(--col-w);max-height:100%;display:flex;flex-direction:column;background:var(--col);border-radius:var(--r-col);scroll-snap-align:start;position:relative;box-shadow:var(--col-shadow);-webkit-backdrop-filter:var(--col-blur);backdrop-filter:var(--col-blur)}
.list-head{flex:none;display:flex;align-items:center;gap:0;min-height:54px;padding:6px 4px 2px 6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list-title{flex:1;min-width:0;text-align:left;text-transform:var(--title-tt);border:0;background:none;padding:7px 8px;border-radius:8px;color:var(--ink);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.list-title:hover{background:var(--hover)}
.list-title-input{flex:1;min-width:0;border:0;outline:none;border-radius:8px;padding:7px 8px;background:var(--card);box-shadow:0 0 0 2px var(--accent);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;color:var(--ink)}
.list-count{flex:none;font:500 12px/1 var(--font-mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.list-head.is-pressing,.list.is-pressing .collapsed-body{background:var(--hover);border-radius:12px}

.cards{flex:0 1 auto;min-height:8px;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;display:flex;flex-direction:column;gap:6px;padding:2px 8px 6px;position:relative;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}

.card{flex:none;position:relative;display:flex;flex-direction:column;gap:7px;padding:10px 12px 11px 8px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .16s ease,box-shadow .16s ease}
.card:focus-visible{outline:none;box-shadow:var(--shadow-card),0 0 0 2px var(--accent)}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-hover)}}
.card.is-pressing{transform:scale(.975)}
.card-labels{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-left:34px}
.lab{display:block;width:28px;height:6px;border-radius:3px;background:var(--c)}
.lab.named{width:auto;height:auto;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 17%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ink));font:600 11.5px/1.2 var(--font-ui)}
.card-main{display:flex;align-items:flex-start;gap:8px}
.card-title{flex:1;min-width:0;font-size:15px;line-height:1.35;padding-top:1px;overflow-wrap:anywhere}
.card.is-done .card-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-left:34px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chip .ic{width:14px;height:14px}
.chip.late{color:var(--danger)} .chip.soon{color:var(--warn)} .chip.ok{color:var(--good)} .chip.live{color:var(--accent);font-weight:600}
.chip.cl-last{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.6s ease-in-out infinite}
.chip .live-dot{width:7px;height:7px;margin-right:2px}
@keyframes pulse{50%{opacity:.3}}

.check{flex:none;position:relative;width:26px;height:26px;margin:-3px 0 -3px;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:transparent;cursor:pointer}
.check::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.check::after{content:"";position:absolute;inset:-8px}
.check .ic{position:relative;width:13px;height:13px;stroke-width:2.8}
.check:hover::before{border-color:var(--accent)}
.check.on{color:var(--accent-ink)}
.check.on::before{background:var(--accent);border-color:var(--accent)}
.check.big{width:34px;height:34px;margin:0}
.check.big .ic{width:16px;height:16px}

/* collapsed columns */
.list.is-collapsed{flex-basis:52px;width:52px}
.list.is-collapsed .cards{display:none}
.collapsed-body{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:16px 0 18px;border:0;border-radius:var(--r-col);background:none;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.collapsed-body:hover{background:var(--hover)}
.collapsed-body .ic{color:var(--muted)}
.v-title{writing-mode:vertical-rl;text-transform:var(--title-tt);font:650 17px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap;max-height:56vh;overflow:hidden;text-overflow:ellipsis}
.list.is-collapsed.is-drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

.list-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 6px 8px}
.add-card{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 14.5px/1 var(--font-ui);cursor:pointer}
.add-card:hover{background:var(--hover);color:var(--ink)}
.hidden-note{border:0;background:none;color:var(--muted);font:500 11.5px/1 var(--font-mono);padding:8px;border-radius:8px;cursor:pointer}
.hidden-note:hover{color:var(--ink)}

.composer{flex:none;display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px}
.composer textarea,.add-list input{width:100%;resize:none;border:0;outline:none;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow-card),0 0 0 2px var(--accent);padding:10px 12px;color:var(--ink);font:16px/1.35 var(--font-ui)}
.composer textarea{min-height:66px}
.composer-row{display:flex;align-items:center;gap:6px}

.add-list{flex:0 0 var(--col-w);width:var(--col-w);display:flex;align-items:center;gap:6px;height:54px;padding:0 14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-col);background:none;color:var(--muted);font:600 15px/1 var(--font-ui);cursor:pointer;scroll-snap-align:start}
.add-list:hover{color:var(--ink);border-color:var(--muted-2)}
.add-list.is-open{height:auto;flex-direction:column;align-items:stretch;gap:8px;padding:8px;border:0;background:var(--col);cursor:default}

/* drag states */
.is-placeholder{background:transparent!important;box-shadow:none!important;outline:1.5px dashed var(--line-strong);outline-offset:-1.5px;transform:none!important}
.is-placeholder>*{visibility:hidden}
.ghost{position:fixed!important;left:0;top:0;margin:0!important;z-index:60;pointer-events:none;opacity:.97;will-change:transform;overflow:hidden;box-shadow:var(--shadow-lift)!important;transition:none}
.tab.ghost{background:var(--card);border-radius:10px}
.ghost.settling{transition:transform .16s cubic-bezier(.2,.8,.2,1)}

/* buttons & fields */
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:default;background:none}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ic{width:17px;height:17px}
.icon-btn.lg{width:50px;height:50px;border-radius:25px;background:var(--hover);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:11px;background:var(--hover);color:var(--ink);font:600 15px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--danger);color:#fff}
.btn.danger{background:none;color:var(--danger);padding:0 8px}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn .ic{width:18px;height:18px}
.composer .btn{height:40px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font:600 13.5px/1 var(--font-ui);cursor:pointer}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font:16px/1.4 var(--font-ui);outline:none;min-height:46px}
.field:focus{border-color:var(--accent)}
.field[readonly]{color:var(--muted)}
.field.area{resize:none;min-height:88px;display:block}
.field.sm{padding:7px 10px;min-height:0}
.mono{font:500 12px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.grow{flex:1}
.switch{flex:none;position:relative;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;position:relative;cursor:pointer}
.toggle>span:first-child{display:flex;flex-direction:column;gap:2px;font-weight:500}
.toggle small{font-size:12.5px;font-weight:400;color:var(--muted)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle input:checked+.switch{background:var(--accent);border-color:var(--accent)}
.toggle input:checked+.switch::after{opacity:1}
.toggle input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.full{grid-column:1/-1}
.fld label,.fld .lbl{display:block;margin-bottom:6px;font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- sheets, menus, toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.scrim.clear{background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--sheet);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px -12px rgba(0,0,0,.35);transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.sheet.in{transform:none}
.sheet.tall{height:calc(100% - 28px - env(safe-area-inset-top,0px))}
.sheet-grip{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-inner{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-title{margin:2px 0 14px;font:650 20px/1.25 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.sheet-text{margin:0 0 6px;color:var(--ink-2);line-height:1.5;max-width:60ch}
.sheet-hint{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;margin-top:18px}
.sheet textarea.field.mono-box{font:12px/1.4 var(--font-mono);min-height:140px;margin-top:10px}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .sheet{left:50%;right:auto;bottom:auto;top:7vh;width:min(600px,calc(100vw - 48px));max-height:86vh;border-radius:18px;opacity:0;transform:translate(-50%,14px);transition:transform .22s cubic-bezier(.2,.85,.25,1),opacity .18s}
  .sheet.in{opacity:1;transform:translate(-50%,0)}
  .sheet.compact{width:min(460px,calc(100vw - 48px));top:12vh}
  .sheet.tall{height:84vh}
  .sheet-grip{height:16px;cursor:default}
  .sheet-grip::before{display:none}
  .sheet-inner{padding:4px 24px 24px}
}

.menu{position:fixed;z-index:51;background:var(--sheet);color:var(--ink)}
.menu.as-sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;padding:6px;border-radius:18px;box-shadow:var(--shadow-lift);transform:translateY(calc(100% + 24px));transition:transform .26s cubic-bezier(.2,.85,.25,1)}
.menu.as-sheet.in{transform:none}
.menu.pop{min-width:250px;max-width:320px;padding:5px;border-radius:12px;box-shadow:var(--shadow-lift);opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
.menu.pop.in{opacity:1;transform:none}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:500 16px/1.25 var(--font-ui);text-align:left;cursor:pointer}
.menu.pop .menu-item{min-height:40px;font-size:14.5px}
.menu-item:hover,.menu-item:focus-visible{background:var(--hover);outline:none}
.menu-item[disabled]{opacity:.42;cursor:default}
.menu-item[disabled]:hover{background:none}
.menu-item .ic{color:var(--muted)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .ic{color:currentColor}
.mi-label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mi-label small{font-size:12.5px;font-weight:400;color:var(--muted)}
.mi-check{display:grid;color:transparent}
.mi-check.on{color:var(--accent)}
.menu-item .mi-check .ic{color:inherit}
.menu-title{padding:10px 12px 6px;font:600 11.5px/1.2 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-sep{height:1px;margin:5px 10px;background:var(--line)}
.menu-swatches{display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px 12px}
.menu-swatches.flat{padding:4px 2px}
.swatch{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--c);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:8px 8px 8px 16px;border-radius:12px;background:var(--ink);color:var(--ground);font:500 14.5px/1.3 var(--font-ui);box-shadow:var(--shadow-lift);opacity:0;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
html.has-dock .toast{bottom:calc(var(--dock-h,60px) + 26px + env(safe-area-inset-bottom,0px))}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast span{padding:6px 0}
.toast-btn{flex:none;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--toast-accent);font:700 14.5px/1 var(--font-ui);cursor:pointer}

/* ---------- running-timer dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:min(520px,calc(100vw - 24px));display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:16px;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow-lift)}
.dock-row{display:flex;align-items:center;gap:2px}
.dock-pill{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border:0;border-radius:11px;background:none;color:var(--ink);cursor:pointer;text-align:left}
.dock-pill:hover{background:var(--hover)}
.dock-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 14.5px/1.2 var(--font-ui)}
.dock-label small{color:var(--muted);font-size:12.5px}
.dock-time{font:600 15px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.dock-ring{flex:none;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0) * 1%),var(--line-strong) 0);-webkit-mask:radial-gradient(circle,transparent 5.5px,#000 6.5px);mask:radial-gradient(circle,transparent 5.5px,#000 6.5px)}
.dock-ring.brk{background:conic-gradient(var(--good) calc(var(--p,0) * 1%),var(--line-strong) 0)}
.dock .icon-btn{color:var(--ink)}

/* ---------- card detail sheet ---------- */
.cs-head{display:flex;align-items:flex-start;gap:8px;padding:0 0 6px}
.cs-title{flex:1;min-width:0;resize:none;overflow:hidden;border:0;outline:none;background:none;padding:4px 2px;border-radius:8px;color:var(--ink);font:650 21px/1.25 var(--font-display);letter-spacing:-.015em}
.cs-title:focus{background:var(--hover)}
.cs-where{display:flex;align-items:center;gap:8px;padding:0 0 16px 42px;min-width:0}
.select-wrap{position:relative;display:inline-block;min-width:0;max-width:100%}
.select-wrap.block{display:block}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select{appearance:none;-webkit-appearance:none;max-width:100%;border:0;border-radius:9px;background:var(--hover);color:var(--ink);padding:9px 34px 9px 12px;font:500 16px/1.2 var(--font-ui);cursor:pointer;text-overflow:ellipsis}
.select-wrap.block .select{width:100%;min-height:46px}
/* the native dropdown popup doesn't inherit --hover, only --ink; set its own background explicitly so dark-theme (light) text never lands on the browser's default white popup */
.select option,.select optgroup{background-color:var(--sheet);color:var(--ink)}
.cs-sec{padding:14px 0 16px;border-top:1px solid var(--line)}
.cs-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;margin-bottom:8px}
.cs-sec h3{margin:0;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label-pick{display:flex;flex-wrap:wrap;gap:8px}
.lp{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 11px;border:1.5px solid var(--line);border-radius:999px;background:none;color:var(--ink-2);font:500 14.5px/1 var(--font-ui);cursor:pointer}
.lp i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.lp span:empty{display:none}
.lp:has(span:empty){padding:0 10px}
.lp.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}
.lp.on i{box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--c) 55%,#fff)}
.label-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.label-names .sheet-hint{grid-column:1/-1;margin:0 0 2px}
.ln{display:flex;align-items:center;gap:8px;min-width:0}
.ln i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.due-row,.time-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.due-row .field{width:auto;flex:0 1 210px}
.progress{height:4px;margin:0 0 6px;border-radius:2px;background:var(--hover);overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:var(--good);transition:width .25s}
.cl{list-style:none;margin:0 0 8px;padding:0}
.cl li{display:flex;align-items:center;gap:4px;min-height:44px}
.cl-check{flex:none;position:relative;width:36px;height:36px;margin-left:-6px;padding:0;display:grid;place-items:center;border:0;background:none;color:transparent;cursor:pointer}
.cl-check::before{content:"";position:absolute;width:20px;height:20px;border-radius:6px;border:1.6px solid var(--muted-2)}
.cl-check .ic{position:relative;width:13px;height:13px;stroke-width:2.8}
.cl-check.on{color:#fff}
.cl-check.on::before{background:var(--good);border-color:var(--good)}
.cl-text{flex:1;min-width:0;border:0;outline:none;background:none;padding:8px 6px;border-radius:7px;color:var(--ink);font:16px/1.3 var(--font-ui)}
.cl-text:focus{background:var(--hover)}
.cl li.on .cl-text{color:var(--muted);text-decoration:line-through}
.cl-handle{width:26px;height:26px;cursor:grab;touch-action:none}
.cl-handle .ic{width:14px;height:14px}
.cl li.cl-dragging{opacity:.55}
.cl li .chip{flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-extra{display:flex;flex-direction:column;gap:8px;min-height:0!important;padding:4px 6px 12px 36px;margin-top:-4px}
.cl-extra-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field.sm{padding:7px 10px;font-size:14px;min-height:0}
.note-list{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.note-item{display:flex;align-items:flex-start;gap:6px}
.note-item .field{flex:1}
.note-item .icon-btn{margin-top:4px}
.cs-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.trash-drop{position:fixed;left:50%;bottom:calc(-14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%) scale(.8);width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--danger) 70%,transparent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none;box-shadow:var(--shadow-lift),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.18);opacity:0;backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%);border:1px solid rgba(255,255,255,.4);transition:transform .45s cubic-bezier(.22,.61,.36,1),opacity .32s ease}
.trash-drop .ic{width:32px;height:32px;transition:width .18s cubic-bezier(.34,1.76,.64,1),height .18s cubic-bezier(.34,1.76,.64,1)}
.trash-drop.danger-hot{transition:transform .2s cubic-bezier(.34,1.76,.64,1),opacity .18s ease}
.trash-drop.danger-hot .ic{width:36px;height:36px}
.ghost.to-trash{transition:transform .18s ease,opacity .18s ease!important}

/* ---------- time & focus ---------- */
.time-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:0 0 14px;background:var(--sheet)}
.seg{flex:1;display:flex;padding:3px;border-radius:12px;background:var(--hover)}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 14.5px/1 var(--font-ui);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-card)}
.pomo{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:4px}
.pomo-ring{position:relative;width:min(240px,64vw);aspect-ratio:1;max-width:100%}
.pomo-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.pomo-ring circle{fill:none;stroke-width:9}
.pomo-ring .trk{stroke:var(--hover)}
.pomo-ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.pomo.short .bar,.pomo.long .bar{stroke:var(--good)}
.pomo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pomo-phase{font:600 12px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pomo-time{font:500 clamp(40px,12vw,54px)/1 var(--font-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pomo-dots{display:flex;gap:6px}
.pomo-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.pomo-dots i.on{background:var(--accent)}
.pomo-ctrl{display:flex;align-items:center;gap:16px}
.pomo-main{height:54px;min-width:172px;padding:0 24px;border-radius:27px;font-size:16px}
.pomo-link,.pomo-set{width:100%}
.pomo-set{border-top:1px solid var(--line);padding-top:4px}
.pomo-set summary{display:flex;align-items:center;justify-content:space-between;min-height:46px;cursor:pointer;list-style:none;font:600 14.5px/1 var(--font-ui);color:var(--ink-2)}
.pomo-set summary::-webkit-details-marker{display:none}
.pomo-set summary::after{content:"";width:7px;height:7px;margin-right:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg)}
.pomo-set[open] summary::after{transform:rotate(-135deg)}
.pomo-set .form-grid{padding:6px 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1.5px solid var(--line);border-radius:999px;background:none;color:var(--ink-2);font:500 14px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.hrs-filters{display:flex;flex-direction:column;gap:8px}
.hrs-range{display:flex;align-items:center;gap:8px}
.hrs-range .field{flex:1;min-width:0}
.hrs-summary{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin:18px 0 4px}
.hrs-big{font:650 36px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hrs-sub{margin-top:6px}
.hrs-earn{font:600 15px/1.2 var(--font-mono);color:var(--good)}
.hrs-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.day{margin-top:16px}
.day-head{display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--line);font:600 11.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.entry,.job-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;cursor:pointer}
.entry:hover,.job-row:hover{background:var(--hover)}
.entry .t,.job-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.entry b,.job-row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry small,.job-row small{font:500 12px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .d{font:500 13.5px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.entry.live .d{color:var(--accent)}
.empty{padding:32px 8px;text-align:center;color:var(--muted);line-height:1.5}
.running-note{min-height:46px;display:flex;align-items:center;gap:8px;font:600 14px/1 var(--font-mono);color:var(--accent)}

/* ---------- time panel extras ---------- */
.play{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.play .ic{width:15px;height:15px}
.play:hover{background:var(--accent);color:var(--accent-ink)}
.play.stop{background:var(--danger);color:#fff}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.fchip[disabled]{opacity:.4;cursor:default}
.task-new{display:flex;gap:8px;margin:14px 0 2px}
.task-new .field{flex:1;min-width:0}
.task-new .btn{height:46px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 4px}
.sec-head h3{margin:0;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.task-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.task-row .entry{flex:1;min-width:0;border-bottom:0}
.task-row.live .entry b{color:var(--accent)}
.run-banner{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--accent-soft)}
.run-banner .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.run-banner b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-banner small{font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.run-banner .d{font:600 14px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.empty.sm{padding:10px 4px;text-align:left}
.hrs-range{margin-top:8px}
.theme-group{margin:20px 0 10px;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.theme-group:first-of-type{margin-top:4px}

.task-new .add-only{width:46px;height:46px;border-radius:10px;background:var(--hover);color:var(--ink)}
.task-row small .ic{width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.earn-live{color:var(--good);font-variant-numeric:tabular-nums}
/* tags */
.tg{margin:18px 0 8px;font:600 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag-sel{display:flex;flex-wrap:wrap;gap:6px}
.tag-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink));font:600 13.5px/1 var(--font-ui);cursor:pointer}
.tag-pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag-row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.tag-row:hover{background:var(--hover)}
.tag-row i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.tag-row i.bar{width:22px;height:7px;border-radius:4px}
/* stats */
.seg-sm{margin-top:10px}
.seg-sm button{height:34px;font-size:13.5px}
.st-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 2px}
.st-nav b{font:650 17px/1.2 var(--font-display);letter-spacing:-.01em;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0 4px}
.tile{min-width:0;padding:12px 14px;border-radius:12px;background:var(--hover)}
.tile .k{font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{margin-top:6px;font:650 24px/1.1 var(--font-ui);overflow-wrap:anywhere}
.tile .s{margin-top:4px;min-height:15px;font:500 12px/1.3 var(--font-mono);color:var(--muted)}
.chart{position:relative;margin:6px 0 2px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font:500 10px var(--font-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:var(--hover)}
.tip{position:absolute;top:-4px;z-index:3;max-width:100%;padding:6px 9px;border-radius:8px;background:var(--ink);color:var(--sheet);font:500 12px/1.35 var(--font-ui);white-space:normal;text-align:center;pointer-events:none;transform:translate(-50%,-100%);box-shadow:var(--shadow-lift)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 4px;font:500 13px/1.3 var(--font-ui);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.st-table{width:100%;border-collapse:collapse;font-size:14.5px}
.st-table th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font:600 11px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-table td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.st-table .n{text-align:right;white-space:nowrap;font:500 13px/1.4 var(--font-mono);font-variant-numeric:tabular-nums}
.share{height:4px;margin-top:6px;border-radius:2px;background:var(--hover)}
.share i{display:block;height:100%;border-radius:2px;background:var(--c)}

.accent-row{display:flex;flex-wrap:wrap;gap:12px;padding:2px 2px 4px}
.acc{position:relative;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:var(--c);cursor:pointer;overflow:hidden}
.acc.on{overflow:visible;box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}
.acc.auto{--c:var(--ink);background:conic-gradient(#1F6FEB 0 25%,#FF4FB8 0 50%,#3EE0CF 0 75%,#E3A869 0)}
.acc.custom{background:conic-gradient(#ff4d4d,#ffd24d,#4dff88,#4dd2ff,#6a4dff,#ff4dd2,#ff4d4d)}
.acc.custom.on{background:var(--c)}
.acc input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
.accent-name{margin:8px 0 0;font:500 12.5px/1.3 var(--font-mono);color:var(--muted)}

.steps{margin:0 0 14px;padding-left:20px;color:var(--ink-2);line-height:1.55}
.steps a{color:var(--accent)}

.chip.prio{color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:600}
.chip.prio .ic{color:var(--c)}
.pin-star{position:absolute;top:7px;right:8px;color:var(--warn);display:grid}
.pin-star .ic{width:14px;height:14px;fill:currentColor;stroke:none}
.card.is-pinned .card-main{padding-right:14px}
.star-btn.on{color:var(--warn)}
.sort-ic{display:inline-grid;vertical-align:-2px;margin-right:4px;color:var(--muted)}
.sort-ic .ic{width:12px;height:12px}

.prio-pick .fchip{height:34px}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{padding:2px 0 6px;text-align:center;font:600 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-day{min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px 3px;border:0;border-radius:9px;background:var(--hover);color:var(--ink);text-align:left;cursor:pointer;overflow:hidden}
.cal-day.out{opacity:.4}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{align-self:flex-start;min-width:22px;height:22px;padding:0 5px;display:grid;place-items:center;border-radius:11px;font:600 12px/1 var(--font-mono)}

.cal-items b{font:600 9.5px/1 var(--font-mono);color:var(--muted)}

.cal-row{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--line)}
.cal-row .check{margin:0 2px}
.cal-row.done .t b{color:var(--muted);text-decoration:line-through}
.cal-evdot{flex:none;width:12px;height:12px;margin:0 8px;border-radius:4px;background:var(--c)}
.cal-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 2px;border:0;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.cal-time{flex:none;width:84px;font:500 12.5px/1.25 var(--font-mono);color:var(--muted)}
.cal-open .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cal-open b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-open small{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px) and (hover:hover) and (pointer:fine){

}

.rem-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.ai-act{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:2px 4px;font:500 12.5px/1.3 var(--font-mono);color:var(--good)}
.ai-act .ic{width:14px;height:14px}
.ai-msg.typing{display:flex;gap:4px;padding:13px 14px}
.ai-msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.ai-msg.typing i:nth-child(2){animation-delay:.2s} .ai-msg.typing i:nth-child(3){animation-delay:.4s}
.ai-empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:8px 0}
.ai-sg{height:auto;min-height:36px;padding:8px 12px;white-space:normal;text-align:left;line-height:1.3}

.key-ok{display:inline-grid;color:var(--good)}

.cal-row.ghost{opacity:.6}

.tn{padding:0 4px 2px;font:600 14px/1.2 var(--font-ui)}

  .pomo>.pomo-ctrl{grid-column:1;grid-row:2;justify-self:center}
  .pomo>.pomo-link{grid-column:2;grid-row:1}
  .pomo>.pomo-set{grid-column:2;grid-row:2 / span 2}
  .pomo-time{font-size:64px}
  .desk-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px;align-items:start}
  .desk-cols>div>.sec-head:first-child{margin-top:6px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0 32px;align-items:start}
  .cal-wrap .cal-dayhead{margin-top:2px}
  .cal-side{position:sticky;top:52px;max-height:calc(88vh - 120px);overflow:auto}
  .cal-day{min-height:104px}
  .sheet.theme-sheet{width:min(900px,calc(100vw - 64px))}
  .themes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ai-fab:not(.hide){display:grid}

.ai-fab{display:none;position:fixed;right:24px;bottom:24px;z-index:32;width:58px;height:58px;place-items:center;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lift);cursor:pointer;transition:transform .15s}

  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}

    if (!state.pushGroup) {

      if ((GH.status === 'on' && !GH.pulled) || (FS.status === 'on' && !FS.pulled)) return;
      const b = crypto.getRandomValues(new Uint8Array(32));

    }
    const items = reminderItems(), sig = JSON.stringify([group, endpoint, items]);
    if (!force && sig === lastPushSig) return;
    const r = await pushPost('/g/sync', {group, endpoint, device: deviceName(), items, savedAt: state.savedAt});
    try { localStorage.setItem('docket.pushgroup', JSON.stringify({group, endpoint})); } catch (e) {}

async function notify(title, body, tag = 'docket-timer') {

/* ================= haptics ================= */
/* Android Chrome only: vibrate() has no amplitude control, so "intensity" scales pulse length */
const HAPTIC_PATTERNS = {tap: [1], select: [0.6], drag: [1.5], drop: [1], success: [1, 60, 1.3], warn: [2.4], alarm: [8, 140, 8, 140, 12]};
const canVibrate = typeof navigator.vibrate === 'function';
function haptic(kind = 'tap') {
  const h = state.settings.haptics;
  if (!canVibrate || !h || !h.on) return;
  const base = HAPTIC_MS[h.level] || HAPTIC_MS.medium;
  try { navigator.vibrate((HAPTIC_PATTERNS[kind] || HAPTIC_PATTERNS.tap).map((v, i) => i % 2 ? v : Math.max(1, Math.round(v * base)))); } catch (e) {}
}
const capWord = w => w.charAt(0).toUpperCase() + w.slice(1);
function openHapticsSheet() {
  openSheet(inner => {
    const draw = () => {
      const h = state.settings.haptics;
      inner.innerHTML = `<h2 class="sheet-title sheet-drag">Haptics</h2>`
        + `<label class="toggle"><span>Vibration feedback<small>Dragging, checking things off, timers and deletes</small></span><input type="checkbox" id="hp-on"${h.on ? ' checked' : ''}><span class="switch"></span></label>`
        + `<div class="fld" style="margin-top:12px"><span class="lbl">Intensity</span><div class="chips">`
        + ['light', 'medium', 'strong'].map(l => `<button type="button" class="fchip${h.level === l ? ' on' : ''}" data-l="${l}"${h.on ? '' : ' disabled'}>${capWord(l)}</button>`).join('') + `</div></div>`
        + `<div class="sheet-actions" style="justify-content:flex-start"><button type="button" class="btn" data-x="tap"${h.on ? '' : ' disabled'}>Test</button><button type="button" class="btn" data-x="alarm"${h.on ? '' : ' disabled'}>Test timer alert</button></div>`
        + `<p class="sheet-hint">${canVibrate ? 'Works in Chrome on Android. Silent or Do Not Disturb mode can block it, and it doesn’t work inside the preview.' : 'This browser can’t vibrate. iPhones and Safari don’t let web apps vibrate, and Firefox on Android turns it off.'}</p>`;
    };
    draw();
    inner.addEventListener('change', e => { if (e.target.id === 'hp-on') { state.settings.haptics.on = e.target.checked; save(); haptic('select'); draw(); } });
    inner.addEventListener('click', e => {
      const l = e.target.closest('[data-l]');
      if (l && !l.disabled) { state.settings.haptics.level = l.dataset.l; save(); haptic('drag'); draw(); return; }
      const x = e.target.closest('[data-x]'); if (!x || x.disabled) return;

    });
  }, {cls: 'compact'});

/* one ticker drives every live number on screen */
function tick() {
  const now = Date.now();
  const p = pr();
  if (p.endsAt && now >= p.endsAt) { pomoAdvance(true); return; }
  $$('[data-since]').forEach(el => { el.textContent = clock((+el.dataset.base || 0) + now - (+el.dataset.since)); });
  $$('[data-earn-since]').forEach(el => { el.textContent = fmtMoney(+el.dataset.earnBase + (now - +el.dataset.earnSince) * +el.dataset.earnRate, el.dataset.cur, 2); });
  if (p.phase !== 'idle' || $('[data-pomo-left]')) {
    const left = pomoLeft(now), dur = pomoDur(p.phase === 'idle' ? 'work' : p.phase);
    $$('[data-pomo-left]').forEach(el => { el.textContent = clock(left); });
    $$('[data-pomo-ring]').forEach(el => { el.setAttribute('stroke-dashoffset', (RING_C * (1 - left / dur)).toFixed(1)); });
    $$('[data-pomo-dock]').forEach(el => { el.style.setProperty('--p', ((1 - left / dur) * 100).toFixed(1)); });
  }

const DONE_NAME = /^(done|hotovo|dokon[čc]eno|completed|finished)$/i;
const doneListOf = c => c.lists.find(l => l.isDone) || c.lists.find(l => DONE_NAME.test(l.title.trim()));
/* a board's own placement rule for finished cards, or the global setting if it hasn't set one */
const doneModeOf = c => c.doneMode || (state.settings.autoMoveDone ? 'move' : 'leave');
/* whether a list hides its own finished cards: list setting wins if set, else the board's done mode, else the global setting */
const hideDoneOf = (c, l) => l.hideDone != null ? l.hideDone : (doneModeOf(c) === 'hide' || state.settings.hideDone);
/* returns a short message about where the card went, or '' */
function moveForDone(card, done) {
  const f = findCard(card.id); if (!f) return '';
  const {cat: c, list: l} = f;
  const mode = doneModeOf(c);
  if (mode === 'move') {
    if (done) {
      let dl = doneListOf(c), created = false;
      if (!dl) { dl = newList('Done', {isDone: true}); c.lists.push(dl); created = true; }
      if (dl === l) return '';
      l.cards.splice(f.index, 1); card.fromList = l.id; dl.cards.unshift(card);
      return created ? 'Moved to a new Done column' : `Moved to ${dl.title}`;
    }
    const dl = doneListOf(c);
    if (l !== dl) return '';
    const back = c.lists.find(x => x.id === card.fromList && x !== dl) || c.lists.find(x => x !== dl);
    if (!back) return '';
    l.cards.splice(f.index, 1); delete card.fromList; back.cards.unshift(card);
    return `Moved back to ${back.title}`;

  return '';

/* a repeating card that gets finished leaves a fresh copy in its place with the next due date */
function spawnNext(card) {
  if (!card.repeat || card.repeat === 'none' || !card.due) return '';
  const today = isoDay(0);
  let next = nextRepeat(card.repeat, card.due);
  while (next && next < today) next = nextRepeat(card.repeat, next);
  const f = findCard(card.id); if (!next || !f) return '';
  const cp = cloneCard(card);
  Object.assign(cp, {done: false, due: next, repeat: card.repeat}); delete cp.fromList; delete cp.spawned; delete cp.repeatWas;
  cp.checklist.forEach(i => { i.done = false; });
  f.list.cards.splice(f.index, 0, cp);
  card.spawned = cp.id; card.repeatWas = card.repeat; card.repeat = 'none';
  const t = dueInfo(next, false).text || fmtDate(parseISO(next));
  return `next one ${/^(Today|Tomorrow)$/.test(t) ? t.toLowerCase() : 'on ' + t}`;
}

  const next = done ? spawnNext(card) : (unspawn(card), '');

function updateTrash() {

    trashEl.style.opacity = Math.min(1, 0.15 + near * 0.75 + held).toFixed(2);

/* same "first real list" rule the rest of the app uses for a board's default destination

function firstNonDoneList(c) {

function moveCardToCategory(card, fromList, destCat) {

  if (!destList) return null;

function updateTarget() {
  const {type, x, y, el} = drag;
  if (type === 'card') {
    const tabEl = tabCatAt(x, y);
    setTabHover(tabEl);
    if (tabEl) { setHover(null); hideTrash(); return; }
    updateTrash();
    if (drag.overTrash) { setHover(null); return; }
    const list = listAt(x, y);
    setHover(list);
    if (!list) return;
    const cont = list.querySelector('[data-cards]');
    if (list.classList.contains('is-collapsed')) { if (el.parentNode !== cont) flip(() => cont.appendChild(el)); return; }
    const items = [...cont.children].filter(n => n !== el && n.classList.contains('card'));
    placeInto(cont, pickBefore(items, cont, y, 'y'));
  } else if (type === 'list') {
    const items = $$(':scope > .list', boardEl).filter(n => n !== el);
    placeInto(boardEl, pickBefore(items, boardEl, x, 'x') || boardEl.querySelector(':scope > .add-list'));
  } else {
    const items = $$(':scope > .tab[data-cat]', tabsEl).filter(n => n !== el);
    placeInto(tabsEl, pickBefore(items, tabsEl, x, 'x') || tabsEl.querySelector('.tab-add'));

function flip(mutate) {
  const els = $$(drag.flipSel).filter(n => n !== drag.el);
  const first = els.map(n => n.getBoundingClientRect());
  mutate();
  els.forEach(n => { n.style.transition = 'none'; n.style.transform = ''; });
  if (reduceMotion.matches) return;
  const last = els.map(n => n.getBoundingClientRect());
  els.forEach((n, i) => {
    const a = first[i], b = last[i];
    if (!a.width || !b.width) return;
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) n.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  void boardEl.offsetWidth;
  els.forEach(n => {
    if (n.style.transform) { n.style.transition = 'transform 180ms cubic-bezier(.2,.8,.2,1)'; n.style.transform = ''; }
    else n.style.transition = '';

}

function autoScroll() {
  if (!drag) return;
  const {x, y, type} = drag;
  let moved = false;
  const nudge = (el, axis, lo, hi, pos) => {
    const edge = Math.min(64, (hi - lo) * 0.18);
    let v = 0;
    if (pos < lo + edge) v = -Math.pow(Math.min(1, (lo + edge - pos) / edge), 2) * 18;
    else if (pos > hi - edge) v = Math.pow(Math.min(1, (pos - (hi - edge)) / edge), 2) * 18;
    if (!v) return;
    const prop = axis === 'x' ? 'scrollLeft' : 'scrollTop';
    const before = el[prop]; el[prop] += v;
    if (el[prop] !== before) moved = true;
  };
  if (type === 'tab') { const r = tabsEl.getBoundingClientRect(); nudge(tabsEl, 'x', r.left, r.right, x); }
  else {
    const r = boardEl.getBoundingClientRect();
    nudge(boardEl, 'x', r.left, r.right, x);
    if (type === 'card' && drag.hover && !drag.hover.classList.contains('is-collapsed')) {
      const c = drag.hover.querySelector('[data-cards]'), cr = c.getBoundingClientRect();
      if (x >= cr.left && x <= cr.right && c.scrollHeight > c.clientHeight) nudge(c, 'y', cr.top, cr.bottom, y);
    }
  }
  if (moved) updateTarget();
  drag.raf = requestAnimationFrame(autoScroll);
}

function commitDrop(d) {
  if (d.type === 'card') {
    const f = findCard(d.el.dataset.card), listEl = d.el.closest('.list');
    if (!f || !listEl) return;
    const to = findList(listEl.dataset.list); if (!to) return;
    f.list.cards.splice(f.index, 1);
    let idx = to.list.cards.length;
    if (!listEl.classList.contains('is-collapsed')) {
      const prev = d.el.previousElementSibling, next = d.el.nextElementSibling;
      if (prev) { const i = to.list.cards.findIndex(k => k.id === prev.dataset.card); if (i > -1) idx = i + 1; }
      else if (next) { const i = to.list.cards.findIndex(k => k.id === next.dataset.card); if (i > -1) idx = i; }
      else idx = 0;
    } else if (to.list !== f.list) toast(`Moved to ${to.list.title}`);
    to.list.cards.splice(idx, 0, f.card);
  } else if (d.type === 'list') {
    const order = $$(':scope > .list', boardEl).map(n => n.dataset.list);
    currentCat().lists.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  } else {
    const order = $$(':scope > .tab[data-cat]', tabsEl).map(n => n.dataset.cat);
    state.categories.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  }
}

function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  clearTimeout(d.tabTimer);
  if (d.tabHover) d.tabHover.classList.remove('is-drop', 'is-charging', 'is-armed');
  suppressUntil = performance.now() + 400;

  document.documentElement.classList.remove('dragging');
  trashEl.style.transform = ''; trashEl.style.opacity = '0'; trashEl.classList.remove('is-near', 'danger-hot');
  if (d.type === 'card' && d.tabArmed) { finishBoardMove(d); return; }
  if (d.type === 'card' && d.overTrash) {
    const f = findCard(d.el.dataset.card);
    d.ghost.style.transition = 'transform .18s ease, opacity .18s ease';
    d.ghost.style.opacity = '0';
    d.ghost.classList.add('to-trash');
    setTimeout(() => d.ghost.remove(), 180);
    settling = false;
    if (f) { haptic('warn'); const {list} = f, card = f.card; withUndo('Card deleted', () => { const r = running(); if (r && r.cardId === card.id) stopTracking(); list.cards.splice(list.cards.indexOf(card), 1); }); }
    else render();
    return;
  }
  try { commitDrop(d); } catch (err) { console.error('Drop failed', err); }
  haptic('drop');
  save();
  const r = d.el.getBoundingClientRect();
  const finish = () => { d.ghost.remove(); settling = false; render(); };
  if (reduceMotion.matches || !r.width) { finish(); return; }
  settling = true;
  d.ghost.classList.add('settling');

  setTimeout(finish, 170);

/* desktop helper: move a run of nodes into a two-column grid (left = before `split`, right = from `split`) */
function deskColumns(container, firstNode, split) {
  if (!wide.matches || !firstNode || !split || !container.contains(split)) return;
  const wrap = document.createElement('div'); wrap.className = 'desk-cols';
  const left = document.createElement('div'), right = document.createElement('div');
  firstNode.before(wrap);

  while (n && n !== split) { const next = n.nextSibling; left.appendChild(n); n = next; }

  wrap.append(left, right);

/* ================= sheets ================= */
const layer = $('#layer');
let sheet = null;
function openSheet(build, {cls = '', onClose} = {}) {
  closeMenu(true); closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div');
  el.className = 'sheet ' + cls; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="sheet-grip" aria-hidden="true"></div><div class="sheet-inner"></div>';
  layer.append(scrim, el);

  sheet = {el, scrim, onClose, prevFocus: document.activeElement};

  scrim.addEventListener('click', () => closeSheet());
  enableSwipeClose(el);
  build(inner, () => closeSheet());
  requestAnimationFrame(() => { scrim.classList.add('in'); el.classList.add('in'); });

}
function closeSheet(instant) {
  if (!sheet) return;
  const s = sheet; sheet = null;
  overlayClosed();
  if (s.onClose) s.onClose();
  if (document.activeElement && s.el.contains(document.activeElement)) document.activeElement.blur();
  const done = () => { s.el.remove(); s.scrim.remove(); };
  if (instant || reduceMotion.matches) done();
  else { s.el.classList.remove('in'); s.scrim.classList.remove('in'); setTimeout(done, 320); }

}
function enableSwipeClose(el) {
  const inner = el.querySelector('.sheet-inner');
  let y0 = 0, x0 = 0, t0 = 0, dy = 0, mode = null; /* null = undecided, 'drag' = moving the sheet, 'skip' = let the page scroll */
  const release = closeIt => {
    el.style.transition = '';
    suppressUntil = performance.now() + 350;

    mode = (wide.matches || e.touches.length !== 1 || e.target.closest('input, textarea, select, .chips, [data-cl-drag]')) ? 'skip' : null;
    if (mode) return;
    const t = e.touches[0]; y0 = t.clientY; x0 = t.clientX; t0 = e.timeStamp; dy = 0;
  }, {passive: true});

function promptSheet({title, value = '', placeholder = '', confirm = 'Save', onSave}) {
  openSheet((inner, close) => {
    inner.innerHTML = `<form class="prompt" novalidate><h2 class="sheet-title sheet-drag">${esc(title)}</h2>`
      + `<input id="prompt-input" class="field" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="${esc(title)}">`
      + `<div class="sheet-actions"><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">${esc(confirm)}</button></div></form>`;
    const form = inner.querySelector('form'), inp = inner.querySelector('input');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const v = inp.value.trim();
      if (!v) { inp.focus(); return; }

      + `<div class="sheet-actions"><button type="button" class="btn" data-x="cancel">${esc(cancel)}</button><button type="button" class="btn primary" data-x="ok"${danger ? ' style="background:var(--danger);color:#fff"' : ''}>${esc(confirm)}</button></div>`;

let ignorePop = false;

});
function openMenu(anchor, items) {

/* ================= sync folder (File System Access API) ================= */
const FS = {ok: typeof window.showDirectoryPicker === 'function', handle: null, status: 'off', err: '', timer: 0, last: 0};
let fsSheetDraw = null;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('docket', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(op, key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');
    const rq = op === 'get' ? st.get(key) : op === 'set' ? st.put(val, key) : st.delete(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function fsHint() {
  if (!FS.ok) return 'Not available in this browser';
  if (FS.status === 'on') return `Saving to “${FS.handle.name}”`;
  if (FS.status === 'paused') return 'Needs permission again';
  if (FS.status === 'error') return 'Problem: tap for details';
  return 'Off';
}
function fsFail(e) {
  if (e && e.name === 'NotAllowedError') { FS.status = 'paused'; }
  else if (e && e.name === 'SecurityError') { FS.status = 'error'; FS.err = 'This page isn’t allowed to open folders. Folder sync needs Docket opened from an https:// address or installed as an app.'; }
  else { FS.status = 'error'; FS.err = (e && e.message) || String(e); }
  toast(FS.status === 'paused' ? 'Docket lost access to your sync folder.' : 'Sync folder: ' + FS.err, FS.status === 'paused' ? {action: 'Allow', onAction: fsReconnect} : {});
  if (fsSheetDraw) fsSheetDraw();
}
async function fsInit() {
  if (!FS.ok) return;
  try {
    const h = await kv('get', 'dir'); if (!h) return;
    FS.handle = h;
    const p = await h.queryPermission({mode: 'readwrite'});
    if (p === 'granted') { FS.status = 'on'; await fsPull(); }
    else { FS.status = 'paused'; toast(`Allow Docket to keep using “${h.name}”?`, {action: 'Allow', onAction: fsReconnect}); }
  } catch (e) { /* no stored folder or no IndexedDB */ }
}
async function fsReconnect() {
  if (!FS.handle) return;
  try {
    const p = await FS.handle.requestPermission({mode: 'readwrite'});
    if (p === 'granted') { FS.status = 'on'; await fsPull(); fsPushSoon(); toast(`Syncing with “${FS.handle.name}”`); }
  } catch (e) { fsFail(e); }
  if (fsSheetDraw) fsSheetDraw();
}
async function fsChoose() {
  try {
    const h = await window.showDirectoryPicker({id: 'docket-sync', mode: 'readwrite'});
    FS.handle = h; FS.status = 'on'; FS.err = '';
    try { await kv('set', 'dir', h); } catch (e) {}
    await fsFirstSync();
  } catch (e) { if (e && e.name === 'AbortError') return; fsFail(e); }
}
async function fsRead() {
  try {
    const fh = await FS.handle.getFileHandle(SYNC_FILE);
    const f = await fh.getFile();
    return {text: await f.text(), modified: f.lastModified};
  } catch (e) { if (e && e.name === 'NotFoundError') return null; throw e; }
}
async function fsWrite() {
  if (!FS.handle || FS.status !== 'on') return;
  try {
    const fh = await FS.handle.getFileHandle(SYNC_FILE, {create: true});
    const w = await fh.createWritable();
    await w.write(JSON.stringify(state));
    await w.close();
    FS.last = Date.now();
    if (fsSheetDraw) fsSheetDraw();
  } catch (e) { fsFail(e); }
}
function fsPushSoon() { if (FS.status !== 'on') return; clearTimeout(FS.timer); FS.timer = setTimeout(fsWrite, 250); }
setInterval(() => { if (FS.status === 'on' && document.visibilityState === 'visible') fsPull(); }, 30000);
/* a stored folder whose permission lapsed is re-requested on the first tap, since browsers only allow the prompt after a user gesture */
document.addEventListener('click', () => { if (FS.status === 'paused' && FS.handle && !FS.asked) { FS.asked = true; fsReconnect(); } }, true);
function adopt(data, msg) {
  data.settings = Object.assign({}, state.settings, data.settings);
  state = data; saveLocal(); render(); localSoon(); pushSyncSoon();
  if (msg) toast(msg);
}
async function fsPull() {
  if (FS.status !== 'on') return;
  try {
    const r = await fsRead();
    if (!FS.pulled) { FS.pulled = true; pushSyncSoon(); }
    if (!r) { fsPushSoon(); return; }
    const data = normalize(JSON.parse(r.text));
    if (data.savedAt > state.savedAt) adopt(data, 'Loaded newer data from your sync folder');
    else if (data.savedAt < state.savedAt) fsPushSoon();
  } catch (e) { if (e instanceof SyntaxError) toast(`${SYNC_FILE} in your sync folder is damaged, so Docket kept this device's data.`); else fsFail(e); }
}
async function fsFirstSync() {
  let r;
  try { r = await fsRead(); } catch (e) { fsFail(e); return; }
  FS.pulled = true;
  if (!r) { await fsWrite(); toast(`Saving to “${FS.handle.name}”`); if (fsSheetDraw) fsSheetDraw(); return; }
  let data = null;
  try { data = normalize(JSON.parse(r.text)); } catch (e) {}
  if (!data) { await fsWrite(); toast(`Replaced an unreadable ${SYNC_FILE}`); return; }
  if (data.savedAt === state.savedAt) { toast('Folder connected'); if (fsSheetDraw) fsSheetDraw(); return; }
  confirmSheet({
    title: 'This folder already has Docket data',
    text: `Folder copy last saved ${data.savedAt ? fmtStamp(data.savedAt) : 'at an unknown time'}. This device last saved ${state.savedAt ? fmtStamp(state.savedAt) : 'never'}. Which one do you want to keep?`,
    confirm: 'Use folder data', cancel: 'Keep this device', danger: false,
    onConfirm: () => adopt(data, 'Loaded data from your sync folder'),
    onCancel: () => { fsWrite(); toast('Folder updated with this device’s data'); }
  });
}
function openFolderSheet() {
  openSheet(inner => {
    const draw = () => {
      let body;
      if (!FS.ok) {
        body = `<p class="sheet-text">This browser doesn’t let web pages save to a folder here.</p>`
          + `<p class="sheet-hint">Folder sync works in Chrome or Edge on a computer, and in Chrome 132 or newer on Android, when Docket is opened from an https:// address. The installable version will be. It doesn’t work in the preview or when the file is opened from your phone’s file manager.</p>`;
      } else {
        const status = FS.status === 'on' ? `Saving to “${esc(FS.handle.name)}”${FS.last ? ` · last written ${hhmm(FS.last)}` : ''}`
          : FS.status === 'paused' ? `Docket needs your permission to use “${esc(FS.handle.name)}” again.`
          : FS.status === 'error' ? esc(FS.err) : 'No folder chosen.';
        body = `<p class="sheet-text">Docket saves <span class="mono">${SYNC_FILE}</span> into this folder after every change. It loads the file when it starts, when you come back to it, and every 30 seconds, whenever the copy in the folder is newer. Point it at a Syncthing, Drive or Dropbox folder to share data between devices.</p>`
          + `<p class="sheet-hint" style="color:var(--ink-2)">${status}</p>`
          + `<div class="sheet-actions" style="justify-content:flex-start">`
          + (FS.handle && FS.status === 'paused' ? `<button type="button" class="btn primary" data-x="reconnect">Allow access</button>` : '')
          + `<button type="button" class="btn${FS.handle ? '' : ' primary'}" data-x="choose">${icon('folder')}${FS.handle ? 'Change folder' : 'Choose folder'}</button>`
          + (FS.handle && FS.status === 'on' ? `<button type="button" class="btn" data-x="sync">Sync now</button>` : '')
          + (FS.handle ? `<button type="button" class="btn danger" data-x="off">Disconnect</button>` : '')
          + `</div><p class="sheet-hint">If two devices change things at the same time, the version saved last wins.</p>`;
      }
      inner.innerHTML = `<h2 class="sheet-title sheet-drag">Sync folder</h2>${body}`;
    };
    fsSheetDraw = draw; draw();
    inner.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const x = b.dataset.x;
      if (x === 'choose') await fsChoose();
      else if (x === 'reconnect') await fsReconnect();
      else if (x === 'sync') { await fsPull(); await fsWrite(); toast('Synced'); }
      else if (x === 'off') { FS.handle = null; FS.status = 'off'; try { await kv('del', 'dir'); } catch (err) {} toast('Sync folder disconnected'); }
      if (fsSheetDraw) fsSheetDraw();
    });
  }, {cls: 'compact', onClose: () => { fsSheetDraw = null; }});
}

/* ================= sync to a private GitHub repository ================= */
/* The token lives only in this device's storage (never in the synced data). Fine-grained, one repo, Contents read+write. */
const GH_FILE = 'docket-data.json';
const GH = {repo: '', token: '', sha: null, status: 'off', err: '', last: 0, timer: 0, busy: false, again: false};
let ghSheetDraw = null;
function ghLoadCfg() {
  try { const c = JSON.parse(localStorage.getItem('docket.github') || 'null'); if (c && c.repo && c.token) { GH.repo = c.repo; GH.token = c.token; GH.status = 'on'; } } catch (e) {}
}
function ghSaveCfg() {
  try { if (GH.repo && GH.token) localStorage.setItem('docket.github', JSON.stringify({repo: GH.repo, token: GH.token})); else localStorage.removeItem('docket.github'); } catch (e) {}
}
const utf8ToB64 = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64ToUtf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = json => ({Authorization: `Bearer ${GH.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(json ? {'Content-Type': 'application/json'} : {})});
function ghError(status) {
  const e = new Error(status === 401 ? 'GitHub rejected the token. It may have expired: create a new one and connect again.'
    : status === 403 ? 'The token can’t write to this repository. Give it “Contents: Read and write” for this repo.'
    : status === 404 ? 'Repository not found. Check the name, and that the token has access to it.'
    : `GitHub answered ${status}. Docket will try again.`);
  e.fatal = status === 401 || status === 403 || status === 404;
  return e;
}
async function ghRead() {
  const res = await fetch(`https://api.github.com/repos/${GH.repo}/contents/${GH_FILE}`, {cache: 'no-store', headers: ghHeaders(false)});
  if (res.status === 404) { const repo = await fetch(`https://api.github.com/repos/${GH.repo}`, {cache: 'no-store', headers: ghHeaders(false)}); if (!repo.ok) throw ghError(repo.status); return null; }
  if (!res.ok) throw ghError(res.status);
  const j = await res.json();
  return {sha: j.sha, data: JSON.parse(b64ToUtf8(j.content))};
}
function ghFail(e) {
  GH.err = (e && e.message) || String(e);
  if (e && e.fatal) { GH.status = 'error'; toast('GitHub sync stopped: ' + GH.err); }
  if (ghSheetDraw) ghSheetDraw();
}
function ghHint() {
  if (GH.status === 'on') return GH.err ? 'Waiting to retry' : `Syncing with ${GH.repo}`;
  if (GH.status === 'error') return 'Problem: tap for details';
  return 'Off';
}
async function ghWrite(keepalive) {
  if (GH.status !== 'on') return;
  if (GH.busy) { GH.again = true; return; }
  GH.busy = true;
  try {
    const text = JSON.stringify(state, null, 1);
    const body = {message: `Docket sync · ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`, content: utf8ToB64(text)};
    if (GH.sha) body.sha = GH.sha;
    const put = () => fetch(`https://api.github.com/repos/${GH.repo}/contents/${GH_FILE}`, {method: 'PUT', headers: ghHeaders(true), body: JSON.stringify(body), keepalive: !!keepalive && text.length < 45000});
    let res = await put();
    if (res.status === 409 || res.status === 422) {
      /* the file changed elsewhere since we last read it: the newer save wins */
      const remote = await ghRead();
      if (remote) {
        GH.sha = remote.sha;
        const data = normalize(remote.data);

const RING_C = 2 * Math.PI * 88;
let timeDraw = null;

function periodRange(kind, from, to) {

  switch (kind) {
    case 'lastweek': return [new Date(y, m, dt - wd - 7).getTime(), new Date(y, m, dt - wd).getTime()];
    case 'month': return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()];
    case 'lastmonth': return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()];
    case 'custom': {
      const f = from ? parseISO(from) : new Date(y, m, 1).getTime();
      const t = to ? parseISO(to) + 864e5 : new Date(y, m, dt + 1).getTime();

}

function tasksForJob(jobId) {

    + `<div class="hrs-summary"><div><div class="hrs-big">${fmtHM(total)}</div><div class="mono muted hrs-sub">${(total / 36e5).toFixed(2)} h · ${label}</div></div>${earn ? `<div class="hrs-earn">${earn}</div>` : ''}</div>`
    + `<div class="hrs-actions"><button type="button" class="btn" data-t="add-entry">${icon('plus')}Add past time</button><button type="button" class="btn" data-t="export">${icon('sheet')}Export</button></div>`
    + (days || `<div class="empty">Nothing logged in this period.</div>`);
}

/* ---------- stats ---------- */
/* chart series: dataviz reference palette (validated), assigned by job order so a job keeps its color */
const SERIES = {light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7'], dark: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9']};
const SERIES_OTHER = {light: '#8a8f99', dark: '#6b7079'};
function themeIsDark() {
  const t = state.settings.theme, sk = SKINS[t];
  if (sk) return sk.base === 'dark';
  if (t === 'dark' || t === 'light') return t === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function statsRange(period, offset) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(), dt = d.getDate(), wd = (d.getDay() + 6) % 7;
  if (period === 'week') {
    const day = i => new Date(y, m, dt - wd + offset * 7 + i);
    return {from: day(0).getTime(), to: day(7).getTime(), title: `${fmtDate(day(0).getTime())} – ${fmtDate(day(6).getTime(), true)}`,
      buckets: Array.from({length: 7}, (_, i) => ({from: day(i).getTime(), to: day(i + 1).getTime(), label: day(i).toLocaleDateString(undefined, {weekday: 'narrow'}), full: day(i).toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'})}))};
  }
  if (period === 'year') {
    const yy = y + offset, mo = i => new Date(yy, i, 1);
    return {from: mo(0).getTime(), to: mo(12).getTime(), title: String(yy),
      buckets: Array.from({length: 12}, (_, i) => ({from: mo(i).getTime(), to: mo(i + 1).getTime(), label: mo(i).toLocaleDateString(undefined, {month: 'narrow'}), full: mo(i).toLocaleDateString(undefined, {month: 'long', year: 'numeric'})}))};
  }
  const ms = new Date(y, m + offset, 1), yy = ms.getFullYear(), mm = ms.getMonth(), n = new Date(yy, mm + 1, 0).getDate();
  return {from: ms.getTime(), to: new Date(yy, mm + 1, 1).getTime(), title: ms.toLocaleDateString(undefined, {month: 'long', year: 'numeric'}),
    buckets: Array.from({length: n}, (_, i) => { const a = new Date(yy, mm, i + 1); return {from: a.getTime(), to: new Date(yy, mm, i + 2).getTime(), label: i === 0 || (i + 1) % 5 === 0 ? String(i + 1) : '', full: a.toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'})}; })};
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
/* columns, optionally stacked: thin bars, 4px rounded tops, 2px gaps between stacked parts, hairline grid, one axis */
function columnChart({buckets, series, fmt, tick, label}) {
  const W = 340, H = 160, L = 34, R = 4, T = 12, B = 20, pw = W - L - R, ph = H - T - B, n = buckets.length, band = pw / n;
  const totals = buckets.map((_, i) => series.reduce((s, se) => s + se.values[i], 0));
  const max = niceMax(Math.max(...totals));
  const bw = Math.max(3, Math.min(22, band * 0.62));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  [0, max / 2, max].forEach(v => {
    const y = (T + ph - v / max * ph).toFixed(1);
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${(+y + 3).toFixed(1)}" text-anchor="end">${tick(v)}</text>`;
  });
  buckets.forEach((b, i) => {
    const x = L + band * i + (band - bw) / 2;
    let y0 = T + ph;
    const segs = series.map(se => ({se, v: se.values[i]})).filter(s => s.v > 0);
    segs.forEach((s, si) => {
      const h = s.v / max * ph, y = y0 - h, hh = Math.max(0.5, h - (si > 0 ? 2 : 0));
      if (si === segs.length - 1) {
        const r = Math.min(4, bw / 2, hh);
        svg += `<path fill="${s.se.color}" d="M${x.toFixed(1)},${(y + hh).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${(y + hh).toFixed(1)}Z"/>`;
      } else svg += `<rect fill="${s.se.color}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}"/>`;
      y0 = y;
    });
    if (b.label) svg += `<text class="ax" x="${(L + band * i + band / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${esc(b.label)}</text>`;
    const tip = `${b.full}: ${fmt(totals[i])}` + (series.length > 1 && segs.length ? ' (' + segs.map(s => `${s.se.name} ${fmt(s.v)}`).join(', ') + ')' : '');
    svg += `<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ph + B}" data-tip="${esc(tip)}" data-cx="${((L + band * i + band / 2) / W).toFixed(4)}"/>`;
  });
