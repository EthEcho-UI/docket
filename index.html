}
const hTick = v => v === 0 ? '0' : v < 1 ? `${Math.round(v * 60)}m` : `${+v.toFixed(1)}h`;
const mTick = v => v === 0 ? '0' : v >= 1e6 ? `${+(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(Math.round(v));

function statsHTML() {
  const s = ui.stats, now = Date.now(), dark = themeIsDark(), PAL = SERIES[dark ? 'dark' : 'light'], OTHER = SERIES_OTHER[dark ? 'dark' : 'light'];
  const jobChips = `<div class="chips" role="group" aria-label="Job">` + [['all', 'All jobs', null], ...state.jobs.map(j => [j.id, j.name, j.color])].map(([k, n, c]) =>
    `<button type="button" class="fchip${s.job === k ? ' on' : ''}" data-t="st-job" data-k="${k}">${c ? `<span class="tab-dot" style="--c:var(--l-${c})"></span>` : ''}${esc(n)}</button>`).join('') + `</div>`;
  const periodSeg = `<div class="seg seg-sm" role="group" aria-label="Period">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, n]) => `<button type="button" class="${s.period === k ? 'on' : ''}" data-t="st-period" data-k="${k}">${n}</button>`).join('')}</div>`;
  const R = statsRange(s.period, s.offset);
  const nav = `<div class="st-nav"><button type="button" class="icon-btn" data-t="st-prev" aria-label="Previous">${icon('arrowL')}</button><b>${esc(R.title)}</b><button type="button" class="icon-btn" data-t="st-next" aria-label="Next"${s.offset >= 0 ? ' disabled' : ''}>${icon('arrowR')}</button></div>`;
  const inJob = e => s.job === 'all' || e.jobId === s.job;
  const inRange = (e, a, b) => e.start >= a && e.start < b;
  const list = state.entries.filter(e => inJob(e) && inRange(e, R.from, R.to));
  const ms = list.reduce((a, e) => a + entryMs(e, now), 0);
  const prevR = statsRange(s.period, s.offset - 1);
  const prevMs = state.entries.filter(e => inJob(e) && inRange(e, prevR.from, prevR.to)).reduce((a, e) => a + entryMs(e, now), 0);
  /* earnings: in the currency that has the most money; others are noted, never added together */
  const moneyBy = es => { const by = {}; es.forEach(e => { const j = jobById(e.jobId); if (j && j.rate) by[j.currency || ''] = (by[j.currency || ''] || 0) + entryMs(e, now) / 36e5 * j.rate; }); return by; };
  const allMoney = moneyBy(state.entries.filter(inJob));
  const curs = Object.keys(allMoney).sort((a, b) => allMoney[b] - allMoney[a]);
  const cur = curs[0] ?? null;
  const money = cur == null ? 0 : (moneyBy(list)[cur] || 0);
  const days = new Set(list.filter(e => !e.undated).map(e => dayKey(e.start))).size;
  const undatedMs = list.filter(e => e.undated).reduce((a, e) => a + entryMs(e, now), 0);
  const per = {week: 'last week', month: 'last month', year: 'last year'}[s.period];
  const diff = ms - prevMs;
  const delta = prevMs || ms ? `${diff >= 0 ? '▲' : '▼'} ${fmtHM(Math.abs(diff))} vs ${per}` : '';
  const tiles = `<div class="tiles">`
    + `<div class="tile"><div class="k">Hours</div><div class="v">${fmtHM(ms)}</div><div class="s">${undatedMs ? `incl. ${fmtHM(undatedMs)} with no date` : delta}</div></div>`
    + `<div class="tile"><div class="k">Earned</div><div class="v">${cur == null ? '–' : esc(fmtMoney(money, cur))}</div><div class="s">${cur == null ? 'Set an hourly rate in Settings → Jobs' : curs.length > 1 ? `Only ${esc(cur || 'no currency')} shown` : `${(ms / 36e5).toFixed(2)} h`}</div></div>`
    + `<div class="tile"><div class="k">Days worked</div><div class="v">${days}</div><div class="s">of ${R.buckets.length} ${s.period === 'year' ? 'months' : 'days'}</div></div>`
    + `<div class="tile"><div class="k">Per worked day</div><div class="v">${days ? fmtHM(ms / days) : '–'}</div><div class="s">${days && cur != null ? esc(fmtMoney(money / days, cur)) + ' a day' : ''}</div></div>`
    + `</div>`;
  if (!list.length && !state.entries.length) return jobChips + periodSeg + nav + `<div class="empty">Log some work time first, then your hours and earnings show up here.</div>`;

  /* hours chart: one series, or stacked by job (entity order, max 7 + Other) */
  const jobsHere = state.jobs.filter(j => list.some(e => e.jobId === j.id));
  const hasOther = list.some(e => !e.jobId || state.jobs.findIndex(j => j.id === e.jobId) >= 7);
  let series;
  if (s.job !== 'all' || jobsHere.length + (hasOther ? 1 : 0) <= 1) series = [{name: 'Hours', color: PAL[0], match: () => true}];
  else series = jobsHere.filter(j => state.jobs.indexOf(j) < 7).map(j => ({name: j.name, color: PAL[state.jobs.indexOf(j)], match: e => e.jobId === j.id}))
    .concat(hasOther ? [{name: 'Other', color: OTHER, match: e => !e.jobId || state.jobs.findIndex(j => j.id === e.jobId) >= 7}] : []);
  series.forEach(se => { se.values = R.buckets.map(b => list.filter(e => !e.undated && se.match(e) && inRange(e, b.from, b.to)).reduce((a, e) => a + entryMs(e, now) / 36e5, 0)); });
  const legend = series.length > 1 ? `<div class="legend">${series.map(se => `<span><i style="--c:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  const hoursChart = `<div class="sec-head"><h3>Hours per ${s.period === 'year' ? 'month' : 'day'}</h3></div>` + legend
    + columnChart({buckets: R.buckets, series, fmt: v => fmtHM(v * 36e5), tick: hTick, label: `Hours per ${s.period === 'year' ? 'month' : 'day'}, ${R.title}`});

  /* earnings trend: the last few periods, ending with the one shown */
  let earnChart = '';
  if (cur != null) {
    const N = {week: 8, month: 6, year: 5}[s.period];
    const trend = Array.from({length: N}, (_, i) => statsRange(s.period, s.offset - (N - 1 - i)));
    const vals = trend.map(t => moneyBy(state.entries.filter(e => inJob(e) && inRange(e, t.from, t.to)))[cur] || 0);
    const lab = t => s.period === 'week' ? new Date(t.from).toLocaleDateString(undefined, {day: 'numeric', month: 'numeric'}) : s.period === 'month' ? new Date(t.from).toLocaleDateString(undefined, {month: 'short'}) : t.title;
    earnChart = `<div class="sec-head"><h3>Earned per ${s.period}${cur ? ` · ${esc(cur)}` : ''}</h3></div>`
      + columnChart({buckets: trend.map(t => ({label: lab(t), full: t.title})), series: [{name: 'Earned', color: PAL[0], values: vals}], fmt: v => fmtMoney(v, cur), tick: mTick, label: `Earnings per ${s.period}`});
  }

  /* table view: per job and top tasks */
  const rows = state.jobs.map(j => ({j, ms: list.filter(e => e.jobId === j.id).reduce((a, e) => a + entryMs(e, now), 0)})).filter(x => x.ms > 0).sort((a, b) => b.ms - a.ms);
  const noJob = list.filter(e => !e.jobId).reduce((a, e) => a + entryMs(e, now), 0);
  const jobTable = rows.length || noJob ? `<div class="sec-head"><h3>By job</h3></div><table class="st-table"><thead><tr><th>Job</th><th class="n">Hours</th><th class="n">Earned</th></tr></thead><tbody>`
    + rows.map(x => `<tr><td><span class="tab-dot" style="--c:var(--l-${x.j.color});display:inline-block;margin-right:8px"></span>${esc(x.j.name)}<div class="share"><i style="width:${(x.ms / ms * 100).toFixed(1)}%;--c:var(--l-${x.j.color})"></i></div></td><td class="n">${fmtHM(x.ms)}</td><td class="n">${x.j.rate ? esc(fmtMoney(x.ms / 36e5 * x.j.rate, x.j.currency)) : '–'}</td></tr>`).join('')
    + (noJob ? `<tr><td>No job</td><td class="n">${fmtHM(noJob)}</td><td class="n">–</td></tr>` : '') + `</tbody></table>` : '';
  const tmap = new Map();
  list.forEach(e => { const k = (e.jobId || '') + '|' + taskKey(e); const t = tmap.get(k) || {title: entryLabel(e), job: jobById(e.jobId), ms: 0}; t.ms += entryMs(e, now); tmap.set(k, t); });
  const top = [...tmap.values()].sort((a, b) => b.ms - a.ms).slice(0, 5);
  const topTable = top.length ? `<div class="sec-head"><h3>Top tasks</h3></div><table class="st-table"><tbody>`
    + top.map(t => `<tr><td>${esc(t.title)}${s.job === 'all' && t.job ? `<div class="mono muted" style="font-size:12px;margin-top:2px">${esc(t.job.name)}</div>` : ''}</td><td class="n">${fmtHM(t.ms)}</td></tr>`).join('') + `</tbody></table>` : '';

  return jobChips + periodSeg + nav + tiles + (list.length ? hoursChart : `<div class="empty">Nothing logged in ${esc(R.title)}.</div>`) + earnChart + jobTable + topTable;
}

function openTimePanel(tab) {
  if (tab) ui.timeTab = tab;
  if (!['focus', 'hours', 'stats'].includes(ui.timeTab)) ui.timeTab = 'hours';
  openSheet((inner, close) => {
    const back = () => openTimePanel(ui.timeTab);
    const draw = () => {
      const st = inner.scrollTop;
      inner.innerHTML = `<div class="time-top sheet-drag"><div class="seg" role="tablist">` + [['focus', 'Focus'], ['hours', 'Hours'], ['stats', 'Stats']].map(([k, n]) =>
          `<button type="button" role="tab" aria-selected="${ui.timeTab === k}" class="${ui.timeTab === k ? 'on' : ''}" data-t="tab" data-k="${k}">${n}</button>`).join('')
        + `</div></div>`
        + (ui.timeTab === 'focus' ? focusHTML() : ui.timeTab === 'hours' ? hoursHTML() : statsHTML());
      if (wide.matches) {
        const top = $('.time-top', inner), heads = $$(':scope > .sec-head', inner);
        if (ui.timeTab === 'hours' && heads.length > 1) deskColumns(inner, top.nextSibling, heads[1]);
        if (ui.timeTab === 'stats' && heads.length > 1) { const tiles = $('.tiles', inner); deskColumns(inner, tiles ? tiles.nextSibling : heads[0], heads.find(h => /Earned|By job/.test(h.textContent)) || heads[1]); }
      }
      inner.scrollTop = st;
    };
    timeDraw = draw; draw();
    const taskTitle = () => { const inp = $('#task-input', inner); return inp ? inp.value.replace(/\s+/g, ' ').trim() : ''; };
    const showTip = hit => {
      const ch = hit.closest('.chart'), tip = $('.tip', ch);
      tip.textContent = hit.dataset.tip; tip.hidden = false;
      const cw = ch.clientWidth, tw = tip.offsetWidth;
      tip.style.left = Math.min(cw - tw / 2, Math.max(tw / 2, cw * +hit.dataset.cx)) + 'px';
      $$('.hit.on', ch).forEach(h => h.classList.remove('on')); hit.classList.add('on');
    };
    inner.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') showTip(h); });
    inner.addEventListener('pointerout', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') { const tip = $('.tip', h.closest('.chart')); tip.hidden = true; h.classList.remove('on'); } });
    inner.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('pomo-set')) ui.pomoSetOpen = e.target.open; }, true);
    inner.addEventListener('submit', e => {

      const j = workJob(), title = taskTitle();
      if (!j || !title) { $('#task-input', inner).focus(); return; }

      commit(); draw();

    });
    inner.addEventListener('click', e => {
      const hit = e.target.closest('.hit'); if (hit) { showTip(hit); return; }
      const b = e.target.closest('[data-t]'); if (!b || b.disabled) return;

        case 'tab': ui.timeTab = b.dataset.k; haptic('select'); draw(); inner.scrollTop = 0; return;
        case 'pomo-toggle': haptic('tap'); pomoToggle(); break;
        case 'pomo-skip': haptic('tap'); pomoAdvance(false); break;
        case 'pomo-reset': haptic('tap'); pomoReset(); break;
        case 'notif': (notifStatus() === 'on' ? disableNotifications() : enableNotifications()).then(draw); return;
        case 'job-pick': state.settings.workJob = b.dataset.k; ui.allTasks = false; haptic('select'); commit(); break;
        case 'job-add': openJobEditor(null, {back}); return;
        case 'task-add': {
          const j = workJob(), title = taskTitle();

        case 'track-stop': haptic('tap'); stopTracking(); commit(); break;

    });

}

function openTaskSheet(key) {
  const j = workJob(); if (!j) return;
  openSheet((inner, close) => {
    const draw = () => {

      const now = Date.now();
      const es = state.entries.filter(e => (e.jobId || null) === j.id && taskKey(e) === key).sort((a, b) => b.start - a.start);
      const finished = es.filter(e => e.end != null).reduce((s, e) => s + (e.end - e.start), 0);
      const money = j.rate ? (t.live ? liveEarnHTML(t.live, finished / 36e5 * j.rate) : esc(fmtMoney(finished / 36e5 * j.rate, j.currency))) : '';
      inner.innerHTML = `<div class="cs-head sheet-drag">`
        + (t.cardId ? `<div class="cs-title">${esc(t.title)}</div>` : `<textarea id="tk-title" class="cs-title" rows="1" maxlength="120" aria-label="Task name">${esc(t.title)}</textarea>`)
        + `</div>`
        + `<div class="cs-where" style="padding-left:2px"><span class="tab-dot" style="--c:var(--l-${j.color})"></span><span class="muted">${esc(j.name)}</span></div>`
        + `<div class="time-row">${t.live ? `<button type="button" class="btn stop" data-x="stop">${icon('stop')}Stop</button>` : `<button type="button" class="btn primary" data-x="go">${icon('play')}${t.fresh ? 'Start' : 'Continue'}</button>`}`
        + `<button type="button" class="btn" data-x="add">${icon('plus')}Add past time</button>`
        + (t.cardId && findCard(t.cardId) ? `<button type="button" class="btn" data-x="card">Open card</button>` : '') + `</div>`
        + `<section class="cs-sec" style="margin-top:16px"><div class="cs-sec-head"><h3><label for="tk-card">Linked card</label></h3></div>`
        + `<span class="select-wrap block"><select id="tk-card" class="select"><option value="">Not linked</option>${cardOptionsHTML(t.cardId)}</select></span>`
        + `<p class="sheet-hint">Linking a card from your lists means its timer counts here too, and this task shows the card’s name.</p></section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3>Logged time</h3><span class="mono">`
        + (t.live ? `<span data-since="${t.live.start}" data-base="${t.total - (now - t.live.start)}">${clock(t.total)}</span>` : fmtHM(t.total)) + (money ? ` · ${money}` : '') + `</span></div>`
        + (groupByDay(es).map(([k, list]) => `<div class="day"><div class="day-head"><span>${dayGroupLabel(k)}</span><span>${fmtHM(list.reduce((s, e) => s + entryMs(e, now), 0))}</span></div>`
          + list.map(e => `<button type="button" class="entry${e.end == null ? ' live' : ''}" data-x="entry" data-e="${e.id}"><span class="t"><b>${timeRange(e)}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</span>`
            + `<span class="d">${e.end == null ? `<span data-since="${e.start}">${clock(now - e.start)}</span>` : fmtHM(e.end - e.start)}</span></button>`).join('') + `</div>`).join('') || `<p class="empty sm">No time yet. Press ${t.fresh ? 'Start' : 'Continue'} or add past time.</p>`)
        + `</section>`
        + `<footer class="cs-foot"><span class="mono muted">${es.length} ${es.length === 1 ? 'entry' : 'entries'}</span><button type="button" class="btn danger" data-x="del">${icon('trash')}Delete task</button></footer>`;
      autosize($('#tk-title', inner));
    };
    draw();
    const back = () => openTaskSheet(key);
    inner.addEventListener('click', e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const t = tasksForJob(j.id).find(x => x.key === key); if (!t) return;
      switch (b.dataset.x) {
        case 'go': unlockAudio(); haptic('tap'); startTracking({cardId: t.cardId, jobId: j.id, title: t.title}); commit(); draw(); return;
        case 'stop': haptic('tap'); stopTracking(); commit(); draw(); return;
        case 'add': openEntryEditor(null, {jobId: j.id, cardId: t.cardId, title: t.title, back}); return;
        case 'card': close(); openCard(t.cardId); return;
        case 'entry': openEntryEditor(b.dataset.e, {back}); return;
        case 'del':
          close();
          withUndo(`Deleted “${t.title}”${t.total ? ` and its ${fmtHM(t.total)}` : ''}`, () => {
            const r = running(); if (r && (r.jobId || null) === j.id && taskKey(r) === key) stopTracking();
            state.entries = state.entries.filter(x => !((x.jobId || null) === j.id && taskKey(x) === key));
            state.wtasks = state.wtasks.filter(w => !(w.jobId === j.id && wKey(w) === key));
          });
          openTimePanel('hours');
      }
    });
    inner.addEventListener('input', e => { if (e.target.id === 'tk-title') autosize(e.target); });
    inner.addEventListener('keydown', e => { if (e.target.id === 'tk-title' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.target.blur(); } });
    inner.addEventListener('change', e => {
      if (e.target.id === 'tk-card') {
        const v = e.target.value || null;
        key = linkTask(j, key, v);
        haptic('select'); commit(); draw();
        toast(v ? 'Linked. Time on that card now counts here.' : 'Unlinked from the card');
        return;
      }
      if (e.target.id !== 'tk-title') return;
      const v = e.target.value.replace(/\s+/g, ' ').trim();
      if (!v) { draw(); return; }
      state.entries.forEach(x => { if ((x.jobId || null) === j.id && taskKey(x) === key) x.title = v; });
      state.wtasks.forEach(w => { if (w.jobId === j.id && wKey(w) === key) w.title = v; });
      key = 't:' + v.toLowerCase();
      commit(); draw();
    });
  }, {cls: 'card-sheet', onClose: () => { if (!sheet) setTimeout(() => { if (!sheet) openTimePanel('hours'); }, 0); }});
}

function openJobsSheet() {

      + `<p class="sheet-text">Jobs group your logged hours. Link a category to a job and task timers started in that category count toward it.</p>`
      + state.jobs.map(j => {

function openEntryEditor(id, {cardId = null, jobId = null, title = '', back} = {}) {
  const ex = id ? state.entries.find(e => e.id === id) : null;
  if (id && !ex) { toast('That entry no longer exists'); if (back) back(); return; }
  const now = Date.now();
  const e = ex ? {...ex} : {id: uid(), cardId, jobId: jobId || (cardId ? jobForCard(cardId) : null), title, start: now - 3600000, end: now, note: ''};
  const card = findCard(e.cardId);
  openSheet((inner, close) => {
    inner.innerHTML = `<form novalidate><h2 class="sheet-title sheet-drag">${ex ? 'Edit time' : 'Add past time'}</h2><div class="form-grid">`
      + `<div class="fld full"><label for="en-job">Job</label><span class="select-wrap block"><select id="en-job" class="select">${jobOptions(e.jobId)}</select></span></div>`
      + `<div class="fld full"><label for="en-title">${card ? 'Card' : 'Task'}</label><input id="en-title" class="field" value="${esc(card ? card.card.title : e.title)}"${card ? ' readonly' : ''} maxlength="120" placeholder="What did you work on?" autocomplete="off"></div>`
      + (e.end == null ? '' : `<label class="toggle full"><span>No specific date<small>Just log how long you worked, not when</small></span><input type="checkbox" id="en-undated"${e.undated ? ' checked' : ''}><span class="switch"></span></label>`)
      + `<div class="full form-grid" id="en-when"${e.undated ? ' hidden' : ''}>`
      + `<div class="fld full"><label for="en-date">Date</label><input id="en-date" type="date" class="field" value="${dayKey(e.start)}"></div>`
      + `<div class="fld"><label for="en-start">Start</label><input id="en-start" type="time" class="field" value="${hhmm(e.start)}"></div>`
      + `<div class="fld"><label for="en-end">End</label>${e.end == null ? `<div class="running-note"><span class="live-dot"></span><span data-since="${e.start}">${clock(now - e.start)}</span></div>` : `<input id="en-end" type="time" class="field" value="${hhmm(e.end)}">`}</div></div>`
      + (e.end == null ? '' : (() => { const mins = Math.max(0, Math.round((e.end - e.start) / 6e4)); return `<div class="full form-grid" id="en-dur"${e.undated ? '' : ' hidden'}>`
        + `<div class="fld"><label for="en-h">Hours</label><input id="en-h" type="number" inputmode="numeric" min="0" max="999" class="field" value="${Math.floor(mins / 60)}"></div>`
        + `<div class="fld"><label for="en-m">Minutes</label><input id="en-m" type="number" inputmode="numeric" min="0" max="59" class="field" value="${mins % 60}"></div></div>`; })())
      + `<div class="fld full"><label for="en-note">Note</label><input id="en-note" class="field" value="${esc(e.note)}" maxlength="200" autocomplete="off"></div>`
      + `</div><p class="sheet-hint" id="en-msg" aria-live="polite"></p>`
      + `<div class="sheet-actions">${ex ? `<button type="button" class="btn danger" data-x="del">${icon('trash')}Delete</button>` : ''}<span class="grow"></span>`
      + (ex && e.end == null ? `<button type="button" class="btn" data-x="stop">${icon('stop')}Stop</button>` : '')
      + `<button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
    const msg = $('#en-msg', inner);
    const done = () => { close(); if (back) back(); };
    inner.addEventListener('change', ev => {
      if (ev.target.id !== 'en-undated') return;
      $('#en-when', inner).hidden = ev.target.checked; $('#en-dur', inner).hidden = !ev.target.checked; haptic('select');
    });
    inner.querySelector('form').addEventListener('submit', ev => {
      ev.preventDefault();
      const und = $('#en-undated', inner);
      if (und && und.checked) {
        const mins = Math.round(Number($('#en-h', inner).value || 0) * 60 + Number($('#en-m', inner).value || 0));
        if (!(mins > 0)) { msg.textContent = 'Enter how long you worked.'; return; }
        /* the time stays in the period it was logged in (or keeps its old place when editing) */
        const anchor = ex && ex.end != null ? ex.end : Date.now();
        const patch = {jobId: $('#en-job', inner).value || null, start: anchor - mins * 6e4, end: anchor, note: $('#en-note', inner).value.trim(), undated: true};
        if (!card) {
          patch.title = $('#en-title', inner).value.replace(/\s+/g, ' ').trim();
          if (!patch.title) { msg.textContent = 'Name the task so you can find it later.'; $('#en-title', inner).focus(); return; }
        }
        if (ex) Object.assign(ex, patch); else state.entries.push(Object.assign(e, patch));
        commit(); toast(`Saved ${fmtHM(mins * 6e4)} with no date`);
        done();
        return;
      }
      const date = $('#en-date', inner).value, st = $('#en-start', inner).value, endEl = $('#en-end', inner);
      if (!date || !st || (endEl && !endEl.value)) { msg.textContent = 'Fill in the date, start and end time.'; return; }
      const start = new Date(`${date}T${st}`).getTime();
      let end = null;
      if (endEl) { end = new Date(`${date}T${endEl.value}`).getTime(); if (end <= start) end += 864e5; }
      else if (start > Date.now()) { msg.textContent = 'A running timer can’t start in the future.'; return; }
      const patch = {jobId: $('#en-job', inner).value || null, start, end, note: $('#en-note', inner).value.trim()};
      if (ex) delete ex.undated;
      if (!card) {
        patch.title = $('#en-title', inner).value.replace(/\s+/g, ' ').trim();
        if (!patch.title) { msg.textContent = 'Name the task so you can find it later.'; $('#en-title', inner).focus(); return; }
      }
      if (ex) Object.assign(ex, patch); else state.entries.push(Object.assign(e, patch));
      commit(); toast(`Saved ${fmtHM((end ?? Date.now()) - start)}`);
      done();
    });
    inner.addEventListener('click', ev => {
      const b = ev.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'cancel') done();
      else if (b.dataset.x === 'stop') { ex.end = Date.now(); commit(); done(); }
      else if (b.dataset.x === 'del') { close(); withUndo('Time entry deleted', () => { state.entries.splice(state.entries.indexOf(ex), 1); }); if (back) back(); }
    });
  }, {cls: 'compact'});
}

      + `<div class="fld full"><span class="lbl">Color</span><div class="menu-swatches flat" role="group" aria-label="Color">${LABEL_KEYS.map(k => `<button type="button" class="swatch${k === j.color ? ' on' : ''}" data-k="${k}" style="--c:var(--l-${k})" aria-label="${LABEL_NAME[k]}" aria-pressed="${k === j.color}"></button>`).join('')}</div></div>`

      + `<div class="fld"><label for="job-cur">Currency</label><input id="job-cur" class="field" maxlength="6" value="${esc(j.currency)}" placeholder="CZK" autocomplete="off"></div>`
      + `<div class="fld full"><span class="lbl">Categories that count toward this job</span><div class="label-pick">${state.categories.map(c => `<button type="button" class="lp${linked.has(c.id) ? ' on' : ''}" data-c="${c.id}" style="--c:var(--l-${c.color})" aria-pressed="${linked.has(c.id)}"><i></i><span>${esc(c.name)}</span></button>`).join('')}</div></div>`
      + `</div><p class="sheet-hint" id="job-msg" aria-live="polite"></p>`
      + `<div class="sheet-actions">${ex ? `<button type="button" class="btn danger" data-x="del">${icon('trash')}Delete</button>` : ''}<span class="grow"></span><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
    const done = () => { close(); if (back) back(); };
    inner.addEventListener('click', ev => {
      const sw = ev.target.closest('.swatch');
      if (sw) { j.color = sw.dataset.k; $$('.swatch', inner).forEach(s => { s.classList.toggle('on', s === sw); s.setAttribute('aria-pressed', String(s === sw)); }); return; }
      const lp = ev.target.closest('.lp');
      if (lp) { const c = lp.dataset.c; if (linked.has(c)) linked.delete(c); else linked.add(c); lp.classList.toggle('on', linked.has(c)); lp.setAttribute('aria-pressed', String(linked.has(c))); return; }
      const b = ev.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'cancel') done();
      else if (b.dataset.x === 'del') {
        close();
        withUndo(`Deleted “${ex.name}”. Its hours are kept under No job.`, () => {
          state.entries.forEach(e => { if (e.jobId === ex.id) e.jobId = null; });
          state.categories.forEach(c => { if (c.jobId === ex.id) delete c.jobId; c.lists.forEach(l => l.cards.forEach(k => { if (k.jobId === ex.id) delete k.jobId; })); });
          state.wtasks = state.wtasks.filter(w => w.jobId !== ex.id);
          state.jobs.splice(state.jobs.indexOf(ex), 1);
          if (state.settings.workJob === ex.id) state.settings.workJob = state.jobs[0] ? state.jobs[0].id : null;
        });
        if (back) back();
      }
    });
    inner.querySelector('form').addEventListener('submit', ev => {
      ev.preventDefault();
      const name = $('#job-name', inner).value.trim();
      if (!name) { $('#job-msg', inner).textContent = 'Give the job a name.'; $('#job-name', inner).focus(); return; }
      j.name = name;
      j.rate = Math.max(0, Number($('#job-rate', inner).value) || 0);
      j.currency = $('#job-cur', inner).value.trim().toUpperCase();
      if (ex) Object.assign(ex, j); else state.jobs.push(j);
      if (!jobById(state.settings.workJob)) state.settings.workJob = j.id;
      state.categories.forEach(c => { if (linked.has(c.id)) c.jobId = j.id; else if (c.jobId === j.id) delete c.jobId; });
      commit(); toast(ex ? 'Job saved' : `Added ${j.name}`);
      done();
    });
    if (!ex) $('#job-name', inner).focus({preventScroll: true});
  }, {cls: 'compact'});
}

        + (o.period === 'custom' ? `<div class="fld"><label for="ex-from">From</label><input id="ex-from" type="date" class="field" value="${esc(o.from)}"></div><div class="fld"><label for="ex-to">To</label><input id="ex-to" type="date" class="field" value="${esc(o.to)}"></div>` : '')
        + `<div class="fld full"><span class="lbl">Format</span><div class="chips"><button type="button" class="fchip${o.fmt === 'xlsx' ? ' on' : ''}" data-x="fmt" data-k="xlsx">Excel (.xlsx)</button><button type="button" class="fchip${o.fmt === 'csv' ? ' on' : ''}" data-x="fmt" data-k="csv">CSV</button></div></div>`
        + `</div><p class="sheet-hint">${list.length} ${list.length === 1 ? 'entry' : 'entries'} · ${fmtHM(total)} · ${fmtDate(f, true)} – ${fmtDate(t - 1, true)}.<br>`
        + (o.fmt === 'xlsx' ? 'Summary: hours and earnings per task. Details: every entry grouped by day. The job and dates go in each sheet’s title.' : 'CSV holds the detailed list only, with the job and dates in the first line. Choose Excel for the per-task summary.') + `</p>`
        + `<div class="sheet-actions"><button type="button" class="btn" data-x="cancel">Cancel</button><button type="button" class="btn primary" data-x="go"${list.length ? '' : ' disabled'}>${icon('download')}Export</button></div>`;

      else if (t.id === 'ex-to') o.to = t.value;

let excelPromise = null;
function loadExcel() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (excelPromise) return excelPromise;
  excelPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = EXCELJS_URL; s.async = true;
    const fail = () => { excelPromise = null; s.remove(); rej(new Error('The spreadsheet tool couldn’t load. Check your connection, or export as CSV.')); };
    const timer = setTimeout(fail, 25000);
    s.onload = () => { clearTimeout(timer); window.ExcelJS ? res(window.ExcelJS) : fail(); };
    s.onerror = () => { clearTimeout(timer); fail(); };
    document.head.appendChild(s);
  });
  return excelPromise;
}
/* time of day as an Excel fraction, so cells format as hh:mm */
const xlTime = ts => { const d = new Date(ts); return (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400; };

async function exportHours({job, from, to, fmt}) {
  const list = exportList(job, from, to);
  if (!list.length) { toast('Nothing to export in this period'); return; }
  const now = Date.now();
  const period = `${fmtDate(from, true)} – ${fmtDate(to - 1, true)}`;
  const groups = [];
  for (const j of [...state.jobs, null]) {
    const es = list.filter(e => (e.jobId || null) === (j ? j.id : null)).sort((a, b) => a.start - b.start);
    if (es.length) groups.push({name: j ? j.name : 'No job', rate: j ? j.rate : 0, cur: j ? j.currency : '', entries: es});
  }
  const single = groups.length === 1, anyRate = groups.some(g => g.rate);
  const sel = jobById(job);
  const slug = (sel ? sel.name : job === 'none' ? 'no-job' : 'all-jobs').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'hours';
  const base = `hours-${slug}-${dayKey(from)}-to-${dayKey(to - 1)}`;
  const hrs = e => ((e.end ?? now) - e.start) / 36e5;
  const weekday = ts => new Date(ts).toLocaleDateString(undefined, {weekday: 'short'});
  const title = single ? groups[0].name : 'All jobs';

  if (fmt === 'csv') {
    const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = (single ? [] : ['Job']).concat(['Date', 'Day', 'Task', 'Start', 'End', 'Hours'], anyRate ? ['Amount', 'Currency'] : [], ['Note']);
    const lines = [q(`${title} · ${period}`), '', head.map(q).join(',')];
    groups.forEach(g => g.entries.forEach(e => {
      const h = hrs(e);
      lines.push((single ? [] : [g.name]).concat([e.undated ? 'no date' : dayKey(e.start), e.undated ? '' : weekday(e.start), entryLabel(e), e.undated ? '' : hhmm(e.start), e.undated ? '' : e.end == null ? 'running' : hhmm(e.end), h.toFixed(2)],
        anyRate ? [g.rate ? (h * g.rate).toFixed(2) : '', g.rate ? g.cur : ''] : [], [e.note || '']).map(q).join(','));
    }));
    downloadBlob(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), base + '.csv');
    toast(`Exported ${list.length} entries`);
    return;
  }

  let E;
  toast('Preparing spreadsheet…');
  try { E = await loadExcel(); }
  catch (err) { toast(err.message, {action: 'Export CSV', onAction: () => exportHours({job, from, to, fmt: 'csv'})}); return; }

  const C = {ink: 'FF16181D', muted: 'FF687080', head: 'FF2F45C8', headInk: 'FFFFFFFF', band: 'FFF4F5F8', section: 'FFE7EAF5', line: 'FFDCDFE5'};
  const fill = argb => ({type: 'pattern', pattern: 'solid', fgColor: {argb}});
  const moneyFmt = cur => cur ? `#,##0.00 "${cur.replace(/"/g, '')}"` : '#,##0.00';
  const exported = `Exported ${fmtDate(now, true)}`;
  const wb = new E.Workbook();
  wb.creator = 'Docket'; wb.created = new Date(now);
  const sheetOpts = {views: [{showGridLines: false}], pageSetup: {orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0}};
  const titleBlock = (ws, text, sub, cols) => {
    ws.mergeCells(1, 1, 1, cols);
    const t = ws.getCell(1, 1); t.value = text; t.font = {size: 16, bold: true, color: {argb: C.ink}};
    ws.getRow(1).height = 26;
    ws.mergeCells(2, 1, 2, cols);
    const s2 = ws.getCell(2, 1); s2.value = sub; s2.font = {size: 10, color: {argb: C.muted}};
    ws.getRow(3).height = 8;
  };
  const header = (ws, rowNo, values) => {
    const r = ws.getRow(rowNo); r.values = values; r.height = 20;
    r.eachCell(c => { c.font = {bold: true, color: {argb: C.headInk}}; c.fill = fill(C.head); c.alignment = {vertical: 'middle', horizontal: ['Hours', 'Share', 'Amount', 'Start', 'End'].includes(c.value) ? 'right' : 'left'}; });
    return r;
  };
  const section = (ws, rowNo, text, cols) => {
    ws.mergeCells(rowNo, 1, rowNo, cols);
    const c = ws.getCell(rowNo, 1); c.value = text; c.font = {bold: true, size: 12, color: {argb: C.ink}}; c.fill = fill(C.section);
    ws.getRow(rowNo).height = 20;
  };
  const totalStyle = (r, cols) => { for (let i = 1; i <= cols; i++) { const c = r.getCell(i); c.font = {bold: true}; c.border = {top: {style: 'thin', color: {argb: C.ink}}}; } };
  const lineStyle = (r, cols, banded) => { for (let i = 1; i <= cols; i++) { const c = r.getCell(i); c.border = {bottom: {style: 'hair', color: {argb: C.line}}}; if (banded) c.fill = fill(C.band); } };

  /* ---- Summary: hours per task, one table per job ---- */
  const sCols = anyRate ? 4 : 3;
  const sum = wb.addWorksheet('Summary', sheetOpts);
  sum.columns = [{width: 46}, {width: 11}, {width: 10}, {width: 17}].slice(0, sCols);
  titleBlock(sum, `${title} · hours by task`, `${period} · ${exported}`, sCols);
  let row = 4;
  const jobTotals = [];
  for (const g of groups) {
    if (!single) { section(sum, row, g.name, sCols); row++; }
    header(sum, row, ['Task', 'Hours', 'Share'].concat(anyRate ? ['Amount'] : [])); row++;
    const tasks = new Map();
    g.entries.forEach(e => { const k = taskKey(e); const t = tasks.get(k) || {name: entryLabel(e), h: 0}; t.h += hrs(e); tasks.set(k, t); });
    const sorted = [...tasks.values()].sort((a, b) => b.h - a.h);
    const gTotal = sorted.reduce((s, t) => s + t.h, 0);
    const first = row, last = row + sorted.length - 1, totalRowNo = last + 1;
    sorted.forEach((t, i) => {
      const r = sum.getRow(row);
      r.getCell(1).value = t.name;
      r.getCell(2).value = Number(t.h.toFixed(4)); r.getCell(2).numFmt = '0.00';
      r.getCell(3).value = {formula: `B${row}/B${totalRowNo}`, result: gTotal ? t.h / gTotal : 0}; r.getCell(3).numFmt = '0%';
      if (anyRate && g.rate) { r.getCell(4).value = {formula: `B${row}*${g.rate}`, result: t.h * g.rate}; r.getCell(4).numFmt = moneyFmt(g.cur); }
      lineStyle(r, sCols, i % 2 === 1);
      row++;
    });
    const tr = sum.getRow(row);
    tr.getCell(1).value = 'Total';
    tr.getCell(2).value = {formula: `SUM(B${first}:B${last})`, result: gTotal}; tr.getCell(2).numFmt = '0.00';
    if (anyRate && g.rate) { tr.getCell(4).value = {formula: `SUM(D${first}:D${last})`, result: gTotal * g.rate}; tr.getCell(4).numFmt = moneyFmt(g.cur); }
    totalStyle(tr, sCols);
    jobTotals.push({g, row, h: gTotal});
    row += 2;
  }
  if (!single) {
    section(sum, row, 'All jobs', sCols); row++;
    header(sum, row, ['Job', 'Hours', 'Share'].concat(anyRate ? ['Amount'] : [])); row++;
    const all = jobTotals.reduce((s, x) => s + x.h, 0), first = row, last = row + jobTotals.length - 1;
    jobTotals.forEach((x, i) => {
      const r = sum.getRow(row);
      r.getCell(1).value = x.g.name;
      r.getCell(2).value = {formula: `B${x.row}`, result: x.h}; r.getCell(2).numFmt = '0.00';
      r.getCell(3).value = {formula: `B${row}/B${last + 1}`, result: all ? x.h / all : 0}; r.getCell(3).numFmt = '0%';
      if (anyRate && x.g.rate) { r.getCell(4).value = {formula: `D${x.row}`, result: x.h * x.g.rate}; r.getCell(4).numFmt = moneyFmt(x.g.cur); }
      lineStyle(r, sCols, i % 2 === 1);
      row++;
    });
    const tr = sum.getRow(row);
    tr.getCell(1).value = 'Total';
    tr.getCell(2).value = {formula: `SUM(B${first}:B${last})`, result: all}; tr.getCell(2).numFmt = '0.00';
    const curs = [...new Set(groups.filter(g => g.rate).map(g => g.cur))];
    if (anyRate && curs.length === 1) { tr.getCell(4).value = {formula: `SUM(D${first}:D${last})`, result: groups.reduce((s, g) => s + (g.rate ? g.entries.reduce((a, e) => a + hrs(e), 0) * g.rate : 0), 0)}; tr.getCell(4).numFmt = moneyFmt(curs[0]); }
    totalStyle(tr, sCols);
  }

  /* ---- Details: every entry, grouped by day (one sheet per job) ---- */
  const used = new Set(['Summary']);
  const sheetName = n => { let b = n.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31).trim() || 'Details', s = b, i = 2; while (used.has(s.toLowerCase())) s = b.slice(0, 28) + ' ' + i++; used.add(s.toLowerCase()); return s; };
  for (const g of groups) {
    const rate = g.rate, cols = rate ? 6 : 5;
    const ws = wb.addWorksheet(sheetName(single ? 'Details' : `${g.name} details`), {...sheetOpts, views: [{showGridLines: false, state: 'frozen', ySplit: 4}]});
    ws.columns = [{width: 42}, {width: 9}, {width: 9}, {width: 10}].concat(rate ? [{width: 16}] : [], [{width: 34}]);
    titleBlock(ws, `${g.name} · ${period}`, `Every entry, grouped by day · ${exported}`, cols);
    header(ws, 4, ['Task', 'Start', 'End', 'Hours'].concat(rate ? ['Amount'] : [], ['Note']));
    let r = 5;
    for (const [k, es] of groupByDay(g.entries)) {
      section(ws, r, k === 'nodate' ? 'No specific date' : new Date(parseISO(k)).toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}), cols); r++;
      const first = r;
      es.forEach((e, i) => {
        const h = hrs(e), row2 = ws.getRow(r);
        row2.getCell(1).value = entryLabel(e);
        if (e.undated) { row2.getCell(2).value = '–'; row2.getCell(3).value = '–'; [2, 3].forEach(c => { row2.getCell(c).alignment = {horizontal: 'right'}; }); }
        else {
          row2.getCell(2).value = xlTime(e.start); row2.getCell(2).numFmt = 'hh:mm';
          if (e.end == null) row2.getCell(3).value = 'running'; else { row2.getCell(3).value = xlTime(e.end); row2.getCell(3).numFmt = 'hh:mm'; }
        }
        row2.getCell(4).value = Number(h.toFixed(4)); row2.getCell(4).numFmt = '0.00';
        if (rate) { row2.getCell(5).value = {formula: `D${r}*${rate}`, result: h * rate}; row2.getCell(5).numFmt = moneyFmt(g.cur); }
        row2.getCell(cols).value = e.note || null; row2.getCell(cols).alignment = {wrapText: true, vertical: 'top'};
        lineStyle(row2, cols, i % 2 === 1);
        r++;
      });
      const dt = ws.getRow(r), dh = es.reduce((s, e) => s + hrs(e), 0);
      dt.getCell(1).value = 'Day total';
      dt.getCell(4).value = {formula: `SUM(D${first}:D${r - 1})`, result: dh}; dt.getCell(4).numFmt = '0.00';
      if (rate) { dt.getCell(5).value = {formula: `SUM(E${first}:E${r - 1})`, result: dh * rate}; dt.getCell(5).numFmt = moneyFmt(g.cur); }
      for (let i = 1; i <= cols; i++) dt.getCell(i).font = {bold: true, color: {argb: C.muted}};
      r += 2;
    }
    const gt = ws.getRow(r), gh = g.entries.reduce((s, e) => s + hrs(e), 0);
    gt.getCell(1).value = 'Total';
    gt.getCell(4).value = {formula: `SUMIF(A5:A${r - 1},"Day total",D5:D${r - 1})`, result: gh}; gt.getCell(4).numFmt = '0.00';
    if (rate) { gt.getCell(5).value = {formula: `SUMIF(A5:A${r - 1},"Day total",E5:E${r - 1})`, result: gh * rate}; gt.getCell(5).numFmt = moneyFmt(g.cur); }
    totalStyle(gt, cols);
  }

  try {
    const buf = await wb.xlsx.writeBuffer();
    downloadBlob(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), base + '.xlsx');
    toast(`Exported ${list.length} entries to ${base}.xlsx`);
  } catch (err) {
    console.error(err);
    toast('The spreadsheet couldn’t be created. Try CSV instead.', {action: 'CSV', onAction: () => exportHours({job, from, to, fmt: 'csv'})});
  }
}

/* ================= tags ================= */
const allCards = fn => state.categories.forEach(c => c.lists.forEach(l => l.cards.forEach(fn)));
const sortedTags = ids => state.tags.filter(t => ids.includes(t.id));
const tagLabel = t => t.name || TAG_COLOR_NAME[t.color];
function tagGroups() {
  const gs = [...new Set(state.tags.map(t => t.group))];
  return [...TAG_GROUP_ORDER.filter(g => gs.includes(g)), ...gs.filter(g => !TAG_GROUP_ORDER.includes(g))];
}
function cardsWithTag(id) { let n = 0; allCards(k => { if (k.tags.includes(id)) n++; }); return n; }

function openTagPicker(cardId, back) {
  let q = '';
  openSheet((inner, close) => {
    inner.innerHTML = `<div class="sheet-drag"><h2 class="sheet-title">Tags <span class="mono muted tp-count"></span></h2></div>`
      + `<input id="tag-q" class="field" placeholder="Search, or type a new tag and press Enter" autocomplete="off" enterkeyhint="done" aria-label="Search tags">`
      + `<div class="tp-body"></div>`
      + `<div class="sheet-actions"><button type="button" class="btn" data-x="manage">Manage tags</button><span class="grow"></span><button type="button" class="btn primary" data-x="done">Done</button></div>`;
    const tagPick = (t, sel) => `<button type="button" class="lp${sel.has(t.id) ? ' on' : ''}" data-tag="${t.id}" style="--c:var(--l-${t.color})" aria-pressed="${sel.has(t.id)}"><i></i><span>${esc(tagLabel(t))}</span></button>`;
    const draw = () => {
      const f = findCard(cardId); if (!f) { close(); return; }
      const sel = new Set(f.card.tags), ql = q.trim().toLowerCase();
      let mostUsedHTML = '';
      if (!ql) {
        const usage = new Map();
        allCards(k => k.tags.forEach(id => usage.set(id, (usage.get(id) || 0) + 1)));
        const mostUsed = state.tags.filter(t => usage.get(t.id) > 0).sort((a, b) => usage.get(b.id) - usage.get(a.id)).slice(0, 8);
        if (mostUsed.length) mostUsedHTML = `<div class="tg">Most used</div><div class="label-pick">` + mostUsed.map(t => tagPick(t, sel)).join('') + `</div>`;
      }
      const body = tagGroups().map(g => {
        const ts = state.tags.filter(t => t.group === g && (!ql || tagLabel(t).toLowerCase().includes(ql)));
        return ts.length ? `<div class="tg">${esc(g)}</div><div class="label-pick">` + ts.map(t => tagPick(t, sel)).join('') + `</div>` : '';
      }).join('');
      $('.tp-body', inner).innerHTML = (mostUsedHTML + body) || (ql ? `<p class="empty sm">No tag called “${esc(q.trim())}”. <button type="button" class="link" data-x="create">Create it</button></p>` : '<p class="empty sm">No tags yet.</p>');
      $('.tp-count', inner).textContent = sel.size ? `${sel.size} selected` : '';
    };
    const createFromQuery = () => {
      const name = q.trim(); if (!name) return;
      let t = state.tags.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (!t) { t = {id: uid(), name, color: TAG_COLORS[state.tags.length % TAG_COLORS.length], group: 'Your labels'}; state.tags.push(t); }
      const f = findCard(cardId); if (f && !f.card.tags.includes(t.id)) f.card.tags.push(t.id);
      q = ''; $('#tag-q', inner).value = '';
      haptic('select'); save(); scheduleRender(); draw();
    };
    draw();
    inner.addEventListener('input', e => { if (e.target.id === 'tag-q') { q = e.target.value; draw(); } });
    inner.addEventListener('keydown', e => { if (e.target.id === 'tag-q' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); createFromQuery(); } });
    inner.addEventListener('click', e => {
      const b = e.target.closest('[data-tag]');
      if (b) {
        const f = findCard(cardId); if (!f) return;
        const i = f.card.tags.indexOf(b.dataset.tag);
        if (i > -1) f.card.tags.splice(i, 1); else f.card.tags.push(b.dataset.tag);
        haptic('select'); save(); scheduleRender(); draw();
        return;
      }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'done') { close(); if (back) back(); }
      else if (x.dataset.x === 'manage') openTagManager(() => openTagPicker(cardId, back));
      else if (x.dataset.x === 'create') createFromQuery();
    });
  }, {cls: 'tall'});
}

function openTagManager(back) {
  openSheet((inner, close) => {
    inner.innerHTML = `<h2 class="sheet-title sheet-drag">Tags</h2><p class="sheet-text">Tags work in every category. Tap one to rename it, change its color or move it to another group.</p>`
      + tagGroups().map(g => `<div class="tg">${esc(g)}</div>` + state.tags.filter(t => t.group === g).map(t => {
        const n = cardsWithTag(t.id);
        return `<button type="button" class="tag-row" data-tag="${t.id}" style="--c:var(--l-${t.color})"><i class="${t.name ? '' : 'bar'}"></i>`
          + `<span class="grow">${esc(t.name || TAG_COLOR_NAME[t.color] + ' (color only)')}</span><span class="mono muted">${n ? n + (n === 1 ? ' card' : ' cards') : ''}</span></button>`;
      }).join('')).join('')
      + `<div class="sheet-actions"><button type="button" class="btn primary" data-x="add">${icon('plus')}New tag</button>${back ? '<span class="grow"></span><button type="button" class="btn" data-x="back">Done</button>' : ''}</div>`;
    inner.addEventListener('click', e => {
      const t = e.target.closest('[data-tag]');
      if (t) { openTagEditor(t.dataset.tag, () => openTagManager(back)); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'add') openTagEditor(null, () => openTagManager(back));
      else if (x.dataset.x === 'back') { close(); back(); }
    });
  }, {cls: 'tall'});
}

function openTagEditor(id, back) {
  const ex = id ? state.tags.find(t => t.id === id) : null;
  const t = ex ? {...ex} : {id: uid(), name: '', color: 'ultra', group: 'Your labels'};
  const groups = tagGroups(); if (!groups.includes(t.group)) groups.push(t.group);
  openSheet((inner, close) => {
    inner.innerHTML = `<form novalidate><h2 class="sheet-title sheet-drag">${ex ? 'Edit tag' : 'New tag'}</h2><div class="form-grid">`
      + `<div class="fld full"><label for="tg-name">Name</label><input id="tg-name" class="field" value="${esc(t.name)}" maxlength="28" placeholder="Leave empty for a color-only mark" autocomplete="off"></div>`
      + `<div class="fld full"><span class="lbl">Color</span><div class="menu-swatches flat" role="group" aria-label="Color">${TAG_COLORS.map(k => `<button type="button" class="swatch${k === t.color ? ' on' : ''}" data-k="${k}" style="--c:var(--l-${k})" aria-label="${TAG_COLOR_NAME[k]}" aria-pressed="${k === t.color}"></button>`).join('')}</div></div>`
      + `<div class="fld full"><label for="tg-group">Group</label><span class="select-wrap block"><select id="tg-group" class="select">${groups.map(g => `<option${g === t.group ? ' selected' : ''}>${esc(g)}</option>`).join('')}<option value="__new">New group…</option></select></span></div>`
      + `<div class="fld full" id="tg-new-wrap" hidden><label for="tg-new">New group name</label><input id="tg-new" class="field" maxlength="24" autocomplete="off"></div>`
      + `</div><p class="sheet-hint" id="tg-msg" aria-live="polite"></p>`
      + `<div class="sheet-actions">${ex ? `<button type="button" class="btn danger" data-x="del">${icon('trash')}Delete</button>` : ''}<span class="grow"></span><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
    const done = () => { close(); if (back) back(); };
    inner.addEventListener('change', e => { if (e.target.id === 'tg-group') $('#tg-new-wrap', inner).hidden = e.target.value !== '__new'; });
    inner.addEventListener('click', e => {
      const sw = e.target.closest('.swatch');
      if (sw) { t.color = sw.dataset.k; $$('.swatch', inner).forEach(s => { s.classList.toggle('on', s === sw); s.setAttribute('aria-pressed', String(s === sw)); }); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'cancel') done();
      else if (x.dataset.x === 'del') {
        close();
        withUndo(`Deleted tag “${tagLabel(ex)}”`, () => { state.tags.splice(state.tags.indexOf(ex), 1); allCards(k => { k.tags = k.tags.filter(i => i !== ex.id); }); });
        if (back) back();
      }
    });
    inner.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const gsel = $('#tg-group', inner).value;
      const group = (gsel === '__new' ? $('#tg-new', inner).value : gsel).trim();
      if (!group) { $('#tg-msg', inner).textContent = 'Name the new group.'; return; }
      t.name = $('#tg-name', inner).value.replace(/\s+/g, ' ').trim(); t.group = group;
      if (ex) Object.assign(ex, t); else state.tags.push(t);
      commit(); toast(ex ? 'Tag saved' : 'Tag added');
      done();
    });
  }, {cls: 'compact'});
}

/* ================= general notes (a list of free-text notes, not tied to a card) ================= */
function openNotesSheet() {
  openSheet((inner, close) => {
    const draw = () => {
      const st = inner.scrollTop;
      inner.innerHTML = `<h2 class="sheet-title sheet-drag">Notes</h2>`
        + `<p class="sheet-text">Anything you want to jot down — not tied to a card.</p>`
        + `<div class="note-list">` + state.notes.map(n => `<div class="note-item" data-note="${n.id}">`
          + `<textarea class="field area sm" data-note-text="${n.id}" rows="2" placeholder="Start typing…" aria-label="Note">${esc(n.text)}</textarea>`
          + `<button type="button" class="icon-btn sm" data-x="del-note" data-note="${n.id}" aria-label="Delete note">${icon('x')}</button></div>`).join('')
        + `</div>` + (state.notes.length ? '' : `<p class="empty sm">No notes yet.</p>`)
        + `<div class="sheet-actions"><button type="button" class="btn" data-x="add-note">${icon('plus')}Add note</button><span class="grow"></span><button type="button" class="btn primary" data-x="done">Done</button></div>`;
      $$('.note-item textarea', inner).forEach(autosize);
      inner.scrollTop = st;
    };
    draw();
    inner.addEventListener('input', e => {
      if (e.target.dataset.noteText) {
        const n = state.notes.find(x => x.id === e.target.dataset.noteText);
        if (n) { n.text = e.target.value; autosize(e.target); save(); }
      }
    });
    inner.addEventListener('click', e => {
      if (e.target.closest('[data-x="done"]')) { close(); return; }
      if (e.target.closest('[data-x="add-note"]')) {
        state.notes.unshift({id: uid(), text: '', created: Date.now()});
        save(); draw();
        const ta = $(`[data-note-text="${state.notes[0].id}"]`, inner); if (ta) ta.focus();
        return;
      }
      const del = e.target.closest('[data-x="del-note"]');
      if (del) { state.notes = state.notes.filter(n => n.id !== del.dataset.note); save(); draw(); }
    });
    inner.addEventListener('focusout', e => {
      if (!e.target.dataset.noteText) return;
      const n = state.notes.find(x => x.id === e.target.dataset.noteText);
      if (n && !n.text.trim()) { state.notes = state.notes.filter(x => x !== n); save(); setTimeout(() => { if (sheet && sheet.el.contains(inner)) draw(); }); }
    });
  }, {cls: 'tall'});
}

/* ================= calendar: due cards + events ================= */
const REMINDS = [[-1, 'No reminder'], [0, 'At the start'], [5, '5 minutes before'], [10, '10 minutes before'], [30, '30 minutes before'], [60, '1 hour before'], [1440, '1 day before']];
function occursOn(ev, key) {
  if (ev.repeat === 'none') return key >= ev.date && key <= (ev.endDate || ev.date);
  return repeatHits(ev.repeat, ev.date, key, ev.until);
}
/* everything on one day: events and cards due that day, all-day items first */
function itemsOn(key) {
  const out = [];
  state.events.forEach(ev => { if (occursOn(ev, key)) out.push({kind: 'event', id: ev.id, title: ev.title, allDay: ev.allDay, time: ev.allDay ? '' : ev.start, end: ev.allDay ? '' : ev.end, color: `var(--l-${ev.color})`, done: false, sub: ev.repeat !== 'none' ? REPEATS.find(r => r[0] === ev.repeat)[1] + (ev.until ? ` until ${fmtDate(parseISO(ev.until))}` : '') : ev.endDate ? `Until ${fmtDate(parseISO(ev.endDate))}` : ''}); });
  state.categories.forEach(c => c.lists.forEach(l => l.cards.forEach(k => {
    if (k.due === key) out.push({kind: 'card', id: k.id, title: k.title, allDay: !k.dueTime, time: k.dueTime, end: '', color: `var(--l-${c.color})`, done: k.done, prio: k.priority, sub: `${c.name} · ${l.title}${k.repeat !== 'none' ? ' · ↻ ' + repeatName(k.repeat) : ''}`});
    else if (!k.done && k.due && k.repeat !== 'none' && key > k.due && repeatHits(k.repeat, k.due, key)) out.push({kind: 'card', id: k.id, title: k.title, allDay: !k.dueTime, time: k.dueTime, end: '', color: `var(--l-${c.color})`, done: false, ghost: true, prio: k.priority, sub: `Repeats ${repeatName(k.repeat)} · ${c.name}`});
  })));
  return out.sort((a, b) => (b.allDay - a.allDay) || a.time.localeCompare(b.time) || (a.done - b.done));
}
const monthKey = ts => dayKey(ts).slice(0, 7);
function calendarHTML() {
  const [y, m] = ui.cal.month.split('-').map(Number), first = new Date(y, m - 1, 1), today = isoDay(0);
  const startOffset = (first.getDay() + 6) % 7, gridStart = new Date(y, m - 1, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i), key = dayKey(d.getTime());
    const items = itemsOn(key), inMonth = d.getMonth() === m - 1;
    cells.push(`<button type="button" class="cal-day${inMonth ? '' : ' out'}${key === today ? ' today' : ''}${key === ui.cal.day ? ' sel' : ''}" data-day="${key}" aria-label="${fmtDay(key)}, ${items.length} items">`
      + `<span class="cal-num">${d.getDate()}</span><span class="cal-items">`
      + items.slice(0, 3).map(it => `<i class="${it.done || it.ghost ? 'done' : ''}${it.kind === 'event' ? ' ev' : ''}" style="--c:${it.color}">${esc(it.title)}</i>`).join('')
      + (items.length > 3 ? `<b>+${items.length - 3}</b>` : '') + `</span></button>`);
    if (i === 34 && new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + 35).getMonth() !== m - 1) break;
  }
  const dayItems = itemsOn(ui.cal.day);
  const weekdays = Array.from({length: 7}, (_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(undefined, {weekday: 'short'}));
  return `<div class="cal-head sheet-drag"><button type="button" class="icon-btn" data-c="prev" aria-label="Previous month">${icon('arrowL')}</button>`

    + (dayItems.length ? dayItems.map(it => `<div class="cal-row${it.done ? ' done' : ''}${it.ghost ? ' ghost' : ''}">`

        + `<button type="button" class="cal-open" data-c="open" data-kind="${it.kind}" data-id="${it.id}"><span class="cal-time">${it.allDay ? 'All day' : esc(it.time) + (it.end ? '–' + esc(it.end) : '')}</span>`
        + `<span class="t"><b>${esc(it.title)}</b><small>${it.kind === 'card' ? `<span class="tab-dot" style="--c:${it.color}"></span>` : ''}${esc(it.sub || (it.kind === 'event' ? 'Event' : ''))}${it.prio ? ` · ${PRIORITY[it.prio].name}` : ''}</small></span></button></div>`).join('')

function openCalendar(day) {
  ui.cal = ui.cal || {};
  ui.cal.day = day || ui.cal.day || isoDay(0);
  ui.cal.month = ui.cal.day.slice(0, 7);
  openSheet((inner, close) => {
    const draw = () => {
      const st = inner.scrollTop; inner.innerHTML = calendarHTML();
      if (wide.matches) {
        const grid = $('.cal-grid', inner), side = document.createElement('div'), wrap = document.createElement('div');
        side.className = 'cal-side'; wrap.className = 'cal-wrap';
        let n = $('.cal-dayhead', inner); while (n) { const next = n.nextSibling; side.appendChild(n); n = next; }
        grid.before(wrap); wrap.append(grid, side);
      }
      inner.scrollTop = st;
    };
    const back = () => openCalendar(ui.cal.day);
    draw();
    inner.addEventListener('click', e => {
      const dayBtn = e.target.closest('[data-day]');
      if (dayBtn) { ui.cal.day = dayBtn.dataset.day; if (ui.cal.day.slice(0, 7) !== ui.cal.month) ui.cal.month = ui.cal.day.slice(0, 7); haptic('select'); draw(); return; }
      const b = e.target.closest('[data-c]'); if (!b) return;
      const [y, m] = ui.cal.month.split('-').map(Number);
      switch (b.dataset.c) {
        case 'prev': case 'next': { const d = new Date(y, m - 1 + (b.dataset.c === 'next' ? 1 : -1), 1); ui.cal.month = monthKey(d.getTime()); ui.cal.day = ui.cal.month + '-01'; draw(); return; }
        case 'today': ui.cal.day = isoDay(0); ui.cal.month = ui.cal.day.slice(0, 7); draw(); return;
        case 'add-event': openEventEditor(null, {date: ui.cal.day, back}); return;
        case 'add-task': openCalTaskSheet(ui.cal.day, back); return;
        case 'ai': close(); openAssistant({ctx: {kind: 'day', id: ui.cal.day}}); return;
        case 'toggle': { const f = findCard(b.dataset.id); if (f) { const moved = setDone(f.card, !f.card.done); commit(); if (moved) toast(moved); draw(); } return; }
        case 'open': if (b.dataset.kind === 'card') { close(); openCard(b.dataset.id); } else openEventEditor(b.dataset.id, {back}); return;
      }
    });
  }, {cls: 'tall cal'});
}

const AI_PROVIDERS = {
  openrouter: {name: 'OpenRouter', url: 'https://openrouter.ai/api/v1', model: 'google/gemini-3.8-flash', keyHint: 'sk-or-…', keyUrl: 'https://openrouter.ai/keys',

    recommended: ['gemini-3.8-flash', 'gemini-3.7-flash']}

/* keys, chosen models and custom instructions stay on this device ("docket.ai"); each provider keeps its own key and model */
const AI = {provider: 'openrouter', keys: {}, models: {}, custom: '', busy: false};
const aiChat = {messages: [], log: [], undo: null, ctx: null};
let aiModelCache = {};
function aiLoad() {
  try {
    const c = JSON.parse(localStorage.getItem('docket.ai') || '{}');
    AI.provider = AI_PROVIDERS[c.provider] ? c.provider : 'openrouter';
    AI.keys = c.keys && typeof c.keys === 'object' ? c.keys : {};
    AI.models = c.models && typeof c.models === 'object' ? c.models : {};
    AI.custom = String(c.custom || '');
    /* older single-key format */
    if (c.key && !AI.keys[AI.provider]) AI.keys[AI.provider] = c.key;
    if (c.model && typeof c.model === 'string' && !AI.models[AI.provider]) AI.models[AI.provider] = c.model;
  } catch (e) {}
  try { aiModelCache = JSON.parse(localStorage.getItem('docket.aimodels') || '{}') || {}; } catch (e) { aiModelCache = {}; }
  try { const c = JSON.parse(localStorage.getItem('docket.aichat') || 'null'); if (c && Array.isArray(c.messages)) { aiChat.messages = c.messages; aiChat.log = c.log || []; } } catch (e) {}
}
function aiSave() { try { localStorage.setItem('docket.ai', JSON.stringify({provider: AI.provider, keys: AI.keys, models: AI.models, custom: AI.custom})); } catch (e) {} }
function aiSaveChat() { try { localStorage.setItem('docket.aichat', JSON.stringify({messages: aiChat.messages.slice(-40), log: aiChat.log.slice(-60)})); } catch (e) {} }
const aiKey = (prov = AI.provider) => AI.keys[prov] || '';
const aiReady = () => !!aiKey();
const aiModel = () => AI.models[AI.provider] || AI_PROVIDERS[AI.provider].model;
/* the provider's live model list (only models that can use tools), cached for a day */
async function aiFetchModels(prov, force) {
  const cached = aiModelCache[prov];
  if (!force && cached && Date.now() - cached.at < 864e5 && cached.items.length) return cached.items;
  const p = AI_PROVIDERS[prov], key = aiKey(prov);
  if (prov === 'gemini' && !key) return [];
  const res = await fetch(`${p.url}/models`, {headers: key ? {Authorization: `Bearer ${key}`} : {}});
  if (!res.ok) throw new Error(res.status === 400 || res.status === 401 || res.status === 403 ? 'the key was rejected' : 'error ' + res.status);
  const d = await res.json();
  const items = (d.data || []).filter(m => prov !== 'openrouter' || (m.supported_parameters || []).includes('tools')).map(m => {
    const id = String(m.id).replace(/^models\//, '');
    const pin = m.pricing ? Number(m.pricing.prompt) * 1e6 : NaN, pout = m.pricing ? Number(m.pricing.completion) * 1e6 : NaN;
    return {id, name: m.name || id, free: m.pricing ? pin === 0 && pout === 0 : false, price: Number.isFinite(pin) ? (pin === 0 && pout === 0 ? 'free' : `$${+pin.toFixed(2)} / $${+pout.toFixed(2)} per M tokens`) : '', ctx: m.context_length || 0, created: m.created || 0};
  }).filter(m => prov !== 'gemini' || /gemini|gemma/i.test(m.id));
  aiModelCache[prov] = {at: Date.now(), items};
  try { localStorage.setItem('docket.aimodels', JSON.stringify(aiModelCache)); } catch (e) {}
  return items;
}

  el.className = 'ai-dock'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'AI assistant');
  el.innerHTML = '<div class="sheet-inner"></div>';
  document.body.appendChild(el);
  aiDock = el;
  $('#ai-fab').classList.add('hide');
  mountAssistant(el.firstChild, closeAiDock, true);
  requestAnimationFrame(() => el.classList.add('in'));
  const ta = $('#ai-input', el); if (ta) ta.focus({preventScroll: true});
}
function closeAiDock() {
  if (!aiDock) return;
  aiDock.remove(); aiDock = null;
  $('#ai-fab').classList.remove('hide');
}
function mountAssistant(inner, close, docked) {
  {
    const draw = () => {
      const keepEl = docked ? $('#ai-input', inner.parentNode) : $('#ai-input', inner), keep = keepEl ? keepEl.value : '';
      if (docked) { const old = $(':scope > .ai-form', inner.parentNode); if (old) old.remove(); }
      const last = aiChat.log.length - 1;
      const ctx = aiChat.ctx;
      inner.innerHTML = `<div class="ai-top sheet-drag"><b>${icon('sparkle')}Assistant</b><small class="mono muted">${aiReady() ? esc(aiModel()) : ''}</small><span class="grow"></span>`
        + (aiChat.log.length ? `<button type="button" class="btn sm" data-x="clear">New chat</button>` : '') + `<button type="button" class="icon-btn" data-x="settings" aria-label="Assistant settings">${icon('dotsV')}</button>`
        + (docked ? `<button type="button" class="icon-btn" data-x="close" aria-label="Close assistant">${icon('x')}</button>` : '') + `</div>`
        + (ctx ? `<div class="ai-ctx"><span>${icon(ctx.kind === 'event' || ctx.kind === 'day' ? 'cal' : 'checklist')}Working on <b>${esc(aiCtxTitle(ctx))}</b></span><button type="button" class="link" data-x="ctx-open">Open</button><button type="button" class="icon-btn sm" data-x="ctx-clear" aria-label="Stop focusing on it">${icon('x')}</button></div>` : '')
        + (!aiReady() ? `<div class="ai-empty"><p class="sheet-text">Connect an AI model to create tasks, write notes and checklists, plan your week and set reminders by just asking.</p><button type="button" class="btn primary" data-x="settings">Set up the assistant</button></div>`
          : `<div class="ai-log" id="ai-log">` + (aiChat.log.length ? aiChat.log.map((m, i) =>
              m.who === 'user' ? `<div class="ai-msg me">${aiFormat(m.text)}</div>`
              : m.who === 'act' ? `<div class="ai-act">${icon('check')}${esc(m.text)}</div>`
              : m.who === 'err' ? `<div class="ai-msg err">${esc(m.text)}</div>`
              : `<div class="ai-msg">${aiFormat(m.text)}${m.undo && i === last && aiChat.undo ? `<div><button type="button" class="link" data-x="undo">Undo these changes</button></div>` : ''}</div>`).join('')
            : `<div class="ai-empty"><p class="sheet-hint">Try:</p>` + (ctx ? AI_CTX_SUGGEST[ctx.kind] : ['Add “Buy cables” to Work for Friday, high priority', 'Write a checklist for the magnets task', 'Remind me tomorrow at 9:00 to call the supplier', 'What is due this week?', 'Add a dentist appointment on Thursday at 14:00 with a reminder 1 hour before'])
                .map(sg => `<button type="button" class="fchip ai-sg" data-sg="${esc(sg)}">${esc(sg)}</button>`).join('') + `</div>`)
            + (AI.busy ? `<div class="ai-msg typing"><i></i><i></i><i></i></div>` : '') + `</div>`
            + `<form class="ai-form" data-form="ai" novalidate><textarea id="ai-input" class="field" rows="1" placeholder="Ask or tell me what to do…" aria-label="Message the assistant"${AI.busy ? ' disabled' : ''}>${esc(keep)}</textarea>`
            + `<button type="submit" class="btn primary" aria-label="Send"${AI.busy ? ' disabled' : ''}>${icon('send')}</button></form>`);
      const log = $('#ai-log', inner); if (log) inner.scrollTop = inner.scrollHeight;
      if (docked) { const f = $('.ai-form', inner); if (f) inner.parentNode.appendChild(f); else { const old = $('.ai-dock > .ai-form'); if (old) old.remove(); } }
      autosize($('#ai-input', docked ? inner.parentNode : inner));
    };
    draw();
    const root = docked ? inner.parentNode : inner;
    const send = () => { const ta = $('#ai-input', root); const v = ta ? ta.value.trim() : ''; if (!v) return; ta.value = ''; aiSend(v, draw); };
    root.addEventListener('submit', e => { if (e.target.matches('[data-form="ai"]')) { e.preventDefault(); send(); } });
    root.addEventListener('keydown', e => { if (e.target.id === 'ai-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && wide.matches) { e.preventDefault(); send(); } });
    root.addEventListener('input', e => { if (e.target.id === 'ai-input') autosize(e.target); });
    root.addEventListener('click', e => {
      const sg = e.target.closest('[data-sg]'); if (sg) { const ta = $('#ai-input', root); ta.value = sg.dataset.sg; ta.focus(); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'settings') { if (docked) close(); openAISettings(() => openAssistant({keep: true})); }
      else if (x.dataset.x === 'close') close();
      else if (x.dataset.x === 'ctx-open') { const c = aiChat.ctx; if (docked) aiOpenCtx(c); else { aiChat.ctx = null; close(); aiOpenCtx(c); } }
      else if (x.dataset.x === 'ctx-clear') { aiChat.ctx = null; draw(); }
      else if (x.dataset.x === 'clear') { aiChat.messages = []; aiChat.log = []; aiChat.undo = null; aiSaveChat(); draw(); }
      else if (x.dataset.x === 'undo' && aiChat.undo) { state = normalize(JSON.parse(aiChat.undo)); aiChat.undo = null; commit(); aiChat.log.push({who: 'act', text: 'Undid the last changes'}); aiChat.messages.push({role: 'user', content: '(I undid all the changes you made in your last answer.)'}); aiSaveChat(); draw(); }
    });
  }
}

function openAISettings(back) {
  let models = null, loadErr = '', filter = '';
  openSheet((inner, close) => {
    const modelSelectHTML = () => {
      const p = AI_PROVIDERS[AI.provider], cur = aiModel();
      const all = models || [], f = filter.trim().toLowerCase();
      const pick = all.filter(m => !f || m.id.toLowerCase().includes(f) || m.name.toLowerCase().includes(f));
      const opt = m => `<option value="${esc(m.id)}"${m.id === cur ? ' selected' : ''}>${esc(m.name)}${m.price ? ' · ' + esc(m.price) : ''}</option>`;
      const groups = [];
      const rec = p.recommended.map(id => pick.find(m => m.id === id)).filter(Boolean);
      if (rec.length) groups.push(['Recommended', rec]);
      const free = pick.filter(m => m.free && !p.recommended.includes(m.id));
      if (free.length) groups.push(['Free', free]);
      const rest = pick.filter(m => !m.free && !p.recommended.includes(m.id));
      const byVendor = new Map();
      rest.sort((a, b) => a.name.localeCompare(b.name)).forEach(m => { const v = AI.provider === 'openrouter' ? (m.name.split(':')[0] || m.id.split('/')[0]) : 'Gemini models'; if (!byVendor.has(v)) byVendor.set(v, []); byVendor.get(v).push(m); });
      [...byVendor].sort((a, b) => a[0].localeCompare(b[0])).forEach(g => groups.push(g));
      const inList = all.some(m => m.id === cur);
      return `<select id="ai-model" class="select">${!inList ? `<option value="${esc(cur)}" selected>${esc(cur)}${models ? ' (not in the list)' : ''}</option>` : ''}`
        + groups.map(([g, ms]) => `<optgroup label="${esc(g)}">${ms.map(opt).join('')}</optgroup>`).join('') + `</select>`;
    };
    const draw = () => {
      const p = AI_PROVIDERS[AI.provider];
      inner.innerHTML = `<form novalidate><h2 class="sheet-title sheet-drag">AI assistant</h2>`
        + `<p class="sheet-text">Use your own API keys. They are stored only on this device, each provider keeps its own key, and a key is only sent to its provider.</p><div class="form-grid">`
        + `<div class="fld full"><span class="lbl">Use</span><div class="chips">${Object.entries(AI_PROVIDERS).map(([k, v]) => `<button type="button" class="fchip${AI.provider === k ? ' on' : ''}" data-prov="${k}">${v.name}${aiKey(k) ? ` <span class="key-ok" title="Key saved">${icon('check')}</span>` : ''}</button>`).join('')}</div></div>`
        + `<div class="fld full"><label for="ai-key">${esc(p.name)} API key</label><input id="ai-key" class="field" type="password" value="${esc(aiKey())}" placeholder="${p.keyHint}" autocomplete="off" spellcheck="false"></div>`
        + `<p class="sheet-hint full" style="margin:0">Get a key at <a href="${p.keyUrl}" target="_blank" rel="noopener">${p.keyUrl.replace('https://', '')}</a>.${aiKey() ? ' <button type="button" class="link" data-x="forget">Remove this key</button>' : ''}</p>`
        + `<div class="fld full"><label for="ai-model">Model</label>`
        + (models && models.length > 12 ? `<input id="ai-filter" class="field sm" placeholder="Filter, e.g. claude, gemini, free" value="${esc(filter)}" autocomplete="off" style="margin-bottom:6px">` : '')
        + `<span class="select-wrap block">${modelSelectHTML()}</span>`
        + `<p class="sheet-hint" style="margin-top:6px">${models ? `${models.length} models that can use tools.` : loadErr ? 'Couldn’t load the list: ' + esc(loadErr) + '.' : AI.provider === 'gemini' && !aiKey() ? 'Paste your key to see the models.' : 'Loading models…'} <button type="button" class="link" data-x="reload">Refresh list</button></p></div>`
        + `<div class="fld full"><label for="ai-custom">Your instructions (optional)</label><textarea id="ai-custom" class="field area" rows="3" placeholder="e.g. My main board is Maintenance. Answer in Czech. I work at Mindmaze on weekdays.">${esc(AI.custom)}</textarea></div>`
        + `</div><p class="sheet-hint" id="ai-msg" aria-live="polite"></p>`
        + `<div class="sheet-actions"><span class="grow"></span><button type="submit" class="btn primary">Save and test</button></div></form>`;
      autosize($('#ai-custom', inner));
    };
    const keep = () => { const k = $('#ai-key', inner), m = $('#ai-model', inner), c = $('#ai-custom', inner);
      if (k) { const v = k.value.trim(); if (v) AI.keys[AI.provider] = v; }
      if (m && m.value) AI.models[AI.provider] = m.value;
      if (c) AI.custom = c.value; };
    const load = async force => {
      models = null; loadErr = ''; draw();
      try { models = await aiFetchModels(AI.provider, force); if (!models.length && AI.provider === 'gemini' && !aiKey()) models = null; }
      catch (e) { loadErr = e.message; models = null; }
      if (inner.isConnected) draw();
    };
    const msg = t => { const el = $('#ai-msg', inner); if (el) el.textContent = t; };
    draw(); load(false);
    inner.addEventListener('input', e => {
      if (e.target.id === 'ai-filter') { filter = e.target.value; keep(); const pos = e.target.selectionStart; draw(); const fl = $('#ai-filter', inner); fl.focus(); fl.setSelectionRange(pos, pos); }
      else if (e.target.id === 'ai-custom') autosize(e.target);
    });
    inner.addEventListener('change', e => {
      if (e.target.id === 'ai-model') { AI.models[AI.provider] = e.target.value; aiSave(); }
      else if (e.target.id === 'ai-key' && AI.provider === 'gemini' && e.target.value.trim()) { keep(); aiSave(); load(true); }
    });
    inner.addEventListener('click', e => {
      const pv = e.target.closest('[data-prov]');
      if (pv) { keep(); aiSave(); if (pv.dataset.prov !== AI.provider) { AI.provider = pv.dataset.prov; filter = ''; aiSave(); load(false); } return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'forget') { delete AI.keys[AI.provider]; aiSave(); draw(); toast(`${AI_PROVIDERS[AI.provider].name} key removed from this device`); }
      else if (x.dataset.x === 'reload') { keep(); aiSave(); load(true); }
    });
    inner.addEventListener('submit', async e => {
      e.preventDefault(); keep();
      if (!aiKey()) { msg('Paste your API key.'); return; }
      aiSave(); msg('Testing…');
      try {
        const r = await aiCall([{role: 'user', content: 'Reply with the single word: ready'}]);
        msg(`Works. ${aiModel()} replied “${String(r.content || '').trim().slice(0, 40)}”.`); toast('Assistant connected');
        setTimeout(() => { close(); if (back) back(); }, 800);
      } catch (err) { msg(err.message); }
    });
  }, {cls: 'compact'});
}
