        case 'clear-due': k.due = ''; k.dueTime = ''; k.repeat = 'none'; break;
        case 'ai': close(); openAssistant({ctx: {kind: 'card', id, title: k.title}}); return;
        case 'pin': k.pinned = !k.pinned; haptic('select'); toast(k.pinned ? 'Pinned to the top of the column' : 'Unpinned'); break;
        case 'prio': k.priority = +b.dataset.p; haptic('select'); break;
        case 'copy': copyCardToClipboard(id); break;
        case 'cl-toggle': { const it = k.checklist.find(i => i.id === b.dataset.i); if (it) { it.done = !it.done; haptic(it.done ? 'success' : 'select'); } break; }
        case 'cl-del': k.checklist = k.checklist.filter(i => i.id !== b.dataset.i); if (ui.clOpen === b.dataset.i) ui.clOpen = null; break;
        case 'cl-expand': ui.clOpen = ui.clOpen === b.dataset.i ? null : b.dataset.i; haptic('select'); break;
        case 'cl-due-clear': { const it = k.checklist.find(i => i.id === b.dataset.i); if (it) { it.due = ''; it.dueTime = ''; } break; }
        case 'delete': close(); withUndo('Card deleted', () => { const r = running(); if (r && r.cardId === k.id) stopTracking(); f.list.cards.splice(f.list.cards.indexOf(k), 1); }); return;
        default: return;
      }
      save(); scheduleRender(); draw();
    });
    inner.addEventListener('input', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      const k = f.card;
      if (t.id === 'cs-title') { k.title = t.value.replace(/\s*\n\s*/g, ' '); autosize(t); }
      else if (t.id === 'cs-desc') { k.desc = t.value; autosize(t); }
      else if (t.dataset.cl) { const it = k.checklist.find(i => i.id === t.dataset.cl); if (it) it.text = t.value; }
      else if (t.id === 'cl-ed-note' && ui.clOpen) { const it = k.checklist.find(i => i.id === ui.clOpen); if (it) { it.note = t.value; autosize(t); } }
      else return;
      save(); scheduleRender();
    });
    inner.addEventListener('change', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      if (t.id === 'cs-due') { f.card.due = t.value; if (!t.value) { f.card.dueTime = ''; f.card.repeat = 'none'; } save(); scheduleRender(); draw(); }
      else if (t.id === 'cs-due-time') { f.card.dueTime = f.card.due ? t.value : ''; save(); scheduleRender(); draw(); }
      else if ((t.id === 'cl-ed-date' || t.id === 'cl-ed-time') && ui.clOpen) {
        const it = f.card.checklist.find(i => i.id === ui.clOpen); if (!it) return;
        if (t.id === 'cl-ed-date') { it.due = t.value; if (!t.value) it.dueTime = ''; }
        else it.dueTime = it.due ? t.value : '';
        save(); scheduleRender(); draw();
      }
      else if (t.id === 'cs-repeat') { f.card.repeat = f.card.due ? t.value : 'none'; haptic('select'); save(); scheduleRender(); draw(); }
      else if (t.id === 'cs-job') { if (t.value) f.card.jobId = t.value; else delete f.card.jobId; save(); draw(); }
      else if (t.id === 'cs-move') {
        const to = findList(t.value);
        if (to && to.list !== f.list) {
          f.list.cards.splice(f.index, 1); to.list.cards.push(f.card);
          if (to.list.collapsed) to.list.collapsed = false;
          commit(); draw();
          toast(`Moved to ${to.list.title}${to.cat !== f.cat ? ` in ${to.cat.name}` : ''}`);
        }
      }
    });
    inner.addEventListener('keydown', e => {
      const t = e.target;
      if ((t.id === 'cs-title' || t.dataset.cl) && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); t.blur(); return; }
      if (t.id === 'cs-cl-add' && e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        const v = t.value.trim(); if (!v) return;
        const f = findCard(id); if (!f) return;
        t.value = '';
        f.card.checklist.push({id: uid(), text: v, done: false, due: '', dueTime: '', note: ''});
        save(); scheduleRender(); draw();
        const n = $('#cs-cl-add', inner); n.focus({preventScroll: true}); n.scrollIntoView({block: 'nearest'});
      }
    });
    inner.addEventListener('focusout', e => {
      const t = e.target, f = findCard(id); if (!f) return;
      if (t.id === 'cs-title' && !f.card.title.trim()) { f.card.title = 'Untitled'; t.value = 'Untitled'; save(); scheduleRender(); }
      if (t.dataset.cl && !t.value.trim()) {
        f.card.checklist = f.card.checklist.filter(i => i.id !== t.dataset.cl);
        save(); scheduleRender(); setTimeout(() => { if (sheet && sheet.el.contains(inner)) draw(); });
      }
      /* clicking away from "Add an item" commits it, same as pressing Enter */
      if (t.id === 'cs-cl-add') {
        const v = t.value.trim();
        if (v) {
          t.value = '';
          f.card.checklist.push({id: uid(), text: v, done: false, due: '', dueTime: '', note: ''});
          save(); scheduleRender(); setTimeout(() => { if (sheet && sheet.el.contains(inner)) draw(); });
        }
      }
    });
  }, {cls: 'card-sheet', onClose: () => { if (openCardId === id) openCardId = null; ui.clOpen = null; }});
}

/* ================= checklist item drag (reorder, card editor) ================= */
/* its own small long-press/threshold state machine (mirrors the board's pend/drag pattern) so it can
   start inside a .sheet, which the board drag&drop deliberately ignores */
let clPend = null, clDrag = null;
document.addEventListener('pointerdown', e => {
  if (clDrag || clPend) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const handle = e.target.closest('[data-cl-drag]'); if (!handle) return;
  const li = handle.closest('li[data-cli]'); if (!li) return;
  clPend = {li, id: e.pointerId, y: e.clientY, touch: e.pointerType !== 'mouse'};
  if (clPend.touch) clPend.timer = setTimeout(() => { if (clPend) clBeginDrag(); }, LONGPRESS_MS);
});
window.addEventListener('pointermove', e => {
  if (clPend && e.pointerId === clPend.id && !clDrag) {
    if (Math.abs(e.clientY - clPend.y) > (clPend.touch ? 10 : 6)) { if (clPend.touch) { clearTimeout(clPend.timer); clPend = null; } else clBeginDrag(); }
    return;
  }
  if (clDrag && e.pointerId === clDrag.id) clUpdate(e.clientY);
}, {passive: true});
window.addEventListener('pointerup', e => {
  if (clDrag && e.pointerId === clDrag.id) clEndDrag();
  else if (clPend && e.pointerId === clPend.id) { clearTimeout(clPend.timer); clPend = null; }
});
window.addEventListener('pointercancel', e => {
  if (clDrag && e.pointerId === clDrag.id) clEndDrag();
  else if (clPend && e.pointerId === clPend.id) { clearTimeout(clPend.timer); clPend = null; }
});
document.addEventListener('touchmove', e => { if (clDrag) e.preventDefault(); }, {passive: false});
function clBeginDrag() {
  const p = clPend; clPend = null; clearTimeout(p.timer);
  p.li.classList.add('cl-dragging');
  clDrag = {li: p.li, id: p.id};
  haptic('drag');
}
function clUpdate(y) {
  const {li} = clDrag, ul = li.parentElement; if (!ul) return;
  const items = $$('li[data-cli]', ul).filter(n => n !== li);
  let before = null;
  for (const n of items) { const r = n.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = n; break; } }
  if (before) { if (li.nextSibling !== before) ul.insertBefore(li, before); }
  else if (ul.lastElementChild !== li) ul.appendChild(li);
}
function clEndDrag() {
  const {li} = clDrag, ul = li.parentElement; clDrag = null;
  li.classList.remove('cl-dragging');
  if (ul) {
    const cardId = ul.dataset.card, f = findCard(cardId);
    if (f) {
      const order = $$('li[data-cli]', ul).map(n => n.dataset.cli);
      f.card.checklist.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      save(); scheduleRender();
    }
  }
  haptic('drop');
}

/* ================= toast ================= */
let toastTimer = 0;
const toastEl = $('#toast');
function toast(msg, {action, onAction} = {}) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" class="toast-btn">${esc(action)}</button>` : '');
  toastEl.hidden = false;
  toastEl.classList.remove('in'); void toastEl.offsetWidth; toastEl.classList.add('in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 3200);
  if (action) toastEl.querySelector('button').addEventListener('click', () => { hideToast(); onAction(); });
}
function hideToast() {
  toastEl.classList.remove('in');
  setTimeout(() => { if (!toastEl.classList.contains('in')) toastEl.hidden = true; }, 220);
}

/* ================= installable app ================= */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Docket is installed. Open it from your home screen.'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(() => pushSync(true)).catch(err => console.warn('Service worker registration failed', err));
}

/* ================= boot ================= */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
render();
/* notifications on/off became per device: keep this device's earlier choice */
try { if (localStorage.getItem('docket.notify') === null) devNotify(!!state.settings.notify); } catch (e) {}
scheduleLocal();
/* read-only hook for diagnostics and automated checks */
window.docketDebug = {
  reminderItems: () => reminderItems(), health: () => notifHealth(),
  /* test-only: drives the exact cross-board move the tab-hold drag performs, without a real
     pointer drag (used by tests/smoke20.js; jsdom can't simulate elementFromPoint/hold timing) */
  moveCardToCategory: (cardId, catId) => {
    const f = findCard(cardId), destCat = state.categories.find(c => c.id === catId);
    if (!f || !destCat) return null;
    const destList = moveCardToCategory(f.card, f.list, destCat);
    if (!destList) return null;
    save(); render();
    return destList.id;
  }
};
const activeTab = tabsEl.querySelector('.tab.is-active'); if (activeTab) activeTab.scrollIntoView({inline: 'nearest', block: 'nearest'});
if (pr().endsAt) tick();
fsInit();
ghLoadCfg(); ghPull(); aiLoad();
/* home-screen shortcuts open straight into the timer panel */
if (location.hash === '#focus' || location.hash === '#hours') { const tab = location.hash.slice(1); history.replaceState(null, '', location.pathname + location.search); openTimePanel(tab); }
})();
</script>
