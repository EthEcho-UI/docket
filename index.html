<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E6E8EC">
<meta name="description" content="Lists, cards, focus timer and work hours, made for your phone.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- /head-meta -->
<title>Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --ground:#E6E8EC; --col:#F1F2F5; --card:#FFFFFF; --sheet:#FFFFFF; --field:#F5F6F8;
  --ink:#16181D; --ink-2:#3B404B; --muted:#687080; --muted-2:#A2A8B4;
  --line:#DCDFE5; --line-strong:#BFC4CE; --hover:rgba(22,26,40,.06);
  --accent:#1F6FEB; --accent-ink:#FFFFFF; --accent-soft:rgba(31,111,235,.10);
  --danger:#C23B2E; --warn:#A86E12; --good:#2E8A55;
  --toast-accent:#9CC8FF; --scrim:rgba(14,16,22,.36);
  --shadow-card:0 1px 2px rgba(22,26,40,.07),0 0 0 1px rgba(22,26,40,.055);
  --shadow-hover:0 3px 8px -2px rgba(22,26,40,.12),0 0 0 1px rgba(22,26,40,.08);
  --shadow-lift:0 22px 44px -14px rgba(22,26,40,.38),0 0 0 1px rgba(22,26,40,.07);
  --l-moss:#4C8638; --l-mustard:#BE930C; --l-rust:#C9532B; --l-ultra:#3B5BDB; --l-orchid:#9A4CB6; --l-teal:#1C8B82; --l-rose:#C2416B; --l-sky:#2B87C2; --l-slate:#5D6B82; --l-lime:#6E9A1F;
  --ground-img:none; --ground-size:auto; --ground-pos:0 0; --ground-repeat:repeat; --col-blur:none; --col-shadow:none; --title-tt:none; --r-card:10px; --r-col:14px;
  --col-w:min(300px, calc(100vw - 76px));
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
    --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
    --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
    --accent:#4DA3FF; --accent-ink:#0E1014; --accent-soft:rgba(77,163,255,.14);
    --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
    --toast-accent:#1F6FEB; --scrim:rgba(0,0,0,.55);
    --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
    --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
    --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
    --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
  --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
  --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
  --accent:#4DA3FF; --accent-ink:#0E1014; --accent-soft:rgba(77,163,255,.14);
  --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
  --toast-accent:#1F6FEB; --scrim:rgba(0,0,0,.55);
  --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
  --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
  --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
  --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background-color:var(--ground);background-image:var(--ground-img);background-size:var(--ground-size);background-position:var(--ground-pos);background-repeat:var(--ground-repeat)}

/* ---------- top bar / category tabs ---------- */
.top{flex:none;display:flex;align-items:center;gap:0;padding:calc(env(safe-area-inset-top,0px) + 6px) max(6px,env(safe-area-inset-right,0px)) 2px max(4px,env(safe-area-inset-left,0px))}
.tabs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;position:relative;padding:0 8px 0 12px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 20px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;display:inline-flex;align-items:center;gap:7px;height:46px;text-transform:var(--title-tt);padding:0 10px;border:0;border-radius:10px;background:none;color:var(--muted);font:500 17px/1 var(--font-display);letter-spacing:-.012em;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab:hover{color:var(--ink)}
.tab.is-active{color:var(--ink);font-weight:700}
.tab.is-active::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2.5px;border-radius:2px;background:var(--ink)}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tab-count{font:500 11px/1 var(--font-mono);color:var(--muted);align-self:flex-start;margin-top:11px;font-variant-numeric:tabular-nums}
.tab.is-pressing{background:var(--hover)}
.tab-add{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;margin-left:2px}
.tab-add:hover{background:var(--hover);color:var(--ink)}
.tab-work{gap:6px}
.tab-work .ic{width:18px;height:18px}
.tab-work .live-dot{width:7px;height:7px;align-self:flex-start;margin-top:12px}
.tab-sep{flex:none;width:1px;height:22px;margin:0 4px;background:var(--line-strong)}

/* ---------- board ---------- */
.board{flex:1;min-height:0;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;position:relative;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));scroll-snap-type:x proximity;scroll-padding-inline:16px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
html.has-dock .board{padding-bottom:calc(var(--dock-h,60px) + 26px + env(safe-area-inset-bottom,0px))}
.board-end{flex:0 0 4px;height:1px}
html.dragging .board,html.dragging .tabs{scroll-snap-type:none}
html.dragging,html.dragging *{cursor:grabbing!important}

.list{flex:0 0 var(--col-w);width:var(--col-w);max-height:100%;display:flex;flex-direction:column;background:var(--col);border-radius:var(--r-col);scroll-snap-align:start;position:relative;box-shadow:var(--col-shadow);-webkit-backdrop-filter:var(--col-blur);backdrop-filter:var(--col-blur)}
.list-head{flex:none;display:flex;align-items:center;gap:0;min-height:54px;padding:6px 4px 2px 6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list-title{flex:1;min-width:0;text-align:left;text-transform:var(--title-tt);border:0;background:none;padding:7px 8px;border-radius:8px;color:var(--ink);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.list-title:hover{background:var(--hover)}
.list-title-input{flex:1;min-width:0;border:0;outline:none;border-radius:8px;padding:7px 8px;background:var(--card);box-shadow:0 0 0 2px var(--accent);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;color:var(--ink)}
.list-count{flex:none;font:500 12px/1 var(--font-mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.list-head.is-pressing,.list.is-pressing .collapsed-body{background:var(--hover);border-radius:12px}

.cards{flex:0 1 auto;min-height:8px;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;display:flex;flex-direction:column;gap:6px;padding:2px 8px 6px;position:relative;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}

.card{flex:none;position:relative;display:flex;flex-direction:column;gap:7px;padding:10px 12px 11px 8px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .16s ease,box-shadow .16s ease}
.card:focus-visible{outline:none;box-shadow:var(--shadow-card),0 0 0 2px var(--accent)}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-hover)}}
.card.is-pressing{transform:scale(.975)}
.card-labels{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-left:34px}
.lab{display:block;width:28px;height:6px;border-radius:3px;background:var(--c)}
.lab.named{width:auto;height:auto;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 17%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ink));font:600 11.5px/1.2 var(--font-ui)}
.card-main{display:flex;align-items:flex-start;gap:8px}
.card-title{flex:1;min-width:0;font-size:15px;line-height:1.35;padding-top:1px;overflow-wrap:anywhere}
.card.is-done .card-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-left:34px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chip .ic{width:14px;height:14px}
.chip.late{color:var(--danger)} .chip.soon{color:var(--warn)} .chip.ok{color:var(--good)} .chip.live{color:var(--accent);font-weight:600}
.live-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.6s ease-in-out infinite}
.chip .live-dot{width:7px;height:7px;margin-right:2px}
@keyframes pulse{50%{opacity:.3}}

.check{flex:none;position:relative;width:26px;height:26px;margin:-3px 0 -3px;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:transparent;cursor:pointer}
.check::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.check::after{content:"";position:absolute;inset:-8px}
.check .ic{position:relative;width:13px;height:13px;stroke-width:2.8}
.check:hover::before{border-color:var(--accent)}
.check.on{color:var(--accent-ink)}
.check.on::before{background:var(--accent);border-color:var(--accent)}
.check.big{width:34px;height:34px;margin:0}
.check.big .ic{width:16px;height:16px}

/* collapsed columns */
.list.is-collapsed{flex-basis:52px;width:52px}
.list.is-collapsed .cards{display:none}
.collapsed-body{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:16px 0 18px;border:0;border-radius:var(--r-col);background:none;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.collapsed-body:hover{background:var(--hover)}
.collapsed-body .ic{color:var(--muted)}
.v-title{writing-mode:vertical-rl;text-transform:var(--title-tt);font:650 17px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap;max-height:56vh;overflow:hidden;text-overflow:ellipsis}
.list.is-collapsed.is-drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

.list-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 6px 8px}
.add-card{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 14.5px/1 var(--font-ui);cursor:pointer}
.add-card:hover{background:var(--hover);color:var(--ink)}
.hidden-note{border:0;background:none;color:var(--muted);font:500 11.5px/1 var(--font-mono);padding:8px;border-radius:8px;cursor:pointer}
.hidden-note:hover{color:var(--ink)}

.composer{flex:none;display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px}
.composer textarea,.add-list input{width:100%;resize:none;border:0;outline:none;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow-card),0 0 0 2px var(--accent);padding:10px 12px;color:var(--ink);font:16px/1.35 var(--font-ui)}
.composer textarea{min-height:66px}
.composer-row{display:flex;align-items:center;gap:6px}

.add-list{flex:0 0 var(--col-w);width:var(--col-w);display:flex;align-items:center;gap:6px;height:54px;padding:0 14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-col);background:none;color:var(--muted);font:600 15px/1 var(--font-ui);cursor:pointer;scroll-snap-align:start}
.add-list:hover{color:var(--ink);border-color:var(--muted-2)}
.add-list.is-open{height:auto;flex-direction:column;align-items:stretch;gap:8px;padding:8px;border:0;background:var(--col);cursor:default}

/* drag states */
.is-placeholder{background:transparent!important;box-shadow:none!important;outline:1.5px dashed var(--line-strong);outline-offset:-1.5px;transform:none!important}
.is-placeholder>*{visibility:hidden}
.ghost{position:fixed!important;left:0;top:0;margin:0!important;z-index:60;pointer-events:none;opacity:.97;will-change:transform;overflow:hidden;box-shadow:var(--shadow-lift)!important;transition:none}
.tab.ghost{background:var(--card);border-radius:10px}
.ghost.settling{transition:transform .16s cubic-bezier(.2,.8,.2,1)}

/* buttons & fields */
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:default;background:none}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ic{width:17px;height:17px}
.icon-btn.lg{width:50px;height:50px;border-radius:25px;background:var(--hover);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:11px;background:var(--hover);color:var(--ink);font:600 15px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--danger);color:#fff}
.btn.danger{background:none;color:var(--danger);padding:0 8px}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn .ic{width:18px;height:18px}
.composer .btn{height:40px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font:600 13.5px/1 var(--font-ui);cursor:pointer}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font:16px/1.4 var(--font-ui);outline:none;min-height:46px}
.field:focus{border-color:var(--accent)}
.field[readonly]{color:var(--muted)}
.field.area{resize:none;min-height:88px;display:block}
.field.sm{padding:7px 10px;min-height:0}
.mono{font:500 12px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.grow{flex:1}
.switch{flex:none;position:relative;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;position:relative;cursor:pointer}
.toggle>span:first-child{display:flex;flex-direction:column;gap:2px;font-weight:500}
.toggle small{font-size:12.5px;font-weight:400;color:var(--muted)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle input:checked+.switch{background:var(--accent);border-color:var(--accent)}
.toggle input:checked+.switch::after{opacity:1}
.toggle input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.full{grid-column:1/-1}
.fld label,.fld .lbl{display:block;margin-bottom:6px;font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- sheets, menus, toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.scrim.clear{background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--sheet);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px -12px rgba(0,0,0,.35);transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.sheet.in{transform:none}
.sheet.tall{height:calc(100% - 28px - env(safe-area-inset-top,0px))}
.sheet-grip{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-inner{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-title{margin:2px 0 14px;font:650 20px/1.25 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.sheet-text{margin:0 0 6px;color:var(--ink-2);line-height:1.5;max-width:60ch}
.sheet-hint{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;margin-top:18px}
.sheet textarea.field.mono-box{font:12px/1.4 var(--font-mono);min-height:140px;margin-top:10px}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:7vh;width:min(600px,calc(100vw - 48px));max-height:86vh;border-radius:18px;opacity:0;transform:translate(-50%,14px);transition:transform .22s cubic-bezier(.2,.85,.25,1),opacity .18s}
  .sheet.in{opacity:1;transform:translate(-50%,0)}
  .sheet.compact{width:min(460px,calc(100vw - 48px));top:12vh}
  .sheet.tall{height:84vh}
  .sheet-grip{height:16px;cursor:default}
  .sheet-grip::before{display:none}
  .sheet-inner{padding:4px 24px 24px}
}

.menu{position:fixed;z-index:51;background:var(--sheet);color:var(--ink)}
.menu.as-sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;padding:6px;border-radius:18px;box-shadow:var(--shadow-lift);transform:translateY(calc(100% + 24px));transition:transform .26s cubic-bezier(.2,.85,.25,1)}
.menu.as-sheet.in{transform:none}
.menu.pop{min-width:250px;max-width:320px;padding:5px;border-radius:12px;box-shadow:var(--shadow-lift);opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}

/* dates & durations (all local time) */
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function isoDay(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return dayKey(d.getTime()); }
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const fmtDate = (ts, withYear) => new Date(ts).toLocaleDateString(undefined, withYear ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'});
const fmtDay = key => new Date(parseISO(key)).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const fmtStamp = ts => new Date(ts).toLocaleString(undefined, {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function fmtHM(ms) {
  const totalMin = Math.round(Math.max(0, ms) / 60000), h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h ? `${h}h ${pad(m)}m` : `${m}m`;
}
function clock(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}
function dueInfo(iso, done) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return {text: '', cls: ''};
  const diff = Math.round((parseISO(iso) - parseISO(isoDay(0))) / 864e5);
  const text = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : fmtDate(parseISO(iso), Math.abs(diff) > 300);
  return {text, cls: done ? '' : diff < 0 ? 'late' : diff <= 1 ? 'soon' : ''};
}
function autosize(t) { if (!t || t.tagName !== 'TEXTAREA') return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* accent presets: [name, on light themes, on dark themes] */
const ACCENTS = {
  azure: ['Azure', '#1F6FEB', '#4DA3FF'], ocean: ['Ocean', '#0B6FA4', '#3BB4E5'], teal: ['Teal', '#0E8A7E', '#3FD0BE'],
  emerald: ['Emerald', '#1A7A43', '#52D18A'], amber: ['Amber', '#B26B00', '#FFB547'], coral: ['Coral', '#D9483B', '#FF7A66'],
  rose: ['Rose', '#C2366B', '#FF6FA3'], violet: ['Violet', '#6E46D9', '#A68CFF'], lavender: ['Lavender', '#5B5BD6', '#8D9DFF'], graphite: ['Graphite', '#2B2F36', '#D5D9E0']
};
const inkFor = hex => {
  const n = parseInt(hex.slice(1), 16), ch = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };

    };
    draw();
    inner.addEventListener('click', async e => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'toggle') { if (notifStatus() === 'on') await disableNotifications(); else await enableNotifications(); draw(); }
      else if (x.dataset.x === 'test') {
        try { const sub = await pushSubscription(true); const r = await pushPost('/test', {endpoint: sub.endpoint}); toast(r.ok ? 'Test sent. It should arrive in a few seconds.' : 'The push service refused the test (' + r.status + ').'); }
        catch (err) { toast('Couldn’t reach the reminder server. Check your connection.'); }
      }
    });
    inner.addEventListener('change', e => {
      const t = e.target, n = state.settings.notifyPrefs;
      if (t.dataset.np) { n[t.dataset.np] = t.checked; haptic('select'); save(); draw(); }

}
async function notify(title, body) {
  haptic('alarm');
  chime();
  toast(`${title} ${body}`);
  if (notifStatus() !== 'on') return;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.showNotification(title, {body, tag: 'docket-timer', renotify: true}); return; }
  } catch (e) {}

}

/* ================= haptics ================= */
/* Android Chrome only: vibrate() has no amplitude control, so "intensity" scales pulse length */
const HAPTIC_PATTERNS = {tap: [1], select: [0.6], drag: [1.5], drop: [1], success: [1, 60, 1.3], warn: [2.4], alarm: [8, 140, 8, 140, 12]};
const canVibrate = typeof navigator.vibrate === 'function';
function haptic(kind = 'tap') {
  const h = state.settings.haptics;
  if (!canVibrate || !h || !h.on) return;
  const base = HAPTIC_MS[h.level] || HAPTIC_MS.medium;
  try { navigator.vibrate((HAPTIC_PATTERNS[kind] || HAPTIC_PATTERNS.tap).map((v, i) => i % 2 ? v : Math.max(1, Math.round(v * base)))); } catch (e) {}
}
const capWord = w => w.charAt(0).toUpperCase() + w.slice(1);
function openHapticsSheet() {
  openSheet(inner => {
    const draw = () => {
      const h = state.settings.haptics;
      inner.innerHTML = `<h2 class="sheet-title sheet-drag">Haptics</h2>`
        + `<label class="toggle"><span>Vibration feedback<small>Dragging, checking things off, timers and deletes</small></span><input type="checkbox" id="hp-on"${h.on ? ' checked' : ''}><span class="switch"></span></label>`
        + `<div class="fld" style="margin-top:12px"><span class="lbl">Intensity</span><div class="chips">`
        + ['light', 'medium', 'strong'].map(l => `<button type="button" class="fchip${h.level === l ? ' on' : ''}" data-l="${l}"${h.on ? '' : ' disabled'}>${capWord(l)}</button>`).join('') + `</div></div>`
        + `<div class="sheet-actions" style="justify-content:flex-start"><button type="button" class="btn" data-x="tap"${h.on ? '' : ' disabled'}>Test</button><button type="button" class="btn" data-x="alarm"${h.on ? '' : ' disabled'}>Test timer alert</button></div>`
        + `<p class="sheet-hint">${canVibrate ? 'Works in Chrome on Android. Silent or Do Not Disturb mode can block it, and it doesn’t work inside the preview.' : 'This browser can’t vibrate. iPhones and Safari don’t let web apps vibrate, and Firefox on Android turns it off.'}</p>`;
    };
    draw();
    inner.addEventListener('change', e => { if (e.target.id === 'hp-on') { state.settings.haptics.on = e.target.checked; save(); haptic('select'); draw(); } });
    inner.addEventListener('click', e => {
      const l = e.target.closest('[data-l]');
      if (l && !l.disabled) { state.settings.haptics.level = l.dataset.l; save(); haptic('drag'); draw(); return; }
      const x = e.target.closest('[data-x]'); if (!x || x.disabled) return;
      haptic(x.dataset.x === 'alarm' ? 'alarm' : 'success');
    });
  }, {cls: 'compact'});
}

let themeApplied = false;

function renderBoard() {

function renderDock() {
  const r = running(), p = pr(), now = Date.now();
  const pomoOn = p.phase !== 'idle';
  $('#time-btn').classList.toggle('is-live', !!r || !!p.endsAt);
  if (!r && !pomoOn) { dockEl.hidden = true; document.documentElement.classList.remove('has-dock'); return; }
  const rows = [];
  if (pomoOn) {
    const left = pomoLeft(now), pct = (1 - left / pomoDur(p.phase)) * 100;
    const label = p.endsAt ? P_NAMES[p.phase] : (p.left == null || p.left === pomoDur(p.phase) ? `${P_NAMES[p.phase]} next` : `${P_NAMES[p.phase]} · paused`);
    rows.push(`<div class="dock-row"><button type="button" class="dock-pill" data-action="open-focus"><span class="dock-ring${p.phase === 'work' ? '' : ' brk'}" data-pomo-dock style="--p:${pct.toFixed(1)}"></span>`
      + `<span class="dock-label">${label}</span><span class="dock-time" data-pomo-left>${clock(left)}</span></button>`
      + `<button type="button" class="icon-btn" data-action="pomo-toggle" aria-label="${p.endsAt ? 'Pause focus timer' : 'Start focus timer'}">${icon(p.endsAt ? 'pause' : 'play')}</button></div>`);
  }
  if (r) {
    const j = jobById(r.jobId);
    rows.push(`<div class="dock-row"><button type="button" class="dock-pill" data-action="open-hours"><span class="live-dot"></span>`
      + `<span class="dock-label">${esc(entryLabel(r))}${j ? ` <small>· ${esc(j.name)}${j.rate ? ' · ' + liveEarnHTML(r) : ''}</small>` : ''}</span><span class="dock-time" data-since="${r.start}">${clock(now - r.start)}</span></button>`
      + `<button type="button" class="icon-btn" data-action="track-stop" aria-label="Stop timer">${icon('stop')}</button></div>`);
  }
  dockEl.innerHTML = rows.join('');
  dockEl.hidden = false;
  document.documentElement.classList.add('has-dock');
  document.documentElement.style.setProperty('--dock-h', dockEl.offsetHeight + 'px');
}

/* one ticker drives every live number on screen */
function tick() {
  const now = Date.now();
  const p = pr();
  if (p.endsAt && now >= p.endsAt) { pomoAdvance(true); return; }
  $$('[data-since]').forEach(el => { el.textContent = clock((+el.dataset.base || 0) + now - (+el.dataset.since)); });
  $$('[data-earn-since]').forEach(el => { el.textContent = fmtMoney(+el.dataset.earnBase + (now - +el.dataset.earnSince) * +el.dataset.earnRate, el.dataset.cur, 2); });
  if (p.phase !== 'idle' || $('[data-pomo-left]')) {
    const left = pomoLeft(now), dur = pomoDur(p.phase === 'idle' ? 'work' : p.phase);
    $$('[data-pomo-left]').forEach(el => { el.textContent = clock(left); });
    $$('[data-pomo-ring]').forEach(el => { el.setAttribute('stroke-dashoffset', (RING_C * (1 - left / dur)).toFixed(1)); });
    $$('[data-pomo-dock]').forEach(el => { el.style.setProperty('--p', ((1 - left / dur) * 100).toFixed(1)); });
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); fsPull(); pushSyncSoon(); } });

/* ================= actions ================= */
function addFromComposer() {
  if (!ui.composer) return;
  const ta = $('#composer-input');
  const text = ta ? ta.value : ui.composer.text;
  const titles = text.split('\n').map(s => s.trim()).filter(Boolean);
  if (!titles.length) { if (ta) ta.focus(); return; }
  const f = findList(ui.composer.listId); if (!f) return;
  titles.forEach(t => f.list.cards.push(newCard(t)));
  ui.composer.text = ''; ui.focus = 'composer-input'; ui.scrollListEnd = f.list.id;
  commit();
}
function addList() {
  const inp = $('#addlist-input');
  const name = (inp ? inp.value : ui.addListText).trim();
  if (!name) { if (inp) inp.focus(); return; }
  currentCat().lists.push(newList(name));
  ui.addListText = ''; ui.focus = 'addlist-input';
  commit();
  boardEl.scrollLeft = boardEl.scrollWidth;
}
function withUndo(msg, fn) {
  const snap = JSON.stringify(state);
  haptic('warn');
  fn(); commit();
  toast(msg, {action: 'Undo', onAction: () => { state = normalize(JSON.parse(snap)); commit(); }});
}
function startComposer(listId) { ui.composer = {listId, text: ''}; ui.focus = 'composer-input'; renderBoard(); }
function startRename(listId) { ui.renamingList = listId; ui.focus = 'rename-list-input'; renderBoard(); }
/* the column finished cards go to: one marked as Done, or one named like it */
const DONE_NAME = /^(done|hotovo|dokon[čc]eno|completed|finished)$/i;
const doneListOf = c => c.lists.find(l => l.isDone) || c.lists.find(l => DONE_NAME.test(l.title.trim()));
/* returns a short message about where the card went, or '' */
function moveForDone(card, done) {
  if (!state.settings.autoMoveDone) return '';
  const f = findCard(card.id); if (!f) return '';
  const {cat: c, list: l} = f;
  if (done) {
    let dl = doneListOf(c), created = false;
    if (!dl) { dl = newList('Done', {isDone: true}); c.lists.push(dl); created = true; }
    if (dl === l) return '';
    l.cards.splice(f.index, 1); card.fromList = l.id; dl.cards.unshift(card);
    return created ? 'Moved to a new Done column' : `Moved to ${dl.title}`;
  }
  const dl = doneListOf(c);
  if (l !== dl) return '';
  const back = c.lists.find(x => x.id === card.fromList && x !== dl) || c.lists.find(x => x !== dl);
  if (!back) return '';
  l.cards.splice(f.index, 1); delete card.fromList; back.cards.unshift(card);
  return `Moved back to ${back.title}`;
}
function setDone(card, done) {
  card.done = done;
  haptic(done ? 'success' : 'tap');
  const r = running();
  if (done && r && r.cardId === card.id) { stopTracking(); toast('Timer stopped'); }
  return moveForDone(card, done);
}

/* ================= event delegation ================= */
let suppressUntil = 0;
document.addEventListener('click', e => {
  if (performance.now() < suppressUntil) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);

document.addEventListener('click', e => {
  if (e.target.closest('.sheet, .menu')) return;
  const a = e.target.closest('[data-action]');
  if (!a) {
    const cardEl = e.target.closest('.card');
    if (cardEl && boardEl.contains(cardEl)) {
      if (cardEl.dataset.card) openCard(cardEl.dataset.card);
      else if (cardEl.dataset.task) openTaskSheet(cardEl.dataset.task);
    }
    return;
  }
  const listEl = a.closest('.list');
  const lid = listEl && listEl.dataset.list;
  switch (a.dataset.action) {
    case 'tab': {
      const id = a.dataset.cat;
      if (id === state.active) { categoryMenu(a); break; }
      haptic('select');
      state.active = id; ui.composer = null; ui.addingList = false; ui.renamingList = null;
      commit();
      const t = tabsEl.querySelector(`[data-cat="${id}"]`); if (t) t.scrollIntoView({inline: 'nearest', block: 'nearest'});
      break;
    }
    case 'add-cat':
      promptSheet({title: 'New category', placeholder: 'e.g. Garage projects', confirm: 'Create', onSave: name => {
        const c = newCategory(name, LABEL_KEYS[state.categories.length % LABEL_KEYS.length]);
        state.categories.push(c); state.active = c.id; commit();
        requestAnimationFrame(() => { const t = tabsEl.querySelector(`[data-cat="${c.id}"]`); if (t) t.scrollIntoView({inline: 'nearest', block: 'nearest'}); });
      }});
      break;
    case 'menu': appMenu(a); break;
    case 'time': openTimePanel(); break;
    case 'open-focus': openTimePanel('focus'); break;
    case 'open-hours': openTimePanel('hours'); break;
    case 'pomo-toggle': haptic('tap'); pomoToggle(); if (timeDraw) timeDraw(); break;
    case 'track-stop': haptic('tap'); stopTracking(); commit(); if (timeDraw) timeDraw(); toast('Timer stopped'); break;
    case 'toggle-done': {
      const f = findCard(a.closest('.card').dataset.card); if (!f) break;
      const card = f.card, moved = setDone(card, !card.done);
      commit();
      if (card.done && (moved || state.settings.hideDone)) {
        toast(moved || 'Marked done and hidden', {action: 'Undo', onAction: () => { setDone(card, false); commit(); }});
      } else if (moved) toast(moved);
      break;
    }
    case 'collapse': { const f = findList(lid); if (f) { f.list.collapsed = true; if (ui.composer && ui.composer.listId === lid) ui.composer = null; commit(); } break; }
    case 'expand': { const f = findList(lid); if (f) { f.list.collapsed = false; commit(); } break; }
    case 'rename-list': startRename(lid); break;
    case 'list-menu': listMenu(a, lid); break;
    case 'add-card': startComposer(lid); break;
    case 'composer-add': addFromComposer(); break;
    case 'composer-close': ui.composer = null; renderBoard(); break;
    case 'show-done': state.settings.hideDone = false; commit(); toast('Showing completed cards'); break;
    case 'addlist-open':
      ui.addingList = true; ui.addListText = ''; ui.focus = 'addlist-input'; renderBoard();
      boardEl.scrollLeft = boardEl.scrollWidth;
      break;
    case 'addlist-save': addList(); break;
    case 'addlist-close': ui.addingList = false; renderBoard(); break;
  }
});

/* keep the keyboard up when tapping composer buttons */

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.id === 'composer-input') {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFromComposer(); }
    else if (e.key === 'Escape') { ui.composer = null; renderBoard(); }
    return;
  }
  if (t.id === 'rename-list-input') {

    else if (e.key === 'Escape') { ui.renamingList = null; renderBoard(); }
    return;

  if (t.id === 'addlist-input') {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addList(); }
    else if (e.key === 'Escape') { ui.addingList = false; renderBoard(); }
    return;

document.addEventListener('input', e => {

  else if (t.id === 'addlist-input') ui.addListText = t.value;

let pend = null, drag = null, settling = false;

  let el = null, type = null;

window.addEventListener('pointermove', e => {

}, {passive: true});

window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(); else if (pend && e.pointerId === pend.id) cancelPend(); });

document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive: false});

function cancelPend() {

}

function beginDrag() {

  const ghost = el.cloneNode(true);
  ghost.classList.add('ghost'); ghost.removeAttribute('id');
  $$('[id]', ghost).forEach(n => n.removeAttribute('id'));
  $$('[data-since]', ghost).forEach(n => n.removeAttribute('data-since'));

  document.body.appendChild(ghost);

    el, type: p.type, id: p.id, x: p.lx, y: p.ly, offX: p.x - r.left, offY: p.y - r.top, ghost, hover: null, raf: 0,
    flipSel: p.type === 'card' ? '#board .card' : p.type === 'list' ? '#board > .list, #board > .add-list' : '#tabs > .tab[data-cat], #tabs > .tab-add'

function placeGhost() {

function setHover(list) {

  drag.hover = list;
  if (list) list.classList.add('is-drop');

function listAt(x, y) {

  const l = under && under.closest('#board > .list');

  const br = boardEl.getBoundingClientRect();

  for (const n of $$(':scope > .list', boardEl)) {

    const d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;

/* insertion point from layout positions (ignores in-flight FLIP transforms) */
function pickBefore(items, cont, pos, axis) {

    const size = axis === 'y' ? n.offsetHeight : n.offsetWidth;

    const items = [...cont.children].filter(n => n !== el && n.classList.contains('card'));
    placeInto(cont, pickBefore(items, cont, y, 'y'));

    const items = $$(':scope > .list', boardEl).filter(n => n !== el);
    placeInto(boardEl, pickBefore(items, boardEl, x, 'x') || boardEl.querySelector(':scope > .add-list'));
  } else {
    const items = $$(':scope > .tab[data-cat]', tabsEl).filter(n => n !== el);
    placeInto(tabsEl, pickBefore(items, tabsEl, x, 'x') || tabsEl.querySelector('.tab-add'));

function flip(mutate) {
  const els = $$(drag.flipSel).filter(n => n !== drag.el);

  els.forEach(n => {

}

function autoScroll() {

  const nudge = (el, axis, lo, hi, pos) => {
    const edge = Math.min(64, (hi - lo) * 0.18);

    if (pos < lo + edge) v = -Math.pow(Math.min(1, (lo + edge - pos) / edge), 2) * 18;
    else if (pos > hi - edge) v = Math.pow(Math.min(1, (pos - (hi - edge)) / edge), 2) * 18;
    if (!v) return;
    const prop = axis === 'x' ? 'scrollLeft' : 'scrollTop';

    if (el[prop] !== before) moved = true;

  else {
    const r = boardEl.getBoundingClientRect();

}

function commitDrop(d) {
  if (d.type === 'card') {
    const f = findCard(d.el.dataset.card), listEl = d.el.closest('.list');

    const to = findList(listEl.dataset.list); if (!to) return;
    f.list.cards.splice(f.index, 1);
    let idx = to.list.cards.length;
    if (!listEl.classList.contains('is-collapsed')) {
      const prev = d.el.previousElementSibling, next = d.el.nextElementSibling;
      if (prev) { const i = to.list.cards.findIndex(k => k.id === prev.dataset.card); if (i > -1) idx = i + 1; }
      else if (next) { const i = to.list.cards.findIndex(k => k.id === next.dataset.card); if (i > -1) idx = i; }
      else idx = 0;
    } else if (to.list !== f.list) toast(`Moved to ${to.list.title}`);
    to.list.cards.splice(idx, 0, f.card);
  } else if (d.type === 'list') {
    const order = $$(':scope > .list', boardEl).map(n => n.dataset.list);
    currentCat().lists.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  } else {
    const order = $$(':scope > .tab[data-cat]', tabsEl).map(n => n.dataset.cat);

  const finish = () => { d.ghost.remove(); settling = false; render(); };
  if (reduceMotion.matches || !r.width) { finish(); return; }
  settling = true;
  d.ghost.classList.add('settling');
  d.ghost.style.transform = `translate3d(${r.left}px, ${r.top}px, 0)`;

/* ================= sheets ================= */
const layer = $('#layer');
let sheet = null;

  const scrim = document.createElement('div'); scrim.className = 'scrim';

  el.className = 'sheet ' + cls; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="sheet-grip" aria-hidden="true"></div><div class="sheet-inner"></div>';

  enableSwipeClose(el);

}

  const done = () => { s.el.remove(); s.scrim.remove(); };
  if (instant || reduceMotion.matches) done();
  else { s.el.classList.remove('in'); s.scrim.classList.remove('in'); setTimeout(done, 320); }

}

  const release = closeIt => {
    el.style.transition = '';
    suppressUntil = performance.now() + 350;
    if (closeIt) { el.style.transform = ''; closeSheet(); }
    else el.style.transform = '';
  };
  el.addEventListener('touchstart', e => {
    mode = (wide.matches || e.touches.length !== 1 || e.target.closest('input, textarea, select, .chips')) ? 'skip' : null;
    if (mode) return;
    const t = e.touches[0]; y0 = t.clientY; x0 = t.clientX; t0 = e.timeStamp; dy = 0;
  }, {passive: true});
  el.addEventListener('touchmove', e => {

  el.addEventListener('pointerup', () => { if (my === null) return; my = null; release(dy > 90); });
}

function promptSheet({title, value = '', placeholder = '', confirm = 'Save', onSave}) {
  openSheet((inner, close) => {
    inner.innerHTML = `<form class="prompt" novalidate><h2 class="sheet-title sheet-drag">${esc(title)}</h2>`
      + `<input id="prompt-input" class="field" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="${esc(title)}">`
      + `<div class="sheet-actions"><button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">${esc(confirm)}</button></div></form>`;
    const form = inner.querySelector('form'), inp = inner.querySelector('input');

function confirmSheet({title, text, confirm, cancel = 'Cancel', onConfirm, onCancel, danger = true}) {
  openSheet((inner, close) => {
    inner.innerHTML = `<h2 class="sheet-title sheet-drag">${esc(title)}</h2><p class="sheet-text">${esc(text)}</p>`
      + `<div class="sheet-actions"><button type="button" class="btn" data-x="cancel">${esc(cancel)}</button><button type="button" class="btn primary" data-x="ok"${danger ? ' style="background:var(--danger);color:#fff"' : ''}>${esc(confirm)}</button></div>`;

/* ================= menus ================= */
let menu = null;

    const lead = it.dot ? `<span class="tab-dot" style="--c:var(--l-${it.dot})"></span>` : icon(it.icon || 'blank');
    const tail = it.checked !== undefined ? `<span class="mi-check${it.checked ? ' on' : ''}" aria-hidden="true">${icon('check')}</span>` : '';
