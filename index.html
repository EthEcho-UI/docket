/* ================= sync folder (File System Access API) ================= */
const FS = {ok: typeof window.showDirectoryPicker === 'function', handle: null, status: 'off', err: '', timer: 0, last: 0};
let fsSheetDraw = null;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('docket', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(op, key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');
    const rq = op === 'get' ? st.get(key) : op === 'set' ? st.put(val, key) : st.delete(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function fsHint() {
  if (!FS.ok) return 'Not available in this browser';
  if (FS.status === 'on') return `Saving to “${FS.handle.name}”`;
  if (FS.status === 'paused') return 'Needs permission again';
  if (FS.status === 'error') return 'Problem: tap for details';
  return 'Off';
}
function fsFail(e) {
  if (e && e.name === 'NotAllowedError') { FS.status = 'paused'; }
  else if (e && e.name === 'SecurityError') { FS.status = 'error'; FS.err = 'This page isn’t allowed to open folders. Folder sync needs Docket opened from an https:// address or installed as an app.'; }
  else { FS.status = 'error'; FS.err = (e && e.message) || String(e); }
  toast(FS.status === 'paused' ? 'Docket lost access to your sync folder.' : 'Sync folder: ' + FS.err, FS.status === 'paused' ? {action: 'Allow', onAction: fsReconnect} : {});
  if (fsSheetDraw) fsSheetDraw();
}
async function fsInit() {
  if (!FS.ok) return;
  try {
    const h = await kv('get', 'dir'); if (!h) return;
    FS.handle = h;
    const p = await h.queryPermission({mode: 'readwrite'});
    if (p === 'granted') { FS.status = 'on'; await fsPull(); }
    else { FS.status = 'paused'; toast(`Allow Docket to keep using “${h.name}”?`, {action: 'Allow', onAction: fsReconnect}); }
  } catch (e) { /* no stored folder or no IndexedDB */ }
}
async function fsReconnect() {
  if (!FS.handle) return;
  try {
    const p = await FS.handle.requestPermission({mode: 'readwrite'});
    if (p === 'granted') { FS.status = 'on'; await fsPull(); fsPushSoon(); toast(`Syncing with “${FS.handle.name}”`); }
  } catch (e) { fsFail(e); }
  if (fsSheetDraw) fsSheetDraw();
}
async function fsChoose() {
  try {
    const h = await window.showDirectoryPicker({id: 'docket-sync', mode: 'readwrite'});
    FS.handle = h; FS.status = 'on'; FS.err = '';
    try { await kv('set', 'dir', h); } catch (e) {}
    await fsFirstSync();
  } catch (e) { if (e && e.name === 'AbortError') return; fsFail(e); }
}
async function fsRead() {
  try {
    const fh = await FS.handle.getFileHandle(SYNC_FILE);
    const f = await fh.getFile();
    return {text: await f.text(), modified: f.lastModified};
  } catch (e) { if (e && e.name === 'NotFoundError') return null; throw e; }
}
async function fsWrite() {
  if (!FS.handle || FS.status !== 'on') return;
  try {
    const fh = await FS.handle.getFileHandle(SYNC_FILE, {create: true});
    const w = await fh.createWritable();
    await w.write(JSON.stringify(state));
    await w.close();
    FS.last = Date.now();
    if (fsSheetDraw) fsSheetDraw();
  } catch (e) { fsFail(e); }
}
function fsPushSoon() { if (FS.status !== 'on') return; clearTimeout(FS.timer); FS.timer = setTimeout(fsWrite, 250); }
setInterval(() => { if (FS.status === 'on' && document.visibilityState === 'visible') fsPull(); }, 30000);
/* a stored folder whose permission lapsed is re-requested on the first tap, since browsers only allow the prompt after a user gesture */
document.addEventListener('click', () => { if (FS.status === 'paused' && FS.handle && !FS.asked) { FS.asked = true; fsReconnect(); } }, true);
function adopt(data, msg) {
  data.settings = Object.assign({}, state.settings, data.settings);
  state = data; saveLocal(); render();
  if (msg) toast(msg);
}
async function fsPull() {
  if (FS.status !== 'on') return;
  try {
    const r = await fsRead();
    if (!r) { fsPushSoon(); return; }
    const data = normalize(JSON.parse(r.text));
    if (data.savedAt > state.savedAt) adopt(data, 'Loaded newer data from your sync folder');
    else if (data.savedAt < state.savedAt) fsPushSoon();
  } catch (e) { if (e instanceof SyntaxError) toast(`${SYNC_FILE} in your sync folder is damaged, so Docket kept this device's data.`); else fsFail(e); }
}
async function fsFirstSync() {
  let r;
  try { r = await fsRead(); } catch (e) { fsFail(e); return; }
  if (!r) { await fsWrite(); toast(`Saving to “${FS.handle.name}”`); if (fsSheetDraw) fsSheetDraw(); return; }
  let data = null;
  try { data = normalize(JSON.parse(r.text)); } catch (e) {}
  if (!data) { await fsWrite(); toast(`Replaced an unreadable ${SYNC_FILE}`); return; }
  if (data.savedAt === state.savedAt) { toast('Folder connected'); if (fsSheetDraw) fsSheetDraw(); return; }
  confirmSheet({
    title: 'This folder already has Docket data',
    text: `Folder copy last saved ${data.savedAt ? fmtStamp(data.savedAt) : 'at an unknown time'}. This device last saved ${state.savedAt ? fmtStamp(state.savedAt) : 'never'}. Which one do you want to keep?`,
    confirm: 'Use folder data', cancel: 'Keep this device', danger: false,
    onConfirm: () => adopt(data, 'Loaded data from your sync folder'),
    onCancel: () => { fsWrite(); toast('Folder updated with this device’s data'); }
  });
}
function openFolderSheet() {
  openSheet(inner => {
    const draw = () => {
      let body;
      if (!FS.ok) {
        body = `<p class="sheet-text">This browser doesn’t let web pages save to a folder here.</p>`
          + `<p class="sheet-hint">Folder sync works in Chrome or Edge on a computer, and in Chrome 132 or newer on Android, when Docket is opened from an https:// address. The installable version will be. It doesn’t work in the preview or when the file is opened from your phone’s file manager.</p>`;
      } else {
        const status = FS.status === 'on' ? `Saving to “${esc(FS.handle.name)}”${FS.last ? ` · last written ${hhmm(FS.last)}` : ''}`
          : FS.status === 'paused' ? `Docket needs your permission to use “${esc(FS.handle.name)}” again.`
          : FS.status === 'error' ? esc(FS.err) : 'No folder chosen.';
        body = `<p class="sheet-text">Docket saves <span class="mono">${SYNC_FILE}</span> into this folder after every change. It loads the file when it starts, when you come back to it, and every 30 seconds, whenever the copy in the folder is newer. Point it at a Syncthing, Drive or Dropbox folder to share data between devices.</p>`
          + `<p class="sheet-hint" style="color:var(--ink-2)">${status}</p>`
          + `<div class="sheet-actions" style="justify-content:flex-start">`
          + (FS.handle && FS.status === 'paused' ? `<button type="button" class="btn primary" data-x="reconnect">Allow access</button>` : '')
          + `<button type="button" class="btn${FS.handle ? '' : ' primary'}" data-x="choose">${icon('folder')}${FS.handle ? 'Change folder' : 'Choose folder'}</button>`
          + (FS.handle && FS.status === 'on' ? `<button type="button" class="btn" data-x="sync">Sync now</button>` : '')
          + (FS.handle ? `<button type="button" class="btn danger" data-x="off">Disconnect</button>` : '')
          + `</div><p class="sheet-hint">If two devices change things at the same time, the version saved last wins.</p>`;
      }
      inner.innerHTML = `<h2 class="sheet-title sheet-drag">Sync folder</h2>${body}`;
    };
    fsSheetDraw = draw; draw();
    inner.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const x = b.dataset.x;
      if (x === 'choose') await fsChoose();
      else if (x === 'reconnect') await fsReconnect();
      else if (x === 'sync') { await fsPull(); await fsWrite(); toast('Synced'); }
      else if (x === 'off') { FS.handle = null; FS.status = 'off'; try { await kv('del', 'dir'); } catch (err) {} toast('Sync folder disconnected'); }
      if (fsSheetDraw) fsSheetDraw();
    });
  }, {cls: 'compact', onClose: () => { fsSheetDraw = null; }});
}

/* ================= sync to a private GitHub repository ================= */
/* The token lives only in this device's storage (never in the synced data). Fine-grained, one repo, Contents read+write. */
const GH_FILE = 'docket-data.json';
const GH = {repo: '', token: '', sha: null, status: 'off', err: '', last: 0, timer: 0, busy: false, again: false};
let ghSheetDraw = null;
function ghLoadCfg() {
  try { const c = JSON.parse(localStorage.getItem('docket.github') || 'null'); if (c && c.repo && c.token) { GH.repo = c.repo; GH.token = c.token; GH.status = 'on'; } } catch (e) {}
}
function ghSaveCfg() {
  try { if (GH.repo && GH.token) localStorage.setItem('docket.github', JSON.stringify({repo: GH.repo, token: GH.token})); else localStorage.removeItem('docket.github'); } catch (e) {}
}
const utf8ToB64 = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64ToUtf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = json => ({Authorization: `Bearer ${GH.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(json ? {'Content-Type': 'application/json'} : {})});
function ghError(status) {
  const e = new Error(status === 401 ? 'GitHub rejected the token. It may have expired: create a new one and connect again.'
    : status === 403 ? 'The token can’t write to this repository. Give it “Contents: Read and write” for this repo.'
    : status === 404 ? 'Repository not found. Check the name, and that the token has access to it.'
    : `GitHub answered ${status}. Docket will try again.`);
  e.fatal = status === 401 || status === 403 || status === 404;
  return e;
}
async function ghRead() {
  const res = await fetch(`https://api.github.com/repos/${GH.repo}/contents/${GH_FILE}`, {cache: 'no-store', headers: ghHeaders(false)});
  if (res.status === 404) { const repo = await fetch(`https://api.github.com/repos/${GH.repo}`, {cache: 'no-store', headers: ghHeaders(false)}); if (!repo.ok) throw ghError(repo.status); return null; }
  if (!res.ok) throw ghError(res.status);
  const j = await res.json();
  return {sha: j.sha, data: JSON.parse(b64ToUtf8(j.content))};
}
function ghFail(e) {
  GH.err = (e && e.message) || String(e);
  if (e && e.fatal) { GH.status = 'error'; toast('GitHub sync stopped: ' + GH.err); }
  if (ghSheetDraw) ghSheetDraw();
}
function ghHint() {
  if (GH.status === 'on') return GH.err ? 'Waiting to retry' : `Syncing with ${GH.repo}`;
  if (GH.status === 'error') return 'Problem: tap for details';
  return 'Off';
}
async function ghWrite(keepalive) {
  if (GH.status !== 'on') return;
  if (GH.busy) { GH.again = true; return; }
  GH.busy = true;
  try {
    const text = JSON.stringify(state, null, 1);
    const body = {message: `Docket sync · ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`, content: utf8ToB64(text)};
    if (GH.sha) body.sha = GH.sha;
    const put = () => fetch(`https://api.github.com/repos/${GH.repo}/contents/${GH_FILE}`, {method: 'PUT', headers: ghHeaders(true), body: JSON.stringify(body), keepalive: !!keepalive && text.length < 45000});
    let res = await put();
    if (res.status === 409 || res.status === 422) {
      /* the file changed elsewhere since we last read it: the newer save wins */
      const remote = await ghRead();
      if (remote) {
        GH.sha = remote.sha;
        const data = normalize(remote.data);
        if (data.savedAt > state.savedAt) { adopt(data, 'Loaded newer data from GitHub'); return; }
        body.sha = remote.sha;
      } else delete body.sha;
      res = await put();
    }
    if (!res.ok) throw ghError(res.status);
    GH.sha = (await res.json()).content.sha; GH.last = Date.now(); GH.err = '';
  } catch (e) { ghFail(e); }
  finally {
    GH.busy = false;
    if (GH.again) { GH.again = false; ghPushSoon(); }
    if (ghSheetDraw) ghSheetDraw();
  }
}
function ghPushSoon() { if (GH.status !== 'on') return; clearTimeout(GH.timer); GH.timer = setTimeout(() => { GH.timer = 0; ghWrite(); }, 4000); }
async function ghPull() {
  if (GH.status !== 'on' || GH.busy || GH.timer) return;
  try {
    const r = await ghRead();
    if (!r) { ghPushSoon(); return; }
    if (r.sha === GH.sha) return;
    const data = normalize(r.data);
    GH.sha = r.sha; GH.err = '';
    if (data.savedAt > state.savedAt) adopt(data, 'Loaded newer data from GitHub');
    else if (data.savedAt < state.savedAt) ghPushSoon();
  } catch (e) { ghFail(e); }
}
setInterval(() => { if (GH.status === 'on' && document.visibilityState === 'visible') ghPull(); }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && GH.timer) { clearTimeout(GH.timer); GH.timer = 0; ghWrite(true); }
  else if (document.visibilityState === 'visible') ghPull();
});
async function ghConnect(repo, token) {
  GH.repo = repo; GH.token = token; GH.sha = null; GH.err = '';
  const info = await fetch(`https://api.github.com/repos/${repo}`, {cache: 'no-store', headers: ghHeaders(false)});
  if (!info.ok) throw ghError(info.status);
  const meta = await info.json();
  if (!meta.private) throw Object.assign(new Error('That repository is public, so anyone could read your data. Make it private on GitHub, or use another repository.'), {fatal: true});
  GH.status = 'on'; ghSaveCfg();
  const remote = await ghRead();
  if (!remote) { await ghWrite(); toast(`Connected. Your data is now saved in ${repo}.`); return; }
  GH.sha = remote.sha;
  const data = normalize(remote.data);
  if (data.savedAt === state.savedAt) { toast('Connected'); return; }
  confirmSheet({
    title: 'This repository already has Docket data',
    text: `GitHub copy last saved ${data.savedAt ? fmtStamp(data.savedAt) : 'at an unknown time'}. This device last saved ${state.savedAt ? fmtStamp(state.savedAt) : 'never'}. Which one do you want to keep?`,
    confirm: 'Use GitHub data', cancel: 'Keep this device', danger: false,
    onConfirm: () => adopt(data, 'Loaded your data from GitHub'),
    onCancel: () => { ghWrite(); toast('GitHub updated with this device’s data'); }
  });
}
function openGitHubSheet() {
  openSheet(inner => {
    const draw = () => {
      if (GH.status === 'on' || (GH.status === 'error' && GH.repo)) {
        inner.innerHTML = `<h2 class="sheet-title sheet-drag">GitHub sync</h2>`
          + `<p class="sheet-text">Docket saves <span class="mono">${GH_FILE}</span> to <b>${esc(GH.repo)}</b> a few seconds after each change, and checks it when the app starts, when you come back to it, and every 30 seconds.</p>`
          + `<p class="sheet-hint" style="color:var(--ink-2)">${GH.status === 'error' ? esc(GH.err) : GH.err ? 'Last attempt failed: ' + esc(GH.err) : GH.last ? 'Last saved ' + fmtStamp(GH.last) : 'Connected'}</p>`
          + `<div class="sheet-actions" style="justify-content:flex-start">${GH.status === 'error' ? `<button type="button" class="btn primary" data-x="retry">Try again</button>` : `<button type="button" class="btn" data-x="sync">Sync now</button>`}`
          + `<button type="button" class="btn danger" data-x="off">Disconnect this device</button></div>`
          + `<p class="sheet-hint">Disconnecting removes the token from this device only. Your data stays in the repository.</p>`;
      } else {
        inner.innerHTML = `<h2 class="sheet-title sheet-drag">GitHub sync</h2>`
          + `<p class="sheet-text">Keep your data in a private GitHub repository so your phone and computer stay in sync. Set it up once on each device.</p>`
          + `<ol class="steps"><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → new fine-grained token</a>.</li>`
          + `<li><b>Repository access</b>: Only select repositories → <span class="mono">docket-data</span>.</li>`
          + `<li><b>Permissions</b> → Repository permissions → <b>Contents: Read and write</b>.</li>`
          + `<li>Generate the token, copy it and paste it below.</li></ol>`
          + `<form class="form-grid" novalidate><div class="fld full"><label for="gh-repo">Repository</label><input id="gh-repo" class="field" value="${esc(GH.repo || 'EthEcho-UI/docket-data')}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`
          + `<div class="fld full"><label for="gh-token">Token</label><input id="gh-token" class="field" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></div>`
          + `<div class="full sheet-actions" style="margin-top:4px"><button type="submit" class="btn primary">Connect</button></div></form>`
          + `<p class="sheet-hint" id="gh-msg" aria-live="polite">${GH.status === 'error' ? esc(GH.err) : 'The token is stored only on this device.'}</p>`;
      }
    };
    ghSheetDraw = draw; draw();
    inner.addEventListener('submit', async e => {
      e.preventDefault();
      const repo = $('#gh-repo', inner).value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, ''), token = $('#gh-token', inner).value.trim();
      const msg = $('#gh-msg', inner);
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { msg.textContent = 'Write the repository as owner/name, for example EthEcho-UI/docket-data.'; return; }
      if (token.length < 20) { msg.textContent = 'Paste the whole token.'; return; }
      msg.textContent = 'Connecting…';
      try { await ghConnect(repo, token); draw(); }
      catch (err) { GH.status = 'off'; GH.token = ''; ghSaveCfg(); msg.textContent = err.message; }
    });
    inner.addEventListener('click', async e => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'sync') { await ghPull(); if (GH.status === 'on' && !GH.timer) await ghWrite(); toast('Synced'); }
      else if (x.dataset.x === 'retry') { GH.status = 'on'; GH.err = ''; await ghPull(); }
      else if (x.dataset.x === 'off') { clearTimeout(GH.timer); Object.assign(GH, {repo: '', token: '', sha: null, status: 'off', err: '', timer: 0}); ghSaveCfg(); toast('GitHub sync turned off on this device'); }
      draw();
    });
  }, {cls: 'compact', onClose: () => { ghSheetDraw = null; }});
}

/* ================= time panel: focus / hours ================= */
const RING_C = 2 * Math.PI * 88;
let timeDraw = null;

function periodRange(kind, from, to) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(), dt = d.getDate(), wd = (d.getDay() + 6) % 7;
  switch (kind) {
    case 'lastweek': return [new Date(y, m, dt - wd - 7).getTime(), new Date(y, m, dt - wd).getTime()];
    case 'month': return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()];
    case 'lastmonth': return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()];
    case 'custom': {
      const f = from ? parseISO(from) : new Date(y, m, 1).getTime();
      const t = to ? parseISO(to) + 864e5 : new Date(y, m, dt + 1).getTime();
      return [f, Math.max(t, f + 864e5)];
    }
    default: return [new Date(y, m, dt - wd).getTime(), new Date(y, m, dt - wd + 7).getTime()];
  }
}
const entryMs = (e, now = Date.now()) => (e.end ?? now) - e.start;
function earnings(list) {
  const by = {};
  for (const e of list) { const j = jobById(e.jobId); if (j && j.rate) by[j.currency || ''] = (by[j.currency || ''] || 0) + entryMs(e) / 36e5 * j.rate; }
  return Object.entries(by).map(([cur, v]) => `${v.toLocaleString(undefined, {maximumFractionDigits: 0})}${cur ? ' ' + cur : ''}`).join(' · ');
}
function jobOptions(sel, noneLabel = 'No job') {
  return `<option value="">${esc(noneLabel)}</option>` + state.jobs.map(j => `<option value="${j.id}"${j.id === sel ? ' selected' : ''}>${esc(j.name)}</option>`).join('');
}
const workJob = () => jobById(state.settings.workJob) || state.jobs[0] || null;
/* a "task" = every entry with the same card, or the same name, inside one job */
const taskKey = e => e.cardId ? 'c:' + e.cardId : 't:' + (e.title || '').trim().toLowerCase();
function tasksForJob(jobId) {
  const map = new Map(), now = Date.now();
  for (const e of state.entries) {
    if ((e.jobId || null) !== jobId) continue;
    const k = taskKey(e);
    let t = map.get(k);
    if (!t) { t = {key: k, title: entryLabel(e), cardId: e.cardId || null, total: 0, last: 0, live: null}; map.set(k, t); }
    t.total += entryMs(e, now);
    if (e.start > t.last) { t.last = e.start; t.title = entryLabel(e); }
    if (e.end == null) t.live = e;
  }
  /* tasks added without starting a timer */
  for (const w of state.wtasks) {
    if (w.jobId !== jobId) continue;
    const k = wKey(w);
    if (!map.has(k)) { const f = findCard(w.cardId); map.set(k, {key: k, title: f ? f.card.title : w.title, cardId: w.cardId, total: 0, last: w.created, live: null, fresh: true}); }
  }
  return [...map.values()].sort((a, b) => (b.live ? 1 : 0) - (a.live ? 1 : 0) || b.last - a.last);
}
const wKey = w => w.cardId ? 'c:' + w.cardId : 't:' + w.title.trim().toLowerCase();
function addWorkTask(jobId, title) {
  const key = 't:' + title.toLowerCase();
  if (tasksForJob(jobId).some(t => t.key === key)) return false;
  state.wtasks.push({id: uid(), jobId, title, cardId: null, created: Date.now()});
  return true;
}
/* link (or unlink) every entry of a work task to a card; returns the task's new key */
function linkTask(j, key, cardId) {
  const t = tasksForJob(j.id).find(x => x.key === key); if (!t) return key;
  const match = x => (x.jobId || null) === j.id && taskKey(x) === key;
  const w = state.wtasks.find(x => x.jobId === j.id && wKey(x) === key);
  if (cardId) {
    const f = findCard(cardId); if (!f) return key;
    state.entries.forEach(e => { if (match(e)) { e.cardId = cardId; if (!e.title) e.title = t.title; } });
    if (w) w.cardId = cardId; else state.wtasks.push({id: uid(), jobId: j.id, title: t.title, cardId, created: Date.now()});
    if (jobForCard(cardId) !== j.id) f.card.jobId = j.id;
    return 'c:' + cardId;
  }
  const title = t.title;
  state.entries.forEach(e => { if (match(e)) { e.cardId = null; e.title = title; } });
  if (w) { w.cardId = null; w.title = title; } else state.wtasks.push({id: uid(), jobId: j.id, title, cardId: null, created: Date.now()});
  return 't:' + title.trim().toLowerCase();
}
function cardOptionsHTML(sel) {
  return state.categories.map(c => {
    const opts = c.lists.flatMap(l => l.cards.filter(k => !k.done || k.id === sel).map(k => `<option value="${k.id}"${k.id === sel ? ' selected' : ''}>${esc(k.title)}</option>`));
    return opts.length ? `<optgroup label="${esc(c.name)}">${opts.join('')}</optgroup>` : '';
  }).join('');
}
function relDay(ts) {
  const k = dayKey(ts);
  if (k === isoDay(0)) return 'Today ' + hhmm(ts);
  if (k === isoDay(-1)) return 'Yesterday';
  return fmtDate(ts, Date.now() - ts > 300 * 864e5);
}
function continueTask(key) {
  const j = workJob(); if (!j) return;
  const t = tasksForJob(j.id).find(x => x.key === key); if (!t) return;
  startTracking({cardId: t.cardId, jobId: j.id, title: t.title});
  haptic('tap'); commit();
  toast(`Continuing “${t.title}”`);
}

function focusHTML() {
  const p = pr(), s = state.pomo, now = Date.now();
  const ph = p.phase === 'idle' ? 'work' : p.phase;
  const left = pomoLeft(now), dur = pomoDur(ph);
  const isRunning = !!p.endsAt;
  const fresh = !isRunning && (p.left == null || p.left === pomoDur(p.phase));
  const main = p.phase === 'idle' ? 'Start focus' : isRunning ? 'Pause' : fresh ? `Start ${P_NAMES[p.phase].toLowerCase()}` : 'Resume';
  const done = p.round % s.every || (p.round && p.phase === 'long' ? s.every : 0);
  const dots = Array.from({length: s.every}, (_, i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('');
  const cardOpts = state.categories.map(c => {
    const opts = c.lists.flatMap(l => l.cards.filter(k => !k.done || k.id === p.cardId).map(k => `<option value="${k.id}"${k.id === p.cardId ? ' selected' : ''}>${esc(k.title)}</option>`));
    return opts.length ? `<optgroup label="${esc(c.name)}">${opts.join('')}</optgroup>` : '';
  }).join('');
  const linkedJob = p.cardId ? jobById(jobForCard(p.cardId)) : null;
  const num = (k, label, max) => `<div class="fld"><label for="ps-${k}">${label}</label><input id="ps-${k}" class="field" type="number" inputmode="numeric" min="1" max="${max}" value="${s[k]}" data-ps="${k}"></div>`;
  const ns = notifStatus();
  return `<div class="pomo ${p.phase}">`
    + `<div class="pomo-ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88"/><circle class="bar" cx="100" cy="100" r="88" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${(RING_C * (1 - left / dur)).toFixed(1)}" data-pomo-ring/></svg>`
    + `<div class="pomo-center"><div class="pomo-phase">${P_NAMES[p.phase]}</div><div class="pomo-time" data-pomo-left role="timer">${clock(left)}</div><div class="pomo-dots" aria-label="${done} of ${s.every} focus sessions before a long break">${dots}</div></div></div>`
    + `<div class="pomo-ctrl"><button type="button" class="icon-btn lg" data-t="pomo-reset" aria-label="Reset timer"${p.phase === 'idle' ? ' disabled' : ''}>${icon('reset')}</button>`
    + `<button type="button" class="btn primary pomo-main" data-t="pomo-toggle">${icon(isRunning ? 'pause' : 'play')}${main}</button>`
    + `<button type="button" class="icon-btn lg" data-t="pomo-skip" aria-label="Skip to the next phase"${p.phase === 'idle' ? ' disabled' : ''}>${icon('skip')}</button></div>`
    + `<div class="form-grid pomo-link">`
    + `<div class="fld full"><label for="pomo-card">Focus on</label><span class="select-wrap block"><select id="pomo-card" class="select"><option value="">Nothing specific</option>${cardOpts}</select></span></div>`
    + (p.cardId
      ? `<p class="sheet-hint full" style="margin:0">Focus time is logged on this card${linkedJob ? ` and counts toward ${esc(linkedJob.name)}` : ''}.</p>`
      : `<div class="fld full"><label for="pomo-job">Log focus time to</label><span class="select-wrap block"><select id="pomo-job" class="select">${jobOptions(p.jobId, 'Don’t log')}</select></span></div>`)
    + `</div>`
    + `<details class="pomo-set"${ui.pomoSetOpen ? ' open' : ''}><summary>Timer settings</summary><div class="form-grid">`
    + num('work', 'Focus, min', 180) + num('short', 'Short break, min', 60) + num('long', 'Long break, min', 90) + num('every', 'Long break after', 12)
    + `<label class="toggle full"><span>Start the next phase automatically</span><input type="checkbox" data-pt="autoNext"${s.autoNext ? ' checked' : ''}><span class="switch"></span></label>`
    + `<label class="toggle full"><span>Chime when a phase ends</span><input type="checkbox" data-pt="sound"${s.sound ? ' checked' : ''}><span class="switch"></span></label>`
    + `<div class="toggle full"><span>Notifications<small>${NOTIF_TEXT[ns]}${ns !== 'on' ? ' · on Android they need the installed app' : ''}</small></span>`
    + (ns === 'unavailable' || ns === 'blocked' ? '' : `<button type="button" class="btn sm" data-t="notif">${ns === 'on' ? 'Turn off' : 'Turn on'}</button>`) + `</div>`
    + `</div></details></div>`;
}

const fmtMoney = (v, cur, dp = 0) => `${v.toLocaleString(undefined, {minimumFractionDigits: dp, maximumFractionDigits: dp})}${cur ? ' ' + cur : ''}`;
/* a money figure that keeps counting while the entry's timer runs (ticker updates it every second) */
function liveEarnHTML(e, base = 0) {
  const j = jobById(e.jobId); if (!j || !j.rate) return '';
  const rate = j.rate / 36e5;
  return `<span class="earn-live" data-earn-since="${e.start}" data-earn-base="${base}" data-earn-rate="${rate}" data-cur="${esc(j.currency)}">${fmtMoney(base + (Date.now() - e.start) * rate, j.currency, 2)}</span>`;
}

function taskRowHTML(t, now) {
  const live = t.live;
  const sub = live ? `Running now${jobById(live.jobId) && jobById(live.jobId).rate ? ' · ' + liveEarnHTML(live) : ''}` : t.fresh ? 'Not started yet' : relDay(t.last);
  return `<div class="task-row${live ? ' live' : ''}"><button type="button" class="entry" data-t="task" data-k="${esc(t.key)}">`
    + `<span class="t"><b>${esc(t.title)}</b><small>${sub}${t.cardId ? ` · ${icon('checklist')}card` : ''}</small></span>`
    + `<span class="d">${live ? `<span data-since="${live.start}" data-base="${t.total - (now - live.start)}">${clock(t.total)}</span>` : t.total ? fmtHM(t.total) : ''}</span></button>`
    + (live ? `<button type="button" class="play stop" data-t="track-stop" aria-label="Stop ${esc(t.title)}">${icon('stop')}</button>`
            : `<button type="button" class="play" data-t="task-go" data-k="${esc(t.key)}" aria-label="${t.fresh ? 'Start' : 'Continue'} ${esc(t.title)}">${icon('play')}</button>`)
    + `</div>`;
}

function hoursHTML() {
  if (!state.jobs.length) {
    return `<div class="empty">Add a job to track your work hours.<br>You can manage jobs any time in Settings → Jobs.</div>`
      + `<div class="sheet-actions" style="justify-content:center"><button type="button" class="btn primary" data-t="job-add">${icon('plus')}Add a job</button></div>`;
  }
  const j = workJob(), now = Date.now(), r = running();
  const tasks = tasksForJob(j.id), shown = ui.allTasks ? tasks : tasks.slice(0, 6);
  const per = state.settings.workPeriod;
  const [from, to] = periodRange(per, ui.hours.from, ui.hours.to);
  const list = state.entries.filter(e => e.jobId === j.id && e.start >= from && e.start < to).sort((a, b) => b.start - a.start);
  const total = list.reduce((s, e) => s + entryMs(e, now), 0);
  const runningHere = r && r.jobId === j.id && list.includes(r) && j.rate;
  const finishedMoney = j.rate ? list.filter(e => e.end != null).reduce((s, e) => s + (e.end - e.start) / 36e5 * j.rate, 0) : 0;
  const earn = runningHere ? liveEarnHTML(r, finishedMoney) : j.rate ? esc(fmtMoney(finishedMoney, j.currency)) : '';
  const groups = new Map();
  list.forEach(e => { const k = dayKey(e.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  const days = [...groups].map(([k, es]) => `<div class="day"><div class="day-head"><span>${fmtDay(k)}</span><span>${fmtHM(es.reduce((s, e) => s + entryMs(e, now), 0))}</span></div>`
    + es.map(e => {
      const live = e.end == null;
      return `<button type="button" class="entry${live ? ' live' : ''}" data-t="entry" data-e="${e.id}">`
        + `<span class="t"><b>${esc(entryLabel(e))}</b><small>${hhmm(e.start)}–${live ? 'now' : hhmm(e.end)}${e.note ? ` · ${esc(e.note)}` : ''}</small></span>`
        + `<span class="d">${live ? `<span data-since="${e.start}">${clock(now - e.start)}</span>` : fmtHM(e.end - e.start)}</span></button>`;
    }).join('') + `</div>`).join('');
  const other = r && (r.jobId || null) !== j.id ? r : null;
  const oj = other && jobById(other.jobId);
  const label = (PERIODS.find(p => p[0] === per) || PERIODS[0])[1].toLowerCase();
  return `<div class="chips" role="group" aria-label="Job">` + state.jobs.map(x => `<button type="button" class="fchip${x.id === j.id ? ' on' : ''}" data-t="job-pick" data-k="${x.id}"><span class="tab-dot" style="--c:var(--l-${x.color})"></span>${esc(x.name)}</button>`).join('') + `</div>`
    + (other ? `<div class="run-banner"><span class="live-dot"></span><span class="t"><b>${esc(entryLabel(other))}</b><small>Running${oj ? ' for ' + esc(oj.name) : ''}${oj && oj.rate ? ' · ' + liveEarnHTML(other) : ''}</small></span>`
      + `<span class="d" data-since="${other.start}">${clock(now - other.start)}</span><button type="button" class="play stop" data-t="track-stop" aria-label="Stop">${icon('stop')}</button></div>` : '')
    + `<form class="task-new" data-form="task" novalidate><input id="task-input" class="field" placeholder="What are you working on?" maxlength="120" autocomplete="off" enterkeyhint="go" aria-label="New task for ${esc(j.name)}">`
    + `<button type="button" class="icon-btn add-only" data-t="task-add" aria-label="Add the task without starting it" title="Add without starting">${icon('plus')}</button>`
    + `<button type="submit" class="btn primary">${icon('play')}Start</button></form>`
    + `<div class="sec-head"><h3>Tasks</h3>${tasks.length > 6 ? `<button type="button" class="link" data-t="all-tasks">${ui.allTasks ? 'Show recent' : `Show all ${tasks.length}`}</button>` : ''}</div>`
    + (shown.length ? shown.map(t => taskRowHTML(t, now)).join('') : `<p class="empty sm">No tasks yet. Type one above: <b>+</b> adds it for later, <b>Start</b> starts the clock.</p>`)
    + `<div class="sec-head"><h3>Hours</h3></div>`
    + `<div class="chips wrap" role="group" aria-label="Period">${PERIODS.map(([k, n]) => `<button type="button" class="fchip${per === k ? ' on' : ''}" data-t="period" data-k="${k}">${n}</button>`).join('')}</div>`
    + (per === 'custom' ? `<div class="hrs-range"><input id="hrs-from" type="date" class="field" value="${esc(ui.hours.from)}" aria-label="From"><span class="muted">to</span><input id="hrs-to" type="date" class="field" value="${esc(ui.hours.to)}" aria-label="To"></div>` : '')
    + `<div class="hrs-summary"><div><div class="hrs-big">${fmtHM(total)}</div><div class="mono muted hrs-sub">${(total / 36e5).toFixed(2)} h · ${label}</div></div>${earn ? `<div class="hrs-earn">${earn}</div>` : ''}</div>`
    + `<div class="hrs-actions"><button type="button" class="btn" data-t="add-entry">${icon('plus')}Add past time</button><button type="button" class="btn" data-t="export">${icon('sheet')}Export</button></div>`
    + (days || `<div class="empty">Nothing logged in this period.</div>`);
}

/* ---------- stats ---------- */
/* chart series: dataviz reference palette (validated), assigned by job order so a job keeps its color */
const SERIES = {light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7'], dark: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9']};
const SERIES_OTHER = {light: '#8a8f99', dark: '#6b7079'};
function themeIsDark() {
  const t = state.settings.theme, sk = SKINS[t];
  if (sk) return sk.base === 'dark';
  if (t === 'dark' || t === 'light') return t === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function statsRange(period, offset) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(), dt = d.getDate(), wd = (d.getDay() + 6) % 7;
  if (period === 'week') {
    const day = i => new Date(y, m, dt - wd + offset * 7 + i);
    return {from: day(0).getTime(), to: day(7).getTime(), title: `${fmtDate(day(0).getTime())} – ${fmtDate(day(6).getTime(), true)}`,
      buckets: Array.from({length: 7}, (_, i) => ({from: day(i).getTime(), to: day(i + 1).getTime(), label: day(i).toLocaleDateString(undefined, {weekday: 'narrow'}), full: day(i).toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'})}))};
  }
  if (period === 'year') {
    const yy = y + offset, mo = i => new Date(yy, i, 1);
    return {from: mo(0).getTime(), to: mo(12).getTime(), title: String(yy),
      buckets: Array.from({length: 12}, (_, i) => ({from: mo(i).getTime(), to: mo(i + 1).getTime(), label: mo(i).toLocaleDateString(undefined, {month: 'narrow'}), full: mo(i).toLocaleDateString(undefined, {month: 'long', year: 'numeric'})}))};
  }
  const ms = new Date(y, m + offset, 1), yy = ms.getFullYear(), mm = ms.getMonth(), n = new Date(yy, mm + 1, 0).getDate();
  return {from: ms.getTime(), to: new Date(yy, mm + 1, 1).getTime(), title: ms.toLocaleDateString(undefined, {month: 'long', year: 'numeric'}),
    buckets: Array.from({length: n}, (_, i) => { const a = new Date(yy, mm, i + 1); return {from: a.getTime(), to: new Date(yy, mm, i + 2).getTime(), label: i === 0 || (i + 1) % 5 === 0 ? String(i + 1) : '', full: a.toLocaleDateString(undefined, {weekday: 'short', day: 'numeric', month: 'short'})}; })};
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
/* columns, optionally stacked: thin bars, 4px rounded tops, 2px gaps between stacked parts, hairline grid, one axis */
function columnChart({buckets, series, fmt, tick, label}) {
  const W = 340, H = 160, L = 34, R = 4, T = 12, B = 20, pw = W - L - R, ph = H - T - B, n = buckets.length, band = pw / n;
  const totals = buckets.map((_, i) => series.reduce((s, se) => s + se.values[i], 0));
  const max = niceMax(Math.max(...totals));
  const bw = Math.max(3, Math.min(22, band * 0.62));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  [0, max / 2, max].forEach(v => {
    const y = (T + ph - v / max * ph).toFixed(1);
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${(+y + 3).toFixed(1)}" text-anchor="end">${tick(v)}</text>`;
  });
  buckets.forEach((b, i) => {
    const x = L + band * i + (band - bw) / 2;
    let y0 = T + ph;
    const segs = series.map(se => ({se, v: se.values[i]})).filter(s => s.v > 0);
    segs.forEach((s, si) => {
      const h = s.v / max * ph, y = y0 - h, hh = Math.max(0.5, h - (si > 0 ? 2 : 0));
      if (si === segs.length - 1) {
        const r = Math.min(4, bw / 2, hh);
        svg += `<path fill="${s.se.color}" d="M${x.toFixed(1)},${(y + hh).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${(y + hh).toFixed(1)}Z"/>`;
      } else svg += `<rect fill="${s.se.color}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}"/>`;
      y0 = y;
    });
    if (b.label) svg += `<text class="ax" x="${(L + band * i + band / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${esc(b.label)}</text>`;
    const tip = `${b.full}: ${fmt(totals[i])}` + (series.length > 1 && segs.length ? ' (' + segs.map(s => `${s.se.name} ${fmt(s.v)}`).join(', ') + ')' : '');
    svg += `<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ph + B}" data-tip="${esc(tip)}" data-cx="${((L + band * i + band / 2) / W).toFixed(4)}"/>`;
  });
  svg += `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/></svg>`;
  return `<div class="chart">${svg}<div class="tip" hidden></div></div>`;
}
const hTick = v => v === 0 ? '0' : v < 1 ? `${Math.round(v * 60)}m` : `${+v.toFixed(1)}h`;
const mTick = v => v === 0 ? '0' : v >= 1e6 ? `${+(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(Math.round(v));

function statsHTML() {
  const s = ui.stats, now = Date.now(), dark = themeIsDark(), PAL = SERIES[dark ? 'dark' : 'light'], OTHER = SERIES_OTHER[dark ? 'dark' : 'light'];
  const jobChips = `<div class="chips" role="group" aria-label="Job">` + [['all', 'All jobs', null], ...state.jobs.map(j => [j.id, j.name, j.color])].map(([k, n, c]) =>
    `<button type="button" class="fchip${s.job === k ? ' on' : ''}" data-t="st-job" data-k="${k}">${c ? `<span class="tab-dot" style="--c:var(--l-${c})"></span>` : ''}${esc(n)}</button>`).join('') + `</div>`;
  const periodSeg = `<div class="seg seg-sm" role="group" aria-label="Period">${[['week', 'Week'], ['month', 'Month'], ['year', 'Year']].map(([k, n]) => `<button type="button" class="${s.period === k ? 'on' : ''}" data-t="st-period" data-k="${k}">${n}</button>`).join('')}</div>`;
  const R = statsRange(s.period, s.offset);
  const nav = `<div class="st-nav"><button type="button" class="icon-btn" data-t="st-prev" aria-label="Previous">${icon('arrowL')}</button><b>${esc(R.title)}</b><button type="button" class="icon-btn" data-t="st-next" aria-label="Next"${s.offset >= 0 ? ' disabled' : ''}>${icon('arrowR')}</button></div>`;
  const inJob = e => s.job === 'all' || e.jobId === s.job;
  const inRange = (e, a, b) => e.start >= a && e.start < b;
  const list = state.entries.filter(e => inJob(e) && inRange(e, R.from, R.to));
  const ms = list.reduce((a, e) => a + entryMs(e, now), 0);
  const prevR = statsRange(s.period, s.offset - 1);
  const prevMs = state.entries.filter(e => inJob(e) && inRange(e, prevR.from, prevR.to)).reduce((a, e) => a + entryMs(e, now), 0);
  /* earnings: in the currency that has the most money; others are noted, never added together */
  const moneyBy = es => { const by = {}; es.forEach(e => { const j = jobById(e.jobId); if (j && j.rate) by[j.currency || ''] = (by[j.currency || ''] || 0) + entryMs(e, now) / 36e5 * j.rate; }); return by; };
  const allMoney = moneyBy(state.entries.filter(inJob));
  const curs = Object.keys(allMoney).sort((a, b) => allMoney[b] - allMoney[a]);
  const cur = curs[0] ?? null;
  const money = cur == null ? 0 : (moneyBy(list)[cur] || 0);
  const days = new Set(list.map(e => dayKey(e.start))).size;
  const per = {week: 'last week', month: 'last month', year: 'last year'}[s.period];
  const diff = ms - prevMs;
  const delta = prevMs || ms ? `${diff >= 0 ? '▲' : '▼'} ${fmtHM(Math.abs(diff))} vs ${per}` : '';
  const tiles = `<div class="tiles">`
    + `<div class="tile"><div class="k">Hours</div><div class="v">${fmtHM(ms)}</div><div class="s">${delta}</div></div>`
    + `<div class="tile"><div class="k">Earned</div><div class="v">${cur == null ? '–' : esc(fmtMoney(money, cur))}</div><div class="s">${cur == null ? 'Set an hourly rate in Settings → Jobs' : curs.length > 1 ? `Only ${esc(cur || 'no currency')} shown` : `${(ms / 36e5).toFixed(2)} h`}</div></div>`
    + `<div class="tile"><div class="k">Days worked</div><div class="v">${days}</div><div class="s">of ${R.buckets.length} ${s.period === 'year' ? 'months' : 'days'}</div></div>`
    + `<div class="tile"><div class="k">Per worked day</div><div class="v">${days ? fmtHM(ms / days) : '–'}</div><div class="s">${days && cur != null ? esc(fmtMoney(money / days, cur)) + ' a day' : ''}</div></div>`
    + `</div>`;
  if (!list.length && !state.entries.length) return jobChips + periodSeg + nav + `<div class="empty">Log some work time first, then your hours and earnings show up here.</div>`;

  /* hours chart: one series, or stacked by job (entity order, max 7 + Other) */
  const jobsHere = state.jobs.filter(j => list.some(e => e.jobId === j.id));
  const hasOther = list.some(e => !e.jobId || state.jobs.findIndex(j => j.id === e.jobId) >= 7);
  let series;
  if (s.job !== 'all' || jobsHere.length + (hasOther ? 1 : 0) <= 1) series = [{name: 'Hours', color: PAL[0], match: () => true}];
  else series = jobsHere.filter(j => state.jobs.indexOf(j) < 7).map(j => ({name: j.name, color: PAL[state.jobs.indexOf(j)], match: e => e.jobId === j.id}))
    .concat(hasOther ? [{name: 'Other', color: OTHER, match: e => !e.jobId || state.jobs.findIndex(j => j.id === e.jobId) >= 7}] : []);
  series.forEach(se => { se.values = R.buckets.map(b => list.filter(e => se.match(e) && inRange(e, b.from, b.to)).reduce((a, e) => a + entryMs(e, now) / 36e5, 0)); });
  const legend = series.length > 1 ? `<div class="legend">${series.map(se => `<span><i style="--c:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>` : '';
  const hoursChart = `<div class="sec-head"><h3>Hours per ${s.period === 'year' ? 'month' : 'day'}</h3></div>` + legend
    + columnChart({buckets: R.buckets, series, fmt: v => fmtHM(v * 36e5), tick: hTick, label: `Hours per ${s.period === 'year' ? 'month' : 'day'}, ${R.title}`});

  /* earnings trend: the last few periods, ending with the one shown */
  let earnChart = '';
  if (cur != null) {
    const N = {week: 8, month: 6, year: 5}[s.period];
    const trend = Array.from({length: N}, (_, i) => statsRange(s.period, s.offset - (N - 1 - i)));
    const vals = trend.map(t => moneyBy(state.entries.filter(e => inJob(e) && inRange(e, t.from, t.to)))[cur] || 0);
    const lab = t => s.period === 'week' ? new Date(t.from).toLocaleDateString(undefined, {day: 'numeric', month: 'numeric'}) : s.period === 'month' ? new Date(t.from).toLocaleDateString(undefined, {month: 'short'}) : t.title;
    earnChart = `<div class="sec-head"><h3>Earned per ${s.period}${cur ? ` · ${esc(cur)}` : ''}</h3></div>`
      + columnChart({buckets: trend.map(t => ({label: lab(t), full: t.title})), series: [{name: 'Earned', color: PAL[0], values: vals}], fmt: v => fmtMoney(v, cur), tick: mTick, label: `Earnings per ${s.period}`});
  }

  /* table view: per job and top tasks */
  const rows = state.jobs.map(j => ({j, ms: list.filter(e => e.jobId === j.id).reduce((a, e) => a + entryMs(e, now), 0)})).filter(x => x.ms > 0).sort((a, b) => b.ms - a.ms);
  const noJob = list.filter(e => !e.jobId).reduce((a, e) => a + entryMs(e, now), 0);
  const jobTable = rows.length || noJob ? `<div class="sec-head"><h3>By job</h3></div><table class="st-table"><thead><tr><th>Job</th><th class="n">Hours</th><th class="n">Earned</th></tr></thead><tbody>`
    + rows.map(x => `<tr><td><span class="tab-dot" style="--c:var(--l-${x.j.color});display:inline-block;margin-right:8px"></span>${esc(x.j.name)}<div class="share"><i style="width:${(x.ms / ms * 100).toFixed(1)}%;--c:var(--l-${x.j.color})"></i></div></td><td class="n">${fmtHM(x.ms)}</td><td class="n">${x.j.rate ? esc(fmtMoney(x.ms / 36e5 * x.j.rate, x.j.currency)) : '–'}</td></tr>`).join('')
    + (noJob ? `<tr><td>No job</td><td class="n">${fmtHM(noJob)}</td><td class="n">–</td></tr>` : '') + `</tbody></table>` : '';
  const tmap = new Map();
  list.forEach(e => { const k = (e.jobId || '') + '|' + taskKey(e); const t = tmap.get(k) || {title: entryLabel(e), job: jobById(e.jobId), ms: 0}; t.ms += entryMs(e, now); tmap.set(k, t); });
  const top = [...tmap.values()].sort((a, b) => b.ms - a.ms).slice(0, 5);
  const topTable = top.length ? `<div class="sec-head"><h3>Top tasks</h3></div><table class="st-table"><tbody>`
    + top.map(t => `<tr><td>${esc(t.title)}${s.job === 'all' && t.job ? `<div class="mono muted" style="font-size:12px;margin-top:2px">${esc(t.job.name)}</div>` : ''}</td><td class="n">${fmtHM(t.ms)}</td></tr>`).join('') + `</tbody></table>` : '';

  return jobChips + periodSeg + nav + tiles + (list.length ? hoursChart : `<div class="empty">Nothing logged in ${esc(R.title)}.</div>`) + earnChart + jobTable + topTable;
}

function openTimePanel(tab) {
  if (tab) ui.timeTab = tab;
  if (!['focus', 'hours', 'stats'].includes(ui.timeTab)) ui.timeTab = 'hours';
  openSheet((inner, close) => {
    const back = () => openTimePanel(ui.timeTab);
    const draw = () => {
      const st = inner.scrollTop;
      inner.innerHTML = `<div class="time-top sheet-drag"><div class="seg" role="tablist">` + [['focus', 'Focus'], ['hours', 'Hours'], ['stats', 'Stats']].map(([k, n]) =>
          `<button type="button" role="tab" aria-selected="${ui.timeTab === k}" class="${ui.timeTab === k ? 'on' : ''}" data-t="tab" data-k="${k}">${n}</button>`).join('')
        + `</div></div>`
        + (ui.timeTab === 'focus' ? focusHTML() : ui.timeTab === 'hours' ? hoursHTML() : statsHTML());
      inner.scrollTop = st;
    };
    timeDraw = draw; draw();
    const taskTitle = () => { const inp = $('#task-input', inner); return inp ? inp.value.replace(/\s+/g, ' ').trim() : ''; };
    const showTip = hit => {
      const ch = hit.closest('.chart'), tip = $('.tip', ch);
      tip.textContent = hit.dataset.tip; tip.hidden = false;
      const cw = ch.clientWidth, tw = tip.offsetWidth;
      tip.style.left = Math.min(cw - tw / 2, Math.max(tw / 2, cw * +hit.dataset.cx)) + 'px';
      $$('.hit.on', ch).forEach(h => h.classList.remove('on')); hit.classList.add('on');
    };
    inner.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') showTip(h); });
    inner.addEventListener('pointerout', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') { const tip = $('.tip', h.closest('.chart')); tip.hidden = true; h.classList.remove('on'); } });
    inner.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('pomo-set')) ui.pomoSetOpen = e.target.open; }, true);
    inner.addEventListener('submit', e => {
      if (!e.target.matches('[data-form="task"]')) return;
      e.preventDefault();
      const j = workJob(), title = taskTitle();
      if (!j || !title) { $('#task-input', inner).focus(); return; }
      unlockAudio(); haptic('tap');
      startTracking({jobId: j.id, title});
      commit(); draw();
      toast(`Started “${title}”`);
    });
    inner.addEventListener('click', e => {
      const hit = e.target.closest('.hit'); if (hit) { showTip(hit); return; }
      const b = e.target.closest('[data-t]'); if (!b || b.disabled) return;
      switch (b.dataset.t) {
        case 'tab': ui.timeTab = b.dataset.k; haptic('select'); draw(); inner.scrollTop = 0; return;
        case 'pomo-toggle': haptic('tap'); pomoToggle(); break;
        case 'pomo-skip': haptic('tap'); pomoAdvance(false); break;
        case 'pomo-reset': haptic('tap'); pomoReset(); break;
        case 'notif': (notifStatus() === 'on' ? disableNotifications() : enableNotifications()).then(draw); return;
        case 'job-pick': state.settings.workJob = b.dataset.k; ui.allTasks = false; haptic('select'); commit(); break;
        case 'job-add': openJobEditor(null, {back}); return;
        case 'task-add': {
          const j = workJob(), title = taskTitle();
          if (!j || !title) { $('#task-input', inner).focus(); return; }
          if (addWorkTask(j.id, title)) { haptic('select'); commit(); toast(`Added “${title}”. Press ▶ when you start.`); }
          else toast(`“${title}” is already in your tasks`);
          break;
        }
        case 'all-tasks': ui.allTasks = !ui.allTasks; break;
        case 'task': openTaskSheet(b.dataset.k); return;
        case 'task-go': unlockAudio(); continueTask(b.dataset.k); break;
        case 'track-stop': haptic('tap'); stopTracking(); commit(); break;
        case 'period':
          state.settings.workPeriod = b.dataset.k;
          if (b.dataset.k === 'custom' && !ui.hours.from) { ui.hours.from = dayKey(periodRange('month')[0]); ui.hours.to = isoDay(0); }
          haptic('select'); commit(); break;
        case 'add-entry': { const j = workJob(); openEntryEditor(null, {jobId: j && j.id, back}); return; }
        case 'entry': openEntryEditor(b.dataset.e, {back}); return;
        case 'export': openExportSheet(back); return;
        case 'st-job': ui.stats.job = b.dataset.k; haptic('select'); break;
        case 'st-period': ui.stats.period = b.dataset.k; ui.stats.offset = 0; haptic('select'); break;
        case 'st-prev': ui.stats.offset--; break;
        case 'st-next': ui.stats.offset = Math.min(0, ui.stats.offset + 1); break;
        default: return;
      }
      draw();
    });
    inner.addEventListener('change', e => {
      const t = e.target, p = pr();
      if (t.id === 'pomo-card' || t.id === 'pomo-job') {
        if (t.id === 'pomo-card') { p.cardId = t.value || null; if (p.cardId) p.jobId = null; }
        else p.jobId = t.value || null;
        if (p.phase === 'work' && p.endsAt) { pomoTrackStop(); pomoTrackStart(); }
        commit(); draw();
      } else if (t.dataset.ps) {
        const k = t.dataset.ps, v = Math.round(Number(t.value));
        if (!(v >= 1 && v <= Number(t.max))) { t.value = state.pomo[k]; return; }
        const wasFresh = p.left == null || p.left === pomoDur(p.phase);
        state.pomo[k] = v;
        if (!p.endsAt && p.phase !== 'idle' && wasFresh) p.left = pomoDur(p.phase);
        commit(); draw();
      } else if (t.dataset.pt) { state.pomo[t.dataset.pt] = t.checked; haptic('select'); save(); }
      else if (t.id === 'hrs-from' || t.id === 'hrs-to') { ui.hours[t.id === 'hrs-from' ? 'from' : 'to'] = t.value; draw(); }
    });
  }, {cls: 'tall', onClose: () => { timeDraw = null; }});
}

function openTaskSheet(key) {
  const j = workJob(); if (!j) return;
  openSheet((inner, close) => {
    const draw = () => {
      const t = tasksForJob(j.id).find(x => x.key === key);
      if (!t) { close(); openTimePanel('hours'); return; }
      const now = Date.now();
      const es = state.entries.filter(e => (e.jobId || null) === j.id && taskKey(e) === key).sort((a, b) => b.start - a.start);
      const groups = new Map();
      es.forEach(e => { const k = dayKey(e.start); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
      const finished = es.filter(e => e.end != null).reduce((s, e) => s + (e.end - e.start), 0);
      const money = j.rate ? (t.live ? liveEarnHTML(t.live, finished / 36e5 * j.rate) : esc(fmtMoney(finished / 36e5 * j.rate, j.currency))) : '';
      inner.innerHTML = `<div class="cs-head sheet-drag">`
        + (t.cardId ? `<div class="cs-title">${esc(t.title)}</div>` : `<textarea id="tk-title" class="cs-title" rows="1" maxlength="120" aria-label="Task name">${esc(t.title)}</textarea>`)
        + `</div>`
        + `<div class="cs-where" style="padding-left:2px"><span class="tab-dot" style="--c:var(--l-${j.color})"></span><span class="muted">${esc(j.name)}</span></div>`
        + `<div class="time-row">${t.live ? `<button type="button" class="btn stop" data-x="stop">${icon('stop')}Stop</button>` : `<button type="button" class="btn primary" data-x="go">${icon('play')}${t.fresh ? 'Start' : 'Continue'}</button>`}`
        + `<button type="button" class="btn" data-x="add">${icon('plus')}Add past time</button>`
        + (t.cardId && findCard(t.cardId) ? `<button type="button" class="btn" data-x="card">Open card</button>` : '') + `</div>`
        + `<section class="cs-sec" style="margin-top:16px"><div class="cs-sec-head"><h3><label for="tk-card">Linked card</label></h3></div>`
        + `<span class="select-wrap block"><select id="tk-card" class="select"><option value="">Not linked</option>${cardOptionsHTML(t.cardId)}</select></span>`
        + `<p class="sheet-hint">Linking a card from your lists means its timer counts here too, and this task shows the card’s name.</p></section>`
        + `<section class="cs-sec"><div class="cs-sec-head"><h3>Logged time</h3><span class="mono">`
        + (t.live ? `<span data-since="${t.live.start}" data-base="${t.total - (now - t.live.start)}">${clock(t.total)}</span>` : fmtHM(t.total)) + (money ? ` · ${money}` : '') + `</span></div>`
        + ([...groups].map(([k, list]) => `<div class="day"><div class="day-head"><span>${fmtDay(k)}</span><span>${fmtHM(list.reduce((s, e) => s + entryMs(e, now), 0))}</span></div>`
          + list.map(e => `<button type="button" class="entry${e.end == null ? ' live' : ''}" data-x="entry" data-e="${e.id}"><span class="t"><b>${hhmm(e.start)}–${e.end == null ? 'now' : hhmm(e.end)}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</span>`
            + `<span class="d">${e.end == null ? `<span data-since="${e.start}">${clock(now - e.start)}</span>` : fmtHM(e.end - e.start)}</span></button>`).join('') + `</div>`).join('') || `<p class="empty sm">No time yet. Press ${t.fresh ? 'Start' : 'Continue'} or add past time.</p>`)
        + `</section>`
        + `<footer class="cs-foot"><span class="mono muted">${es.length} ${es.length === 1 ? 'entry' : 'entries'}</span><button type="button" class="btn danger" data-x="del">${icon('trash')}Delete task</button></footer>`;
      autosize($('#tk-title', inner));
    };
    draw();
    const back = () => openTaskSheet(key);
    inner.addEventListener('click', e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const t = tasksForJob(j.id).find(x => x.key === key); if (!t) return;
      switch (b.dataset.x) {
        case 'go': unlockAudio(); haptic('tap'); startTracking({cardId: t.cardId, jobId: j.id, title: t.title}); commit(); draw(); return;
        case 'stop': haptic('tap'); stopTracking(); commit(); draw(); return;
        case 'add': openEntryEditor(null, {jobId: j.id, cardId: t.cardId, title: t.title, back}); return;
        case 'card': close(); openCard(t.cardId); return;
        case 'entry': openEntryEditor(b.dataset.e, {back}); return;
        case 'del':
          close();
          withUndo(`Deleted “${t.title}”${t.total ? ` and its ${fmtHM(t.total)}` : ''}`, () => {
            const r = running(); if (r && (r.jobId || null) === j.id && taskKey(r) === key) stopTracking();
            state.entries = state.entries.filter(x => !((x.jobId || null) === j.id && taskKey(x) === key));
            state.wtasks = state.wtasks.filter(w => !(w.jobId === j.id && wKey(w) === key));
          });
          openTimePanel('hours');
      }
    });
    inner.addEventListener('input', e => { if (e.target.id === 'tk-title') autosize(e.target); });
    inner.addEventListener('keydown', e => { if (e.target.id === 'tk-title' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.target.blur(); } });
    inner.addEventListener('change', e => {
      if (e.target.id === 'tk-card') {
        const v = e.target.value || null;
        key = linkTask(j, key, v);
        haptic('select'); commit(); draw();
        toast(v ? 'Linked. Time on that card now counts here.' : 'Unlinked from the card');
        return;
      }
      if (e.target.id !== 'tk-title') return;
      const v = e.target.value.replace(/\s+/g, ' ').trim();
      if (!v) { draw(); return; }
      state.entries.forEach(x => { if ((x.jobId || null) === j.id && taskKey(x) === key) x.title = v; });
      state.wtasks.forEach(w => { if (w.jobId === j.id && wKey(w) === key) w.title = v; });
      key = 't:' + v.toLowerCase();
      commit(); draw();
    });
  }, {cls: 'card-sheet', onClose: () => { if (!sheet) setTimeout(() => { if (!sheet) openTimePanel('hours'); }, 0); }});
}

function openEntryEditor(id, {cardId = null, jobId = null, title = '', back} = {}) {
  const ex = id ? state.entries.find(e => e.id === id) : null;
  if (id && !ex) { toast('That entry no longer exists'); if (back) back(); return; }
  const now = Date.now();
  const e = ex ? {...ex} : {id: uid(), cardId, jobId: jobId || (cardId ? jobForCard(cardId) : null), title, start: now - 3600000, end: now, note: ''};
  const card = findCard(e.cardId);
  openSheet((inner, close) => {
    inner.innerHTML = `<form novalidate><h2 class="sheet-title sheet-drag">${ex ? 'Edit time' : 'Add past time'}</h2><div class="form-grid">`
      + `<div class="fld full"><label for="en-job">Job</label><span class="select-wrap block"><select id="en-job" class="select">${jobOptions(e.jobId)}</select></span></div>`
      + `<div class="fld full"><label for="en-title">${card ? 'Card' : 'Task'}</label><input id="en-title" class="field" value="${esc(card ? card.card.title : e.title)}"${card ? ' readonly' : ''} maxlength="120" placeholder="What did you work on?" autocomplete="off"></div>`
      + `<div class="fld full"><label for="en-date">Date</label><input id="en-date" type="date" class="field" value="${dayKey(e.start)}"></div>`
      + `<div class="fld"><label for="en-start">Start</label><input id="en-start" type="time" class="field" value="${hhmm(e.start)}"></div>`
      + `<div class="fld"><label for="en-end">End</label>${e.end == null ? `<div class="running-note"><span class="live-dot"></span><span data-since="${e.start}">${clock(now - e.start)}</span></div>` : `<input id="en-end" type="time" class="field" value="${hhmm(e.end)}">`}</div>`
      + `<div class="fld full"><label for="en-note">Note</label><input id="en-note" class="field" value="${esc(e.note)}" maxlength="200" autocomplete="off"></div>`
      + `</div><p class="sheet-hint" id="en-msg" aria-live="polite"></p>`
      + `<div class="sheet-actions">${ex ? `<button type="button" class="btn danger" data-x="del">${icon('trash')}Delete</button>` : ''}<span class="grow"></span>`
      + (ex && e.end == null ? `<button type="button" class="btn" data-x="stop">${icon('stop')}Stop</button>` : '')
      + `<button type="button" class="btn" data-x="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
    const msg = $('#en-msg', inner);
    const done = () => { close(); if (back) back(); };
    inner.querySelector('form').addEventListener('submit', ev => {
      ev.preventDefault();
      const date = $('#en-date', inner).value, st = $('#en-start', inner).value, endEl = $('#en-end', inner);
      if (!date || !st || (endEl && !endEl.value)) { msg.textContent = 'Fill in the date, start and end time.'; return; }
      const start = new Date(`${date}T${st}`).getTime();
      let end = null;
      if (endEl) { end = new Date(`${date}T${endEl.value}`).getTime(); if (end <= start) end += 864e5; }
      else if (start > Date.now()) { msg.textContent = 'A running timer can’t start in the future.'; return; }
      const patch = {jobId: $('#en-job', inner).value || null, start, end, note: $('#en-note', inner).value.trim()};
      if (!card) {
        patch.title = $('#en-title', inner).value.replace(/\s+/g, ' ').trim();
        if (!patch.title) { msg.textContent = 'Name the task so you can find it later.'; $('#en-title', inner).focus(); return; }
      }
      if (ex) Object.assign(ex, patch); else state.entries.push(Object.assign(e, patch));
      commit(); toast(`Saved ${fmtHM((end ?? Date.now()) - start)}`);
      done();
    });
    inner.addEventListener('click', ev => {
      const b = ev.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === 'cancel') done();
      else if (b.dataset.x === 'stop') { ex.end = Date.now(); commit(); done(); }
      else if (b.dataset.x === 'del') { close(); withUndo('Time entry deleted', () => { state.entries.splice(state.entries.indexOf(ex), 1); }); if (back) back(); }
    });
  }, {cls: 'compact'});
}

          state.entries.forEach(e => { if (e.jobId === ex.id) e.jobId = null; });
          state.categories.forEach(c => { if (c.jobId === ex.id) delete c.jobId; c.lists.forEach(l => l.cards.forEach(k => { if (k.jobId === ex.id) delete k.jobId; })); });
          state.wtasks = state.wtasks.filter(w => w.jobId !== ex.id);
          state.jobs.splice(state.jobs.indexOf(ex), 1);
          if (state.settings.workJob === ex.id) state.settings.workJob = state.jobs[0] ? state.jobs[0].id : null;
        });

  }, {cls: 'compact'});
}
